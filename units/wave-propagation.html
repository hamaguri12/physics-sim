<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>波の伝わり方（授業用）｜3Dボード</title>
  <style>
    :root{
      --bg:#ffffff;
      --panel:rgba(240,243,252,0.95);
      --border:rgba(70,90,160,0.30);
      --text:#1a2040;
      --muted:#5566aa;
    }
    html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    #app{position:fixed;inset:0;overflow:hidden}

    /* 3Dキャンバス */
    canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

    /* 上バー */
    .topbar{
      position:absolute;left:0;top:0;right:0;z-index:5;
      display:flex;gap:8px;align-items:center;
      padding:10px 12px;
      background:linear-gradient(to bottom, rgba(255,255,255,.80), rgba(255,255,255,0));
      pointer-events:none;
    }
    .topbar a, .topbar button, .topbar .pill{pointer-events:auto}
    .btn, .pill{
      border:1px solid var(--border);
      background:var(--panel);
      color:var(--text);
      border-radius:12px;
      padding:8px 10px;
      font-size:12px;
      cursor:pointer;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      gap:6px;
    }
    .btn:hover{opacity:.9}
    .pill{cursor:default;color:var(--muted)}
    .btn.active{ outline:2px solid rgba(120,170,255,.6); }

    /* 左サイドバー */
    .sidebar{
      position:absolute;left:10px;top:56px;bottom:10px;z-index:6;
      width:280px;max-width:85vw;
      background:var(--panel);
      border:1px solid var(--border);
      border-radius:16px;
      padding:12px;
      overflow:auto;
      backdrop-filter: blur(6px);
    }
    .h{font-weight:800;font-size:13px;margin:0 0 8px}
    .sub{color:var(--muted);font-size:12px;line-height:1.5;margin:0 0 10px}
    .group{margin:10px 0 12px}
    .groupTitle{font-weight:700;font-size:12px;color:var(--text);margin:0 0 8px}
    .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
    .lbl{color:var(--muted);font-size:12px;align-self:center}
    .num{width:72px;max-width:90px}
    .row .btn{flex:1;justify-content:center}

    /* 道具箱の開閉 */
    #toolboxPanel{
      position: fixed;
      left: 16px;
      top: 72px;
      z-index: 1000;
      transition: transform 180ms ease;
      transform: translateX(0);
    }
    #toolboxPanel.is-collapsed{
      transform: translateX(calc(-100% + 36px));
    }
    #toolboxToggle.toolboxToggle{
      position: absolute;
      top: 10px;
      right: 10px;
      width: 28px;
      height: 28px;
      border-radius: 10px;
      border: 1px solid rgba(70,90,160,0.25);
      background: rgba(240,243,252,0.90);
      color: #1a2040;
      cursor: pointer;
      display: grid;
      place-items: center;
      font-weight: 700;
      line-height: 1;
    }
    #toolboxPanel.is-collapsed #toolboxToggle{
      right: 4px;
    }
    #toolboxPanel{
      overflow: hidden auto;              /* 中身が画面より長いときは縦にスクロール（横は出さない） */
      overscroll-behavior: contain;
    }
    #toolboxPanel.is-collapsed > :not(#toolboxToggle){
      display: none !important;
    }

    /* アニメーション解説ナビ */
    #autoNav{
      display:none;
      position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
      z-index:1500;
      align-items:center;gap:16px;
    }
    .auto-nav-btn{
      width:48px;height:48px;border-radius:50%;
      border:1px solid var(--border);
      background:var(--panel);
      color:var(--text);font-size:22px;font-weight:700;
      cursor:pointer;display:grid;place-items:center;
      backdrop-filter:blur(6px);
    }
    .auto-nav-btn:hover{background:rgba(50,80,140,.15)}
    .auto-nav-btn:disabled{opacity:.3;cursor:not-allowed}
    .auto-center{display:flex;flex-direction:column;align-items:center;gap:8px}
    .auto-scene-label{
      font-size:13px;color:var(--muted);
      background:var(--panel);border:1px solid var(--border);
      border-radius:10px;padding:6px 14px;
      backdrop-filter:blur(6px);white-space:nowrap;
    }
    #autoExit{
      position:fixed;top:10px;right:10px;z-index:1500;
      display:none;
    }

    /* 右下ヘルプ */
    .help{
      position:absolute;right:10px;bottom:10px;z-index:6;
      background:rgba(240,243,252,0.92);
      border:1px solid rgba(70,90,160,0.20);
      border-radius:14px;
      padding:10px 12px;
      font-size:12px;
      color:var(--muted);
      max-width:420px;
    }
    .help b{color:var(--text)}
    #inkCanvas{position:absolute;inset:0;pointer-events:none;z-index:8;}
    #inkToolbar{display:none;position:fixed;bottom:10px;left:10px;z-index:1500;gap:4px;align-items:center;}
    .pen-color-btn{border:none;background:none;padding:7px 16px;border-radius:7px;cursor:pointer;font-size:13px;text-align:left;white-space:nowrap;font-weight:600;}
    .pen-color-btn:hover{background:rgba(70,90,160,0.10);}
  /* 画面の文字は選ばせない。つまみなどを速く連打すると近くの文字が選ばれ、その選んだ文字の上を
     押して動かすとブラウザが「文字の引きずり」を始め、禁止のしるし（🚫）が出たまま操作を
     横取りされる（CLAUDE.md §8-21）。入力欄の中だけは選べるままにしておく */
  #app{user-select:none}
  #app input,#app textarea,#app select{user-select:auto}
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
    }
  }
  </script>
  <script data-goatcounter="https://hamaguri12-physics-sim.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</head>
<body>
  <div id="app">
    <canvas id="c"></canvas>
    <canvas id="wave2dCanvas" style="position:absolute;inset:0;display:none;pointer-events:none;"></canvas>
    <canvas id="inkCanvas"></canvas>

    <!-- 上バー -->
    <div class="topbar">
      <a class="btn" href="../index.html">← ホーム</a>
      <span class="pill">波の伝わり方</span>
      <button class="btn" id="btnAutoSim">▶ アニメーション解説</button>
      <div id="s5SlitBtns" style="display:none;gap:4px;">
        <button class="btn active" id="s5Btn2">２本</button>
        <button class="btn" id="s5Btn4">４本</button>
      </div>
      <button class="btn" id="btn2D" style="display:none;">2D</button>
      <div id="s6ColorBtns" style="display:none;gap:4px;">
        <button class="btn active" id="s6BtnRed" style="color:#cc2222;">赤</button>
        <button class="btn active" id="s6BtnRedArc" style="color:#cc2222;">赤半円</button>
        <button class="btn active" id="s6BtnBlue" style="color:#2244cc;">青</button>
        <button class="btn active" id="s6BtnBlueArc" style="color:#2244cc;">青半円</button>
        <button class="btn" id="s6BtnFringe" style="color:#44aa22;">明線</button>
        <button class="btn" id="s6BtnPoint"  style="color:#66bb22;">ポイント</button>
        <button class="btn active s6BtnOrder" data-idx="0" style="color:#884400;">-3次</button>
        <button class="btn active s6BtnOrder" data-idx="1" style="color:#884400;">-2次</button>
        <button class="btn active s6BtnOrder" data-idx="2" style="color:#884400;">-1次</button>
        <button class="btn active s6BtnOrder" data-idx="3" style="color:#884400;">0次</button>
        <button class="btn active s6BtnOrder" data-idx="4" style="color:#884400;">+1次</button>
        <button class="btn active s6BtnOrder" data-idx="5" style="color:#884400;">+2次</button>
        <button class="btn active s6BtnOrder" data-idx="6" style="color:#884400;">+3次</button>
        <button class="btn" id="s6BtnPointClear" style="display:none;color:#cc4400;">全て削除</button>
      </div>
    </div>

    <!-- アニメーション解説ナビ -->
    <button class="btn" id="autoExit">✕ 通常に戻る</button>
    <div id="autoNav">
      <button class="auto-nav-btn" id="autoPrev">＜</button>
      <div class="auto-center">
        <button class="auto-nav-btn" id="autoPlay">▶</button>
        <span class="auto-scene-label" id="autoSceneLabel">1 / 1</span>
      </div>
      <button class="auto-nav-btn" id="autoNext">＞</button>
    </div>

    <!-- ペン/消しゴムツールバー（アニメーション解説中のみ表示） -->
    <div id="inkToolbar">
      <button class="btn" id="autoPen">ペン</button>
      <button class="btn" id="autoEraser">消しゴム</button>
      <button class="btn" id="autoInkClear">ペンを全消し</button>
      <button class="btn" id="inkUndo" disabled>↩</button>
      <button class="btn" id="inkRedo" disabled>↪</button>
    </div>

    <!-- ペン色選択メニュー -->
    <div id="penColorMenu" style="display:none;position:fixed;z-index:2000;background:rgba(240,243,252,0.97);border:1px solid rgba(70,90,160,0.30);border-radius:10px;box-shadow:0 4px 14px rgba(20,30,60,0.18);padding:6px;flex-direction:column;gap:2px;">
      <button class="pen-color-btn" data-color="rgba(255,40,40,1)" style="color:#e01010;">● 赤</button>
      <button class="pen-color-btn" data-color="rgba(30,80,220,1)" style="color:#1e50dc;">● 青</button>
      <button class="pen-color-btn" data-color="rgba(60,190,50,1)" style="color:#3cbe32;">● 黄緑</button>
    </div>

    <!-- 場面6 ポイント削除コンテキストメニュー -->
    <div id="s6PointCtxMenu" style="display:none;position:fixed;z-index:600;background:rgba(240,243,252,0.97);border:1px solid rgba(70,90,160,0.30);border-radius:10px;box-shadow:0 4px 14px rgba(20,30,60,0.18);padding:4px;">
      <button id="s6PointDeleteBtn" type="button" style="display:flex;align-items:center;gap:7px;border:none;background:none;padding:8px 16px;border-radius:7px;cursor:pointer;font-size:13px;color:#1a2040;white-space:nowrap">
        🗑️ 削除
      </button>
    </div>

    <!-- 左サイドバー：道具箱 -->
    <aside class="sidebar" id="toolboxPanel">
      <button id="toolboxToggle" class="toolboxToggle" type="button" aria-expanded="false">＞</button>

      <p class="h">道具箱</p>

      <div class="group">
        <p class="groupTitle">視点</p>
        <div class="row">
          <button class="btn" id="viewXY">XY視点（正面）</button>
        </div>
      </div>

      <div class="group">
        <p class="groupTitle">青い波の初期時刻</p>
        <div id="yx2TimeGroup" style="display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:8px">
          <button class="btn active" data-offset="0"    style="justify-content:center">2T</button>
          <button class="btn"        data-offset="0.25" style="justify-content:center">9T/4</button>
          <button class="btn"        data-offset="0.5"  style="justify-content:center">5T/2</button>
          <button class="btn"        data-offset="0.75" style="justify-content:center">11T/4</button>
          <button class="btn"        data-offset="1"    style="justify-content:center">3T</button>
        </div>
      </div>

      <div class="group">
        <p class="groupTitle">単振動</p>
        <div class="row">
          <span class="lbl">D</span>
          <input id="circD" class="num" type="number" value="4" step="0.5" min="0" />
          <span class="lbl">T</span>
          <input id="circT" class="num" type="number" value="4" step="0.5" min="0.1" />
        </div>
        <div class="row">
          <button class="btn" id="circToggle">▶ 開始</button>
          <button class="btn" id="circReset">↺ リセット</button>
        </div>
        <div class="row" style="margin-top:6px">
          <button class="btn active" id="toggleRed"  style="justify-content:center;color:#BE461E">赤</button>
          <button class="btn active" id="toggleBlue" style="justify-content:center;color:#2255cc">青</button>
          <button class="btn active" id="toggleRes"  style="justify-content:center;color:#66cc00">合成波</button>
        </div>
      </div>

    </aside>

    <div class="help">
      <b>操作</b>：ドラッグ＝視点回転／ホイール＝ズーム／右ドラッグ＝平行移動
    </div>
  </div>

  <!-- エラー表示 -->
  <div id="errOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:99999;padding:24px;overflow:auto;">
    <div style="background:#1a0808;border:2px solid #cc3333;border-radius:10px;padding:18px;max-width:820px;margin:auto;color:#ffcccc;font-family:monospace;font-size:12px;">
      <div style="color:#ff5555;font-size:14px;font-weight:bold;margin-bottom:10px;">⚠ JavaScript Error</div>
      <pre id="errMsg" style="white-space:pre-wrap;word-break:break-all;margin:0;"></pre>
    </div>
  </div>
  <script>
  window.addEventListener('error', (e) => {
    const el = document.getElementById('errOverlay');
    const msg = document.getElementById('errMsg');
    if (el && msg) {
      el.style.display = 'block';
      msg.textContent += (e.message || 'Unknown error') + '\n' +
        (e.filename ? '  at ' + e.filename + ':' + e.lineno + ':' + e.colno + '\n' : '') +
        (e.error?.stack ? e.error.stack : '') + '\n\n';
    }
  });
  window.addEventListener('unhandledrejection', (e) => {
    const el = document.getElementById('errOverlay');
    const msg = document.getElementById('errMsg');
    if (el && msg) {
      el.style.display = 'block';
      msg.textContent += 'Unhandled Promise rejection:\n' +
        (e.reason?.message || String(e.reason) || 'Unknown') + '\n' +
        (e.reason?.stack || '') + '\n\n';
    }
  });
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { Line2 }        from 'three/addons/lines/Line2.js';
    import { LineGeometry } from 'three/addons/lines/LineGeometry.js';
    import { LineMaterial } from 'three/addons/lines/LineMaterial.js';

    // ===== 基本セットアップ =====
    const canvas = document.getElementById('c');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(2, window.devicePixelRatio));

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xffffff);

    // ===== アニメーション解説用の別シーン =====
    const autoScene = new THREE.Scene();
    autoScene.background = new THREE.Color(0xffffff);
    autoScene.add(new THREE.AmbientLight(0xffffff, 1.0));

    const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 200);
    camera.position.set(0, 8, 18);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.target.set(0, 0, 0);
    controls.zoomToCursor = true;
    controls.update();

    // ライト
    scene.add(new THREE.AmbientLight(0xffffff, 1.0));
    const dir = new THREE.DirectionalLight(0xffffff, 0.70);
    dir.position.set(6, 10, 6);
    scene.add(dir);

    // 地面グリッド（2.5×2.5 マス、8×8）
    const grid = new THREE.GridHelper(20, 8, 0x9bb0d0, 0xc8d6e8);
    grid.position.y = 0;
    scene.add(grid);


    // ===== y-x グラフ =====
    const YX_X_START  = -10;
    const YX_X_END    =  10;
    const YX_Y_BASE   =   5;
    const YX_Z        =   0;
    const YX_N_POINTS = 400;

    // y=0 基準線（x軸）
    {
      const pts = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(YX_X_START, YX_Y_BASE, YX_Z),
        new THREE.Vector3(YX_X_END,   YX_Y_BASE, YX_Z),
      ]);
      const axisLine = new THREE.Line(pts, new THREE.LineBasicMaterial({ color: 0x7788aa }));
      scene.add(axisLine);
    }

    let yxLine      = null;
    let yxGeo       = null;
    let yxPositions = null;
    let yxMat       = null;

    function ensureYxGraph() {
      if (yxLine) return;
      yxPositions = new Float32Array(YX_N_POINTS * 3);
      for (let i = 0; i < YX_N_POINTS; i++) {
        yxPositions[i*3]   = YX_X_START + (YX_X_END - YX_X_START) * i / (YX_N_POINTS - 1);
        yxPositions[i*3+1] = YX_Y_BASE;
        yxPositions[i*3+2] = YX_Z;
      }
      yxGeo = new LineGeometry();
      yxGeo.setPositions(yxPositions);
      const { w, h } = { w: window.innerWidth, h: window.innerHeight };
      yxMat = new LineMaterial({ color: 0xBE461E, linewidth: 2, resolution: new THREE.Vector2(w, h), dashed: true, dashSize: 0.8, gapSize: 0.4 });
      yxLine = new Line2(yxGeo, yxMat);
      scene.add(yxLine);
      yxLine.computeLineDistances();
    }

    function resetYxGraph() {
      ensureYxGraph();
      for (let i = 0; i < YX_N_POINTS; i++) yxPositions[i*3+1] = YX_Y_BASE;
      updateLine2Y(yxGeo, yxPositions, YX_N_POINTS);
    }

    // ===== y-x グラフ（青）=====
    const YX2_Y_OFFSET = -0.15; // 青グラフを少し下にずらす
    let yx2OffsetFrac = 0; // 青波の初期時刻オフセット（T の倍数）

    let yx2Line      = null;
    let yx2Geo       = null;
    let yx2Positions = null;
    let yx2Mat       = null;

    function ensureYx2Graph() {
      if (yx2Line) return;
      yx2Positions = new Float32Array(YX_N_POINTS * 3);
      for (let i = 0; i < YX_N_POINTS; i++) {
        yx2Positions[i*3]   = YX_X_START + (YX_X_END - YX_X_START) * i / (YX_N_POINTS - 1);
        yx2Positions[i*3+1] = YX_Y_BASE;
        yx2Positions[i*3+2] = YX_Z;
      }
      yx2Geo = new LineGeometry();
      yx2Geo.setPositions(yx2Positions);
      const { w, h } = { w: window.innerWidth, h: window.innerHeight };
      yx2Mat = new LineMaterial({ color: 0x2255cc, linewidth: 2, resolution: new THREE.Vector2(w, h), dashed: true, dashSize: 0.8, gapSize: 0.4 });
      yx2Line = new Line2(yx2Geo, yx2Mat);
      scene.add(yx2Line);
      yx2Line.computeLineDistances();
    }

    function drawYx2AtElapsed(elapsed) {
      ensureYx2Graph();
      const omega   = Math.PI * 2 / circ.T;
      const v_world = (YX_X_END - YX_X_START) / (2 * circ.T);
      for (let i = 0; i < YX_N_POINTS; i++) {
        const worldX  = YX_X_START + (YX_X_END - YX_X_START) * i / (YX_N_POINTS - 1);
        const waveAge = elapsed - (worldX - YX_X_START) / v_world;
        yx2Positions[i*3+1] = YX_Y_BASE + (waveAge >= 0 ? circ.r * Math.sin(omega * waveAge) : 0);
      }
      updateLine2Y(yx2Geo, yx2Positions, YX_N_POINTS);
    }

    // ===== 合成波 =====
    let yxResLine      = null;
    let yxResGeo       = null;
    let yxResPositions = null;
    let yxResMat       = null;

    function ensureYxResGraph() {
      if (yxResLine) return;
      yxResPositions = new Float32Array(YX_N_POINTS * 3);
      for (let i = 0; i < YX_N_POINTS; i++) {
        yxResPositions[i*3]   = YX_X_START + (YX_X_END - YX_X_START) * i / (YX_N_POINTS - 1);
        yxResPositions[i*3+1] = YX_Y_BASE;
        yxResPositions[i*3+2] = YX_Z;
      }
      yxResGeo = new LineGeometry();
      yxResGeo.setPositions(yxResPositions);
      const { w, h } = { w: window.innerWidth, h: window.innerHeight };
      yxResMat = new LineMaterial({ color: 0x66cc00, linewidth: 2, resolution: new THREE.Vector2(w, h) });
      yxResLine = new Line2(yxResGeo, yxResMat);
      scene.add(yxResLine);
    }

    // Line2 バッファ直接更新ヘルパー
    // （LineGeometry 内部バッファの layout: [p0, p1, p1, p2, p2, ...] × 6 float/slot）
    function updateLine2Y(geo, positions, n) {
      const buf = geo.attributes.instanceStart.data.array;
      for (let j = 0; j < n; j++) {
        const y = positions[j * 3 + 1];
        if (j < n - 1) buf[j * 6 + 1] = y;        // instanceStart[j].y
        if (j > 0)     buf[(j - 1) * 6 + 4] = y;  // instanceEnd[j-1].y
      }
      geo.attributes.instanceStart.data.needsUpdate = true;
    }
    // XY両方を更新するヘルパー（点線用：xs/ys は通常の配列、n 点分）
    function updateLine2XY(geo, xs, ys, n) {
      const buf = geo.attributes.instanceStart.data.array;
      for (let j = 0; j < n; j++) {
        if (j < n - 1) { buf[j*6]     = xs[j]; buf[j*6 + 1] = ys[j]; }
        if (j > 0)     { buf[(j-1)*6+3] = xs[j]; buf[(j-1)*6+4] = ys[j]; }
      }
      geo.attributes.instanceStart.data.needsUpdate = true;
    }

    // 全グラフを elapsed 時刻で一括描画
    function redrawGraphs(elapsed) {
      const omega   = Math.PI * 2 / circ.T;
      const v_world = (YX_X_END - YX_X_START) / (2 * circ.T);
      for (let i = 0; i < YX_N_POINTS; i++) {
        const worldX   = YX_X_START + (YX_X_END - YX_X_START) * i / (YX_N_POINTS - 1);

        const d1 = age1 >= 0 ? circ.r * Math.sin(omega * age1) : 0;
        const d2 = age2 >= 0 ? circ.r * Math.sin(omega * age2) : 0;
        yxPositions[i*3+1]    = YX_Y_BASE + d1;
        yx2Positions[i*3+1]   = YX_Y_BASE + d2 + YX2_Y_OFFSET;
        yxResPositions[i*3+1] = YX_Y_BASE + d1 + d2;

      updateLine2Y(yx2Geo,   yx2Positions,   YX_N_POINTS);

      viewTween = {
        startPos:    camera.position.clone(),
        endPos:      center.clone().add(dir.multiplyScalar(dist)),
        startTarget: controls.target.clone(),
        endTarget:   center.clone(),
        startTime:   nowSec(),
        dur: 0.35,
      };
    }

    function updateViewSnap(t) {
      if (!viewTween) return;
      const u = Math.min(1, (t - viewTween.startTime) / viewTween.dur);
      const k = u * u * (3 - 2 * u); // easeInOut
      camera.position.lerpVectors(viewTween.startPos, viewTween.endPos, k);
      controls.target.lerpVectors(viewTween.startTarget, viewTween.endTarget, k);
      controls.update();
      if (u >= 1) viewTween = null;

              // 波の延長
              for (let i = 0; i <= EXT_N; i++) {
                const dx = s0 + extension * (i / EXT_N);
                const dz = S8_AMP * Math.sin(s8k * dx);
                ext.wArr[i*3]   = S8_XSTART + dx*cosT - dz*sinT;
                ext.wArr[i*3+1] = 0;
                ext.wArr[i*3+2] = zCenter   + dx*sinT + dz*cosT;
              }
              ext.wGeo.attributes.position.needsUpdate = true;
            };
            updateExt(blueExt,  13, autoS8KnobZ < 0);
            updateExt(redExt,  -13, autoS8KnobZ > 0);
            if (autoS8Knob) {
              autoS8Knob.position.x = S8_XSTART + knobDx*cosT;
              autoS8Knob.position.z = knobDx*sinT;
            }
          };

          // 9波長目・中心に黒い球（つまみ）
          autoS8KnobXPos = S8_XSTART + 9 * S8_LAM;
          autoS8Knob = new THREE.Mesh(
            new THREE.SphereGeometry(1.0, 16, 16),
            new THREE.MeshBasicMaterial({ color: 0x000000 })
          );
          autoS8Knob.position.set(autoS8KnobXPos, 0, 0);
          autoScene.add(autoS8Knob); autoSceneObjects.push(autoS8Knob);
          drawS8Waves();

          // ドラッグイベント（左クリックのみ）
          _s8PD = (e) => {
            if (!autoS8WasActive || !autoOrthoCamera || e.button !== 0) return;
            const raycaster = new THREE.Raycaster();
            const ndcX = (e.clientX / window.innerWidth) * 2 - 1;
            const ndcY = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(new THREE.Vector2(ndcX, ndcY), autoOrthoCamera);
            if (raycaster.intersectObject(autoS8Knob).length > 0) {
              autoS8Dragging = true;
              autoS8DragStartZ     = new THREE.Vector3(ndcX, ndcY, 0).unproject(autoOrthoCamera).z;
              autoS8DragStartKnobZ = autoS8KnobZ;
              if (autoOrthoControls) autoOrthoControls.enabled = false;
              e.stopPropagation();
            }
          };
          _s8PM = (e) => {
            if (!autoS8Dragging || !autoOrthoCamera) return;
            const ndcX = (e.clientX / window.innerWidth) * 2 - 1;
            const ndcY = -(e.clientY / window.innerHeight) * 2 + 1;
            const worldZ = new THREE.Vector3(ndcX, ndcY, 0).unproject(autoOrthoCamera).z;
            autoS8KnobZ = autoS8DragStartKnobZ + (worldZ - autoS8DragStartZ) * 1.5;
            drawS8Waves();
            e.stopPropagation();
          };
          _s8PU = () => {
            if (autoS8Dragging) {
              autoS8Dragging = false;
              if (autoOrthoControls) autoOrthoControls.enabled = true;
            }
          };
          renderer.domElement.addEventListener('pointerdown', _s8PD, true);
          renderer.domElement.addEventListener('pointermove', _s8PM, true);
          renderer.domElement.addEventListener('pointerup',   _s8PU, true);
        },
      },
    ];

    // ===== 場面6: 3D空間内 実線/点線 波ライン =====
    const S6_MAX_RINGS  = 40;  // ceil(118/3)+1 → メッシュ角(x=105,z=±70)まで届くリング数
    const S6_N_HALF     = 32;  // 弧の分割数
    const S6_SLIT_MAX_R = 75;  // 半径70の半円クリップ + スリットオフセット5 = 最大75
    const S6_Z_BOUND    = 70;  // 長方形クリップ：z方向の境界
    const S6_X_MAX      = S5_MESH_OFFSET_X + S5_GRID_X / 2; // メッシュ右端 x=105

    function createS6LineGroup() {
      const group = new THREE.Group();
      const DASH = 0.5, GAP = 0.5;
      const mats = {
        rightS:  new THREE.LineBasicMaterial({ color: 0xdd2222 }),
        rightT:  new THREE.LineDashedMaterial({ color: 0xdd2222, dashSize: DASH, gapSize: GAP }),
        leftS:   new THREE.LineBasicMaterial({ color: 0x2244dd }),
        leftT:   new THREE.LineDashedMaterial({ color: 0x2244dd, dashSize: DASH, gapSize: GAP }),
        firstS:  new THREE.LineBasicMaterial({ color: 0x888888 }),
        firstT:  new THREE.LineDashedMaterial({ color: 0x888888, dashSize: DASH, gapSize: GAP }),
      };

      function makeRings(mat) {
        const arr = [];
        for (let i = 0; i < S6_MAX_RINGS; i++) {
          const makeLine = () => {
            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array((S6_N_HALF + 1) * 3), 3));
            const ln = new THREE.Line(geo, mat);
            ln.userData.dashed = mat instanceof THREE.LineDashedMaterial;
            ln.frustumCulled = false;
            ln.visible = false;
            group.add(ln);
            return ln;
          };
          // ペア[下弧/全弧, 上弧] — r>S6_X_MAX-cx のとき2本に分割
          arr.push([makeLine(), makeLine()]);
        }
        return arr;
      }

      group.userData.rings = {
        rightPeak:       makeRings(mats.rightS),
        rightTrough:     makeRings(mats.rightT),
        leftPeak:        makeRings(mats.leftS),
        leftTrough:      makeRings(mats.leftT),
        firstSlitPeak:   makeRings(mats.firstS),
        firstSlitTrough: makeRings(mats.firstT),
      };
      group.userData.mats = mats;  // 色ON/OFFのためにマテリアルを外部から参照できるよう保存
      return group;
    }

    function updateS6LineGroup(dt) {
      if (!autoS6LineGroup) return;
      const rings = autoS6LineGroup.userData.rings;
      const SPEED = 2.5, LAM = 3.0, BARRIER = 15.0;
      const BASE_PATH = 15 + Math.sqrt(250);  // 平面波15 + 第1→第2スリット距離√250 ≈ 30.81
      const R_slit = Math.max(0, SPEED * dt - BASE_PATH);

      // pair = [lineA, lineB] を受け取る（lineB は今後の拡張用、常に非表示）
      function updateHalfArc(pair, cx, cz, r) {
        const [lineA, lineB] = pair;
        lineB.visible = false;
        const RADIAL_MAX = 70.0;
        const dxMax = Math.min(S6_X_MAX - cx, RADIAL_MAX + Math.abs(cz));
        if (r <= 0.05 || r > dxMax) { lineA.visible = false; return; }

        // θ-parametrization（角度均等配置）で直線化を防ぐ
        // z-clip → sin(θ) の範囲に変換: z = cz + r*sin(θ)
        let sinLo = Math.max(-1, (-S6_Z_BOUND - cz) / r);
        let sinHi = Math.min( 1, ( S6_Z_BOUND - cz) / r);
        // 第2壁中心(cx,0)から半径70の半円クリップ: r²+cz²+2·cz·r·sin(θ) ≤ RADIAL_MAX²
        const D = RADIAL_MAX * RADIAL_MAX - r * r - cz * cz;
        if      (cz > 0) sinHi = Math.min(sinHi, D / (2 * cz * r));
        else if (cz < 0) sinLo = Math.max(sinLo, D / (2 * cz * r));
        sinLo = Math.max(-1, sinLo);
        sinHi = Math.min( 1, sinHi);
        const thLo  = Math.asin(sinLo);
        const thHi  = Math.asin(sinHi);
        if (thHi <= thLo + 1e-6) { lineA.visible = false; return; }

        const pos = lineA.geometry.attributes.position.array;
        for (let j = 0; j <= S6_N_HALF; j++) {
          const th = thLo + (thHi - thLo) * j / S6_N_HALF;
          pos[j*3]   = cx + r * Math.cos(th);
          pos[j*3+1] = 0;
          pos[j*3+2] = cz + r * Math.sin(th);
        }
        lineA.geometry.attributes.position.needsUpdate = true;
        lineA.visible = true;
        if (lineA.userData.dashed) lineA.computeLineDistances();
      }

      // 常に可視範囲(0 < r ≤ SLIT_MAX_R)に入るリング番号から開始する
      // R_slit - offset - n*LAM ≤ SLIT_MAX_R → n ≥ (R_slit - offset - SLIT_MAX_R)/LAM
      const peakN0   = Math.max(0, Math.ceil((R_slit - 0.75 * LAM - S6_SLIT_MAX_R) / LAM));
      const troughN0 = Math.max(0, Math.ceil((R_slit - 0.25 * LAM - S6_SLIT_MAX_R) / LAM));

      for (let i = 0; i < S6_MAX_RINGS; i++) {
        const rP = R_slit - 0.75 * LAM - (peakN0 + i) * LAM;
        const rT = R_slit - 0.25 * LAM - (troughN0 + i) * LAM;
        updateHalfArc(rings.rightPeak[i],   BARRIER,  5, rP);
        updateHalfArc(rings.rightTrough[i], BARRIER,  5, rT);
        updateHalfArc(rings.leftPeak[i],    BARRIER, -5, rP);
        updateHalfArc(rings.leftTrough[i],  BARRIER, -5, rT);
      }

      // 第1スリット(0,0)からの円形波弧（x=[0,BARRIER], z=[-20,20]に制限）
      function updateFirstSlitArc(pair, r) {
        const [lineA, lineB] = pair;
        lineB.visible = false;
        if (r <= 0.05 || r > BARRIER) { lineA.visible = false; return; }
        const Z0 = 20.0;
        const sinLo = Math.max(-1, -Z0 / r);
        const sinHi = Math.min( 1,  Z0 / r);
        const thLo  = Math.asin(sinLo);
        const thHi  = Math.asin(sinHi);
        if (thHi <= thLo + 1e-6) { lineA.visible = false; return; }
        const pos = lineA.geometry.attributes.position.array;
        for (let j = 0; j <= S6_N_HALF; j++) {
          const th = thLo + (thHi - thLo) * j / S6_N_HALF;
          pos[j*3]   = r * Math.cos(th);
          pos[j*3+1] = 0;
          pos[j*3+2] = r * Math.sin(th);
        }
        lineA.geometry.attributes.position.needsUpdate = true;
        lineA.visible = true;
        if (lineA.userData.dashed) lineA.computeLineDistances();
      }

      const R_slit0    = Math.max(0, SPEED * dt - 15);
      const peakN0_0   = Math.max(0, Math.ceil((R_slit0 - 0.75 * LAM - BARRIER) / LAM));
      const troughN0_0 = Math.max(0, Math.ceil((R_slit0 - 0.25 * LAM - BARRIER) / LAM));
      for (let i = 0; i < S6_MAX_RINGS; i++) {
        const rP0 = R_slit0 - 0.75 * LAM - (peakN0_0 + i) * LAM;
        const rT0 = R_slit0 - 0.25 * LAM - (troughN0_0 + i) * LAM;
        updateFirstSlitArc(rings.firstSlitPeak[i],   rP0);
        updateFirstSlitArc(rings.firstSlitTrough[i], rT0);
      }
    }

    // ===== 場面7: スリット→球の線アニメーション =====
    function createS7PathLines() {
      const N = 1000;
      const redMat  = new THREE.LineBasicMaterial({ color: 0xdd2222 });
      const blueMat = new THREE.LineBasicMaterial({ color: 0x2244dd });
      autoS7PathLines = [];
      autoS7Spheres.forEach((sph, i) => {
        const ordVis = i < s6ShowOrders.length ? s6ShowOrders[i] : true;
        const mkCenter = (mat, vis) => {
          const geo = new THREE.BufferGeometry();
          geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(6), 3));
          const ln = new THREE.Line(geo, mat);
          ln.frustumCulled = false; ln.visible = vis;
          autoScene.add(ln); autoSceneObjects.push(ln);
          return ln;
        };
        const mkWave = (mat, vis) => {
          const geo = new THREE.BufferGeometry();
          geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array((N + 1) * 3), 3));
          geo.setDrawRange(0, 0);
          const ln = new THREE.Line(geo, mat);
          ln.frustumCulled = false; ln.visible = vis;
          autoScene.add(ln); autoSceneObjects.push(ln);
          return ln;
        };
        autoS7PathLines.push({
          red:    mkCenter(redMat,  s6ShowRed  && ordVis),
          blue:   mkCenter(blueMat, s6ShowBlue && ordVis),
          redWav: mkWave(redMat,    s6ShowRed  && ordVis),
          bluWav: mkWave(blueMat,   s6ShowBlue && ordVis),
          target: sph.position.clone(),
          N,
        });
      });
    }

    function updateS7PathLines(elapsed) {
      const t = Math.min(1, elapsed / 1.0);
      const LAM = 3.0, SPEED = 2.5;
      const k         = 2 * Math.PI / LAM;
      const BASE_PATH = 15 + Math.sqrt(250);
      const omega     = SPEED * k;
      const TIME = 45, AMP = 0.7;
      const SLITS = [[15, 0, 5], [15, 0, -5]];

      autoS7PathLines.forEach(({ red, redWav, blue, bluWav, target, N }) => {
        const entries = [[red, redWav, SLITS[0]], [blue, bluWav, SLITS[1]]];
        entries.forEach(([ctr, wav, s]) => {
          // 中心軸線
          const ca = ctr.geometry.attributes.position.array;
          ca[0]=s[0]; ca[1]=0; ca[2]=s[2];
          ca[3]=s[0]+(target.x-s[0])*t; ca[4]=0; ca[5]=s[2]+(target.z-s[2])*t;
          ctr.geometry.attributes.position.needsUpdate = true;

          // 連続sin曲線（Y方向に振動）
          const dx=target.x-s[0], dz=target.z-s[2];
          const dist=Math.sqrt(dx*dx+dz*dz);
          const dirX=dx/dist, dirZ=dz/dist;
          const nPts = Math.floor(t * N) + 1;
          const wa = wav.geometry.attributes.position.array;
          for (let i=0; i<nPts; i++) {
            const si = (i / N) * dist;
            wa[i*3]   = s[0] + dirX * si;
            wa[i*3+1] = AMP * Math.sin(k * (BASE_PATH + si) - omega * TIME);
            wa[i*3+2] = s[2] + dirZ * si;
          }
          wav.geometry.attributes.position.needsUpdate = true;
          wav.geometry.setDrawRange(0, nPts);
        });
      });
    }

    // ===== 場面6: 明線（干渉強め合い）グループ =====
    function createS6FringeGroup() {
      const group   = new THREE.Group();
      const BARRIER = 15.0, LAM = 3.0, SLIT_Z = 5.0;
      const Z_BOUND = S5_GRID_SIZE / 2;       // 70
      const X_MAX   = S6_X_MAX; // 105（メッシュ右端）
      const N_X     = 300;
      const mat     = new THREE.LineBasicMaterial({ color: 0x66ee22 });

      // 光路差 = sqrt(L²+(z-SLIT_Z)²) - sqrt(L²+(z+SLIT_Z)²)
      // 単調減少関数（z増→値減）、z=0で0
      function pathDiff(L, z) {
        return Math.sqrt(L*L + (z-SLIT_Z)*(z-SLIT_Z))
             - Math.sqrt(L*L + (z+SLIT_Z)*(z+SLIT_Z));
      }

      // 二分探索で光路差 = target となる z を返す（見つからない場合 null）
      function findZ(L, target) {
        if (Math.abs(target) < 1e-9) return 0;
        let a, b;
        if (target > 0) {
          a = -Z_BOUND; b = 0;
          if (pathDiff(L, a) < target) return null; // z=-Z_BOUND でも target に届かない
        } else {
          a = 0; b = Z_BOUND;
          if (pathDiff(L, b) > target) return null;
        }
        for (let k = 0; k < 60; k++) {
          const m = (a + b) / 2;
          if (pathDiff(L, m) > target) a = m; else b = m;
        }
        return (a + b) / 2;
      }

      // n = -3〜+3 の明線（光路差 = n*λ）をそれぞれ折れ線で描画
      for (let n = -3; n <= 3; n++) {
        const target = n * LAM;
        const pts = [];
        for (let ix = 0; ix <= N_X; ix++) {
          const x = BARRIER + (X_MAX - BARRIER) * ix / N_X;
          const L = x - BARRIER;
          const z = findZ(L, target);
          if (z === null) break; // 表示範囲外に出た
          if (L * L + z * z > 4900) break; // 第2壁中心から半径70の半円クリップ
          pts.push(x, 0, z);
        }
        if (pts.length >= 6) {
          const geo = new THREE.BufferGeometry();
          geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(pts), 3));
          const line = new THREE.Line(geo, mat);
          line.frustumCulled = false;
          group.add(line);
        }
      }
      return group;
    }

        if (!s6PointMode || !autoMode || autoSceneIndex !== 5) return;
        if (autoPlayStartTime === null) return;

        // y=0 平面へのレイキャスト
        const rect = canvas.getBoundingClientRect();
        const mouse = new THREE.Vector2(
          ((e.clientX - rect.left) / rect.width) * 2 - 1,
          -((e.clientY - rect.top) / rect.height) * 2 + 1
        );
        const raycaster = new THREE.Raycaster();
        raycaster.setFromCamera(mouse, camera);
        const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
        const hit = new THREE.Vector3();
        if (!raycaster.ray.intersectPlane(groundPlane, hit)) return;

        const wx = hit.x, wz = hit.z;
        const BARRIER = 15.0, SPEED = 2.5, LAM = 3.0;
        const BASE_PATH = 15 + Math.sqrt(250);
        if (wx < BARRIER) return;

        // ポーズ中は停止時刻のdt、再生中は現在のdt
        const dt = autoWavePaused
          ? autoWavePauseWallTime - autoPlayStartTime
          : nowSec() - autoPlayStartTime;
        const R_slit = Math.max(0, SPEED * dt - BASE_PATH);
        if (R_slit <= 0) return;

        // 第2スリット(BARRIER, ±5)からの距離
        const dx = wx - BARRIER;
        const r1 = Math.sqrt(dx*dx + (wz - 5)*(wz - 5));  // 右スリット z=+5
        const r2 = Math.sqrt(dx*dx + (wz + 5)*(wz + 5));  // 左スリット z=-5

        // 実線(ピーク)と点線(トラフ)の両方を対象に最近傍リングを求める
        // ピーク輪: R_slit - 0.75*LAM - n*LAM
        // トラフ輪: R_slit - 0.25*LAM - n*LAM
        const refP = R_slit - 0.75 * LAM;
        const refT = R_slit - 0.25 * LAM;

        // 赤スリット(r1)の最近傍リング
        const r1_nearP = refP - Math.round((refP - r1) / LAM) * LAM;
        const r1_nearT = refT - Math.round((refT - r1) / LAM) * LAM;
        const r1_useP  = Math.abs(r1 - r1_nearP) <= Math.abs(r1 - r1_nearT);
        const r1t      = r1_useP ? r1_nearP : r1_nearT;
        const r1_err   = Math.abs(r1 - r1t);

        // 青スリット(r2)の最近傍リング
        const r2_nearP = refP - Math.round((refP - r2) / LAM) * LAM;
        const r2_nearT = refT - Math.round((refT - r2) / LAM) * LAM;
        const r2_useP  = Math.abs(r2 - r2_nearP) <= Math.abs(r2 - r2_nearT);
        const r2t      = r2_useP ? r2_nearP : r2_nearT;
        const r2_err   = Math.abs(r2 - r2t);

        const TOL = 1.2;
        if (r1_err > TOL || r2_err > TOL) return;
        if (r1t <= 0 || r2t <= 0) return;

        // 2円の交点を解析的に計算
        // C1=(15,5), C2=(15,-5), d=10, a = (r1t²-r2t²+d²)/(2d)
        const d = 10;
        const a = (r1t*r1t - r2t*r2t + d*d) / (2 * d);
        const h2 = r1t*r1t - a*a;
        if (h2 < 0) return;
        const h = Math.sqrt(h2);
        // 交点: (BARRIER+h, 5-a) ← 第2スリット前方（wx > BARRIER）
        const snap_wx = BARRIER + h;
        const snap_wz = 5 - a;

        const geo = new THREE.SphereGeometry(0.4, 16, 12);
        const mat = new THREE.MeshBasicMaterial({ color: 0x88ee22, transparent: true, opacity: 0.55 });
        const sphere = new THREE.Mesh(geo, mat);
        sphere.position.set(snap_wx, 0, snap_wz);
        autoScene.add(sphere);
        autoSceneObjects.push(sphere);
        s6PointSpheres.push(sphere);

          if (!autoWavePaused && elapsed >= 1.5 && !autoS7FadeDone) {
            autoS7FadeDone = true;
            autoWavePaused = true;
            autoWavePauseWallTime = nowSec();
            const btn = document.getElementById('autoPlay');
            if (btn) btn.textContent = '▶';
          }
        }
        if (autoPlayStartTime !== null && !autoWavePaused && autoS7FadeDone && autoS7LineStart === null) {
          autoS7LineStart = nowSec();
          createS7PathLines();
        }
        if (autoS7LineStart !== null) {
          updateS7PathLines(nowSec() - autoS7LineStart);
        }
      }
      renderer.render(autoMode ? autoScene : scene,
        (autoMode && autoS8WasActive && autoOrthoCamera) ? autoOrthoCamera : camera);
    }
    // ページ読み込み時から常に表示（初期状態 t=2T）
    ensureYxGraph();
    ensureYx2Graph();
    ensureYxResGraph();
    redrawGraphs(0);
    tick();

  </script>

     操作を横取りし、つまみや盤面にポインタが届かなくなる（CLAUDE.md §8-21） -->
