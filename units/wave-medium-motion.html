<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>波と媒質の運動（授業用）｜3Dボード</title>
  <style>
    :root{
      --bg:#ffffff;
      --panel:rgba(240,243,252,0.95);
      --border:rgba(70,90,160,0.30);
      --text:#1a2040;
      --muted:#5566aa;
    }
    html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    #app{position:fixed;inset:0;overflow:hidden}

    /* 3Dキャンバス */
    canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

    /* 上バー */
    .topbar{
      position:absolute;left:0;top:0;right:0;z-index:5;
      display:flex;gap:8px;align-items:center;
      padding:10px 12px;
      background:linear-gradient(to bottom, rgba(255,255,255,.80), rgba(255,255,255,0));
      pointer-events:none; /* クリックは中の要素だけ */
    }
    .topbar a, .topbar button, .topbar .pill{pointer-events:auto}
    .btn, .pill{
      border:1px solid var(--border);
      background:var(--panel);
      color:var(--text);
      border-radius:12px;
      padding:8px 10px;
      font-size:12px;
      cursor:pointer;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      gap:6px;
    }
    .btn:hover{opacity:.9}
    .pill{cursor:default;color:var(--muted)}

    .btn.active{ outline:2px solid rgba(120,170,255,.6); }

    /* 左サイドバー */
    .sidebar{
      position:absolute;left:10px;top:56px;bottom:10px;z-index:6;
      width:280px;max-width:85vw;
      background:var(--panel);
      border:1px solid var(--border);
      border-radius:16px;
      padding:12px;
      overflow:auto;
      backdrop-filter: blur(6px);
    }
    .h{font-weight:800;font-size:13px;margin:0 0 8px}
    .sub{color:var(--muted);font-size:12px;line-height:1.5;margin:0 0 10px}
    .group{margin:10px 0 12px}
    .groupTitle{font-weight:700;font-size:12px;color:var(--text);margin:0 0 8px}
    .tool{
      width:100%;
      text-align:left;
      border:1px solid var(--border);
      background:rgba(240,243,252,0.80);
      color:var(--text);
      border-radius:14px;
      padding:10px 10px;
      cursor:pointer;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:8px;
      margin-bottom:8px;
    }
    .tool:hover{opacity:.92}
    .tool small{color:var(--muted);font-size:11px}
    .tool.active{outline:2px solid rgba(120,170,255,.6)}
    .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
    .lbl{color:var(--muted);font-size:12px;align-self:center}
    .num{width:72px;max-width:90px}
    .row .btn{flex:1;justify-content:center}
    .sub-btn-group{padding-left:12px;border-left:2px solid rgba(120,170,255,0.35);margin-left:6px}

    /* 右下ヘルプ */
    .help{
      position:absolute;right:10px;bottom:10px;z-index:6;
      background:rgba(240,243,252,0.92);
      border:1px solid rgba(70,90,160,0.20);
      border-radius:14px;
      padding:10px 12px;
      font-size:12px;
      color:var(--muted);
      max-width:420px;
    }
    .help b{color:var(--text)}

    /* ===== グラフモード選択 ===== */
    .graph-mode-panel{
      max-height:0;
      overflow:hidden;
      transition:max-height 0.35s ease;
      border-left:2px solid rgba(100,140,255,0.3);
    }
    .graph-mode-panel label{
      display:flex;
      align-items:center;
      gap:8px;
      cursor:pointer;
      font-size:12px;
      color:var(--text);
      user-select:none;
      margin-bottom:5px;
    }
    .graph-mode-panel label:last-child{ margin-bottom:0; }
    .graph-mode-panel input[type="radio"]{
      appearance:none;
      -webkit-appearance:none;
      width:14px;
      height:14px;
      border:1.5px solid rgba(120,170,255,0.55);
      border-radius:3px;
      background:rgba(240,243,252,0.80);
      cursor:pointer;
      flex-shrink:0;
      position:relative;
    }
    .graph-mode-panel input[type="radio"]:checked{
      background:rgba(60,110,230,0.25);
      border-color:rgba(120,170,255,0.9);
    }
    .graph-mode-panel input[type="radio"]:checked::after{
      content:'✓';
      position:absolute;
      top:-3px;
      left:0px;
      font-size:13px;
      color:#78aaff;
      line-height:1;
    }

    /* ===== 道具箱の開閉（初期は閉じる） ===== */
    #toolboxPanel{
      position: fixed;
      left: 16px;
      top: 72px;                     /* もし上のボタンと被るなら数値を調整 */
      z-index: 1000;
      transition: transform 180ms ease;
      transform: translateX(0);
    }

    /* 右端だけ残して閉じる（矢印ボタンが見える幅） */
    #toolboxPanel.is-collapsed{
      transform: translateX(calc(-100% + 36px));
    }

    #toolboxToggle.toolboxToggle{
      position: absolute;
      top: 10px;
      right: 10px;
      width: 28px;
      height: 28px;
      border-radius: 10px;
      border: 1px solid rgba(70,90,160,0.25);
      background: rgba(240,243,252,0.90);
      color: #1a2040;
      cursor: pointer;
      display: grid;
      place-items: center;
      font-weight: 700;
      line-height: 1;
    }

    /* 閉じてる時は右端に寄せて押しやすく */
    #toolboxPanel.is-collapsed #toolboxToggle{
      right: 4px;
    }

    /* 閉じているときは中身を見せない（矢印だけ表示） */
    #toolboxPanel{
      overflow: hidden auto;              /* 中身が画面より長いときは縦にスクロール（横は出さない） */
      overscroll-behavior: contain;
    }

    #toolboxPanel.is-collapsed > :not(#toolboxToggle){
      display: none !important; /* トグル以外を全部消す */
    }

    /* 道具箱スクロールコンテナ */
    #toolboxScroll {
      max-height: calc(100vh - 90px);
      overflow-y: auto;
      overflow-x: hidden;
    }
    #toolboxScroll::-webkit-scrollbar { width: 4px; }
    #toolboxScroll::-webkit-scrollbar-thumb {
      background: rgba(100, 140, 255, 0.35);
      border-radius: 2px;
    }
    #toolboxScroll::-webkit-scrollbar-track { background: transparent; }
  </style>

  <script>
  window.addEventListener('error', (e) => {
    const el = document.getElementById('errOverlay');
    const msg = document.getElementById('errMsg');
    if (el && msg) {
      el.style.display = 'block';
      msg.textContent += (e.message || 'Unknown error') + '\n' +
        (e.filename ? '  at ' + e.filename + ':' + e.lineno + ':' + e.colno + '\n' : '') +
        (e.error?.stack ? e.error.stack : '') + '\n\n';
    }
  });
  window.addEventListener('unhandledrejection', (e) => {
    const el = document.getElementById('errOverlay');
    const msg = document.getElementById('errMsg');
    if (el && msg) {
      el.style.display = 'block';
      msg.textContent += 'Unhandled Promise rejection:\n' +
        (e.reason?.message || String(e.reason) || 'Unknown') + '\n' +
        (e.reason?.stack || '') + '\n\n';
    }
  });
  </script>
  <script type="module">
    const GRID_STEP = 1; // 1マス分（必要なら 0.5 や 2 に変更）
    const BASE_Y = 0.25; // 球の基本高さ（半径と同じ）
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { TransformControls } from 'three/addons/controls/TransformControls.js';
    import { LineSegments2 } from 'three/addons/lines/LineSegments2.js';
    import { LineSegmentsGeometry } from 'three/addons/lines/LineSegmentsGeometry.js';
    import { LineMaterial } from 'three/addons/lines/LineMaterial.js';
    import { Line2 } from 'three/addons/lines/Line2.js';
    import { LineGeometry } from 'three/addons/lines/LineGeometry.js';



    // ===== 基本セットアップ =====
    const canvas = document.getElementById('c');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(2, window.devicePixelRatio));

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xffffff);

    const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 200);
    camera.position.set(9, 8, 12);
    scene.add(camera); // カメラ子要素（ペンオーバーレイ等）をレンダリングするために必要

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.target.set(0, 0.5, 0);
    controls.zoomToCursor = true;

    // ライト
    scene.add(new THREE.AmbientLight(0xffffff, 1.0));
    const dir = new THREE.DirectionalLight(0xffffff, 0.70);
    dir.position.set(6, 10, 6);
    scene.add(dir);

    function snapToGrid(obj) {
       obj.position.x = Math.round(obj.position.x / GRID_STEP) * GRID_STEP;
       obj.position.z = Math.round(obj.position.z / GRID_STEP) * GRID_STEP;

       // ★ y は触らない（高さは固定値/円運動に任せる）
    }


    // ===== 円運動（選択した球をXY平面で回す） =====
    function nowSec(){ return performance.now() / 1000; }

    function ensureCirc(obj){
      if (!obj.userData.circ){
        obj.userData.circ = {
          active: false,
          center: ORBIT_CENTER.clone(), // ★常に固定中心
          r: 2,
          T: 4,
          startTime: 0,
          startTheta: 0,                // ★角度の基準
        };
      }
      return obj.userData.circ;
    }

    function startCircular(obj, r, T){
      const d = ensureCirc(obj);

      // ★中心は固定（開始のたびに上書きしない）
      d.center.copy(ORBIT_CENTER);

      d.r = Math.max(0, r);
      d.T = Math.max(0.1, T);

      const t = nowSec();
      const omega = (Math.PI * 2) / d.T;

      // ★今いる位置から角度を計算して、そこから再開する（ズレ防止）
      const dx = obj.position.x - d.center.x;
      const dy = obj.position.y - d.center.y;
      const thetaNow = Math.atan2(dy, dx); // (2,5,0)なら 0

      d.startTheta = thetaNow;
      d.startTime = t;
      d.active = true;
      sharedCirc.r = d.r; sharedCirc.T = d.T;
      sharedCirc.startTheta = d.startTheta; sharedCirc.startTime = d.startTime;
      sharedCirc.frozenElapsed = 0;
      sharedCirc.active = true;
    }

    function stopCircular(obj){
      const d = obj.userData.circ;
      if (!d) return;
      d.active = false;
      sharedCirc.frozenElapsed += nowSec() - sharedCirc.startTime;
      sharedCirc.active = false;
    }

    function startSharedCirc(r, T){
      sharedCirc.r = Math.max(0, r);
      sharedCirc.T = Math.max(0.1, T);
      sharedCirc.startTime = nowSec();
      sharedCirc.active = true;
      // frozenElapsed・startTheta はそのまま維持して続きから再開
    }
    function stopSharedCirc(){
      // 停止時までの経過時間を累積保存
      sharedCirc.frozenElapsed += nowSec() - sharedCirc.startTime;
      sharedCirc.active = false;
    }

    function toggleCircular(obj, r, T){
      const d = ensureCirc(obj);
      if (d.active) stopCircular(obj);
      else startCircular(obj, r, T);
    }

    // 球がなくてもばね・ロープを動かすための共有状態
    const sharedCirc = { active: false, r: 2, T: 4, startTime: 0, startTheta: 0, frozenElapsed: 0 };

    function updateCircular(obj, t){
      const d = obj.userData.circ;
      if (!d || !d.active) return;

      const omega = (Math.PI * 2) / d.T;
      const theta = d.startTheta + omega * (t - d.startTime);

      // ★XY平面（z固定）
      obj.position.set(
        d.center.x + d.r * Math.cos(theta),
        d.center.y + d.r * Math.sin(theta),
        d.center.z
      );
    }

    // ===== 視点スナップ（XZ平面の位置を固定する版） =====
    // 画面上の「XZ平面（y=0）」の高さ：-1=最下, 0=中央, +1=最上
    // 赤線くらいなら -0.55 ～ -0.70 あたりが目安（数字を変えると上下します）
    const VIEW_PLANE_NDC_Y = -0.1;

    // 視点ボタンで揃える時のカメラ高さ（必要なら調整）
    const VIEW_CAM_Y = 5;

    // スムーズ移動
    let viewTween = null; // {startPos, endPos, startTarget, endTarget, startTime, dur}

    // 計算用カメラ（本物を一瞬も動かさないため）
    const viewCalcCam = new THREE.PerspectiveCamera();

    function getFocusXZ() {
      return new THREE.Vector3(0, 0, 0);
    }

    // 後で代入する（grid作成箇所で代入）
    let grid, horizonXY, horizonYZ;
    let viewMode = 'free'; // 'free' | 'xy' | 'yz'

    // XY/YZのときは床グリッドを消して、基準線だけ出す
    function applyViewMode(mode){
      // ★2D化はやめる：常に3D
      if (grid) grid.visible = true;        // グリッドは常に表示
      if (horizonXY) horizonXY.visible = false; // 基準線は使わない（必要なら後で戻せます）
      if (horizonYZ) horizonYZ.visible = false;

      controls.enableRotate = true;         // ★回転ロックしない
      // controls.enablePan / enableZoom はそのままでOK
    }

    // dir方向から、原点基準で「XZ平面(y=0)」がNDCの所定Yに来るようにセット
    function startViewSnapPreset(dirVec, mode, duration = 0.35){
      const dist = camera.position.distanceTo(controls.target);

      // 水平成分だけ使う（y=0にして確実に水平視線にする）
      const dir = dirVec.clone();
      dir.y = 0;
      if (dir.lengthSq() < 1e-6) dir.set(0, 0, 1);
      dir.normalize();

      // ★ここが肝：カメラ/ターゲットの共通Yを計算
      // 視線が水平のとき、原点(y=0)のNDC_yは  -(Y / (dist*tan(fov/2))) になる
      // => Y = -NDC_y * dist * tan(fov/2)
      const fovRad = THREE.MathUtils.degToRad(camera.fov);
      const sharedY = -VIEW_PLANE_NDC_Y * dist * Math.tan(fovRad * 0.5);

      // 原点基準（球の位置に依存しない）
      const endTarget = new THREE.Vector3(0, sharedY, 0);
      const endPos = endTarget.clone().add(dir.multiplyScalar(dist));

      applyViewMode(mode);

      viewTween = {
        startPos: camera.position.clone(),
        endPos,
        startTarget: controls.target.clone(),
        endTarget,
        startTime: nowSec(),
        dur: duration,
      };
    }

    function updateViewSnap(t){
      if (!viewTween) return;
      const u = Math.min(1, (t - viewTween.startTime) / viewTween.dur);
      const k = u * u * (3 - 2 * u); // easeInOut

      camera.position.lerpVectors(viewTween.startPos, viewTween.endPos, k);
      controls.target.lerpVectors(viewTween.startTarget, viewTween.endTarget, k);
      controls.update();

      if (u >= 1) viewTween = null;
    }

    function snapToXY() {
      const center = orbitCenter.clone().add(new THREE.Vector3(7, 0, 0));
      startViewSnapAroundCenter(new THREE.Vector3(0, 0, 1), 0.35, center);
    }


    function snapToYZ() {
      startViewSnapAroundCenter(new THREE.Vector3(1, 0, 0)); // x方向から見る（YZ平面が見える）
    }


    // 地面グリッド（見える床）
    grid = new THREE.GridHelper(16, 16, 0x9bb0d0, 0xc8d6e8);
    grid.position.y = 0;
    scene.add(grid);

    // ===== 2Dビュー用：基準線（y=0の線だけ） =====

    horizonYZ = new THREE.Line(

    const ground = new THREE.Mesh(

    // 置いたものをまとめるグループ
    const placedGroup = new THREE.Group();
    scene.add(placedGroup);
    let placedSphere = null; // 置いた球を記録（1個制限用）
    let sphereGroup  = null; // 球のドラッグ用グループ

    let springGroup = null;          // 球とばね グループ

    let springMesh  = null;          // ばね

    let ropeGroup    = null;         // ロープと手 グループ

    let ropeCenterMarker = null;     // ロープ中央の目印（単色）
    let ropeParticleMeshes = [];     // 粒子マーカー P0〜P8
    let ropeHandGroup  = null;       // 手
    let ropeHitbox     = null;       // ロープ透明ヒットボックス
    let ropeHandHitbox = null;       // 手の透明ヒットボックス
    // 透明ヒットボックス共通マテリアル
    const _hitboxMat = new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, side: THREE.DoubleSide, depthWrite: false });
    // XY平面ドラッグ用
    const _dragPlane  = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
    let   _dragGroup  = null;
    const _dragOffset = new THREE.Vector3();
    const _dragHitPt  = new THREE.Vector3();
    let centerDot      = null;  // 円運動中心点（赤）
    let trajectoryLine = null;  // 軌跡（黄色い円）
    let centerLineMesh = null;  // 中心線（中心→球、黄色）
    let lastOrbitR     = null;  // 軌跡再構築用の前回半径

    function buildOrbitCirclePoints(r) {
      const pts = [];
      for (let i = 0; i <= 128; i++) {
        const theta = (i / 128) * Math.PI * 2;
        pts.push(new THREE.Vector3(
          ORBIT_CENTER.x + r * Math.cos(theta),

        ));
      }

    }
    // ===== 先生用：配置＆選択 =====
    let mode = 'placeSphere'; // 'placeSphere' or 'select'
    let selected = null;

    // ===== 円運動の中心（固定）と球の初期状態 =====
    const ORBIT_CENTER = new THREE.Vector3(-8, 5, 0);   // ←確定
    const SPHERE_START = new THREE.Vector3(-6, 5, 0);   // ←確定（半径2の開始点）
    const DEFAULT_R = 2;

    // 円運動の中心（今後ずっとこれを使う）
    let orbitCenter = ORBIT_CENTER.clone();

    // ===== グラフ（YZ平面 / x=0） =====
    // 横軸=t（時間）, 縦軸=x（単振動の変位：球のy座標を中心から引いたもの）
    // ※ x = placedSphere.position.y - ORBIT_CENTER.y

    // 出現位置の微調整はこの3つだけ触ればOK
    const GRAPH_CENTER = new THREE.Vector3(-8, 6.0, -7.0); // x=0 の YZ平面上
    const GRAPH_WIDTH  = 9.0;  // 横（見た目サイズ）
    const GRAPH_HEIGHT = 4.0;  // 縦（見た目サイズ）

    // 表示する時間幅（右端が現在）
    const GRAPH_TIME_WINDOW = 8.0;    // 秒（画面に見せる時間幅）
    const GRAPH_SAMPLE_DT   = 1/30;   // 1点あたり最小間隔（秒）→30fpsで負荷軽減

    let graphGroup = null;
    let graphCanvas = null;
    let graphCtx = null;
    let graphTexture = null;

    // --- グラフのドラッグ（YZ平面 x=0 のみ） ---
    // 「つかんだ点」と「graphGroup.position」の差分を保持して、常にその差分を保ったまま動かす。
    // これで“カーソルで直接つかんでいる”感じになります。

    let graphPlaneMesh = null; // クリック判定する平面Mesh（ensureGraph()で代入）
    let graphHandles   = [];   // 四隅ハンドル（リサイズ用）
    let liveGraphEntry = null; // ライブグラフのエントリ
    let selectedGraphEntry = null; // 現在選択中のグラフ
    // ===== ペン/消しゴム（カメラ空間オーバーレイ） =====
    const DEFAULT_BOARD_Z  = -10;
    const INK_BOARD_WIDTH  = 18;
    const INK_BOARD_HEIGHT = 11;

    let inkMode       = 'none'; // 'none' | 'pen' | 'eraser'
    let inkDrawing    = false;
    let inkBoardMesh    = null;
    let inkBoardCanvas  = null;
    let inkBoardCtx     = null;
    let inkBoardTexture = null;
    let activeInkCtx    = null;
    let activeIBTexture = null;
    let lastInkX = 0, lastInkY = 0;
    let inkDirty   = false;
    let graphDirty = false;

    const PEN_COLOR    = 'rgba(255, 40, 40, 1.0)';
    const PEN_WIDTH    = 2;
    const ERASER_WIDTH = 20;

    function ensureInkBoard() {
      if (inkBoardMesh) return;
      inkBoardCanvas = document.createElement('canvas');
      inkBoardCanvas.width  = 1024;
      inkBoardCanvas.height = 614;
      inkBoardCtx = inkBoardCanvas.getContext('2d');
      inkBoardCtx.lineCap  = 'round';
      inkBoardCtx.lineJoin = 'round';
      inkBoardTexture = new THREE.CanvasTexture(inkBoardCanvas);
      inkBoardTexture.colorSpace = THREE.SRGBColorSpace;
      inkBoardTexture.generateMipmaps = false;
      inkBoardTexture.minFilter = THREE.LinearFilter;
      const mat = new THREE.MeshBasicMaterial({
        map: inkBoardTexture, transparent: true, opacity: 1,
        side: THREE.FrontSide, depthWrite: false, depthTest: false,
      });
      inkBoardMesh = new THREE.Mesh(new THREE.PlaneGeometry(INK_BOARD_WIDTH, INK_BOARD_HEIGHT), mat);
      inkBoardMesh.position.set(0, 0, DEFAULT_BOARD_Z);
      inkBoardMesh.renderOrder = 1;
      camera.add(inkBoardMesh);
    }

    function setInkMode(next) {
      inkMode = (inkMode === next) ? 'none' : next;
      if (inkMode !== 'none') ensureInkBoard();
      document.getElementById('toolPen')?.classList.toggle('active', inkMode === 'pen');
      document.getElementById('toolEraser')?.classList.toggle('active', inkMode === 'eraser');
      if (inkDrawing) endGraphInk();
    }

    function clearInkAll() {
      if (inkBoardCtx && inkBoardCanvas) {
        inkBoardCtx.clearRect(0, 0, inkBoardCanvas.width, inkBoardCanvas.height);
        if (inkBoardTexture) inkBoardTexture.needsUpdate = true;
      }
    }

    // 画面座標 → インクキャンバス座標（レイキャスト不使用・解析計算）
    function screenToInkXY(ev) {
      const rect = canvas.getBoundingClientRect();
      const ndcX = ((ev.clientX - rect.left) / rect.width) * 2 - 1;
      const ndcY = -((ev.clientY - rect.top) / rect.height) * 2 + 1;
      const proj = camera.projectionMatrix.elements;
      // カメラ空間での交点 z = DEFAULT_BOARD_Z 平面
      const depth = -DEFAULT_BOARD_Z; // 10
      const cx = ndcX * depth / proj[0]; // proj[0] = f/aspect, proj[5] = f
      const cy = ndcY * depth / proj[5];
      const uvX = (cx + INK_BOARD_WIDTH / 2) / INK_BOARD_WIDTH;
      const uvY = (cy + INK_BOARD_HEIGHT / 2) / INK_BOARD_HEIGHT;
      return {
        x: uvX * inkBoardCanvas.width,
        y: (1 - uvY) * inkBoardCanvas.height,
      };
    }
    
    const GRAPH_DRAG_PLANE = new THREE.Plane(new THREE.Vector3(1,0,0), 0); // x=0 平面

    let graphDragging = false;
    let graphDragPointerId = null;

    // つかんだ点(world) と graphGroup.position(world) の差分
    const graphDragOffsetToGroup = new THREE.Vector3();
    const _gHit = new THREE.Vector3();

    function tryStartGraphDrag(ev){
      getPointerNDC(ev);
      raycaster.setFromCamera(mouse, camera);

      // 現在グラフ → 保存グラフの順でヒット判定
      let hitEntry = null;
      if (graphGroup && graphGroup.visible && graphPlaneMesh) {
        if (raycaster.intersectObject(graphPlaneMesh, false).length) {
          hitEntry = liveGraphEntry;
        }
      }
      if (!hitEntry && graphGroup2 && graphGroup2.visible && graphPlaneMesh2 && ev.button !== 2) {
        if (raycaster.intersectObject(graphPlaneMesh2, false).length) hitEntry = liveGraphEntry2;
      }
      if (!hitEntry) {
        for (const entry of savedGraphEntries) {
          if (raycaster.intersectObject(entry.planeMesh, false).length) { hitEntry = entry; break; }
        }
      }
      if (!hitEntry) {
        for (const entry of savedGraphEntries2) {
          if (raycaster.intersectObject(entry.planeMesh, false).length) { hitEntry = entry; break; }
        }
      }
      if (!hitEntry) return false;

      // クリックしたグラフを選択（四隅ハンドルを表示）
      selectGraph(hitEntry);

      const _isG2 = (hitEntry === liveGraphEntry2 || savedGraphEntries2.includes(hitEntry));
      const _dPlane = _isG2 ? GRAPH_DRAG_PLANE2 : GRAPH_DRAG_PLANE;
      if (!raycaster.ray.intersectPlane(_dPlane, _gHit)) return false;
      if (_isG2) _gHit.z = 0; else _gHit.x = 0;

      graphDragOffsetToGroup.copy(hitEntry.group.position).sub(_gHit);
      graphDragEntry    = hitEntry;
      graphDragIsGraph2 = _isG2;
      graphDragging     = true;
      graphDragPointerId = ev.pointerId ?? null;

      controls.enabled = false;
      try { canvas.setPointerCapture(ev.pointerId); } catch(e) {}

      ev.preventDefault();
      ev.stopPropagation();
      return true;
    }

    function updateGraphDrag(ev){
      if (!graphDragging || !graphDragEntry) return;

      getPointerNDC(ev);
      raycaster.setFromCamera(mouse, camera);
      const _dPlane2 = graphDragIsGraph2 ? GRAPH_DRAG_PLANE2 : GRAPH_DRAG_PLANE;
      if (!raycaster.ray.intersectPlane(_dPlane2, _gHit)) return;
      if (graphDragIsGraph2) _gHit.z = 0; else _gHit.x = 0;

      const newPos = _gHit.clone().add(graphDragOffsetToGroup);
      if (graphDragIsGraph2) {
        graphDragEntry.group.position.set(newPos.x, newPos.y, 0);
      } else {
        graphDragEntry.group.position.set(0, newPos.y, newPos.z);
      }

      ev.preventDefault();
    }

    function endGraphDrag(ev){
      if (!graphDragging) return;

      graphDragging  = false;
      graphDragEntry = null;
      controls.enabled = true;

      if (ev?.pointerId != null){
        try { canvas.releasePointerCapture(ev.pointerId); } catch(e) {}
      }
      graphDragPointerId = null;
    }

    function tryStartGraphInk(ev) {
      if (inkMode === 'none') return false;
      ensureInkBoard();
      activeInkCtx = inkBoardCtx;
      const xy = screenToInkXY(ev);
      lastInkX = xy.x; lastInkY = xy.y;

      if (inkMode === 'pen') {

      activeInkCtx.moveTo(lastInkX, lastInkY);
      activeInkCtx.lineTo(lastInkX + 0.01, lastInkY + 0.01);

      controls.enabled = false;
      try { renderer.domElement.setPointerCapture(ev.pointerId); } catch(e) {}

      return true;

    function updateGraphInk(ev) {
      if (!inkDrawing) return;
      const xy = screenToInkXY(ev);
      activeInkCtx.beginPath();
      activeInkCtx.moveTo(lastInkX, lastInkY);
      activeInkCtx.lineTo(xy.x, xy.y);
      activeInkCtx.stroke();
      lastInkX = xy.x; lastInkY = xy.y;
      inkDirty = true;

    function endGraphInk(ev) {
      if (!inkDrawing) return;
      inkDrawing = false;
      controls.enabled = true;
      try { renderer.domElement.releasePointerCapture(ev?.pointerId); } catch(e) {}
    }

    // ===== グラフのリサイズ（右上ハンドル / 縦横比固定 / YZ平面のみ） =====
    let graphResizing = false;
    let graphResizePointerId = null;

    const GRAPH_SCALE_MIN = 0.25;
    const GRAPH_SCALE_MAX = 4.0;

    // bottom-left（左下）を固定して、右上を引っ張るPPT的な挙動にします
    const _grHit = new THREE.Vector3();
    const _grBL_local = new THREE.Vector3(-GRAPH_WIDTH / 2, -GRAPH_HEIGHT / 2, 0);
    const _grBL_world = new THREE.Vector3();
    const _grNewBL_world = new THREE.Vector3();
    const _grShift = new THREE.Vector3();

    const _grQ = new THREE.Quaternion();
    const _grWidthDir = new THREE.Vector3();
    const _grHeightDir = new THREE.Vector3();

    const _grDelta = new THREE.Vector3();

    const grAnchor = new THREE.Vector3();
    let grStartScale = 1;
    let grStartProj = 1;

    // 縦横比固定のための「対角方向」係数（幅・高さの比は固定）
    const grDiagLen = Math.hypot(GRAPH_WIDTH, GRAPH_HEIGHT);
    const grUnitW = GRAPH_WIDTH / grDiagLen;
    const grUnitH = GRAPH_HEIGHT / grDiagLen;

    function getBottomLeftWorldFor(planeMesh){
      if (!planeMesh) return _grBL_world.set(0,0,0);
      return planeMesh.localToWorld(_grBL_world.copy(_grBL_local));
    }

    // 四隅コーナー定数
    const CORNER_DIRS = { BL:[-1,-1], BR:[1,-1], TL:[-1,1], TR:[1,1] };
    const OPPOSITE_CORNER = { BL:'TR', BR:'TL', TL:'BR', TR:'BL' };
    const _cLocal = new THREE.Vector3();
    const _cWorld = new THREE.Vector3();

    function getCornerWorld(planeMesh, corner){
      const [sx, sy] = CORNER_DIRS[corner];
      _cLocal.set(sx * GRAPH_WIDTH/2, sy * GRAPH_HEIGHT/2, 0);
      return planeMesh.localToWorld(_cWorld.copy(_cLocal));
    }

    function makeCornerHandles(plane){
      const handles = [];
      for (const corner of ['BL','BR','TL','TR']){
        const [sx, sy] = CORNER_DIRS[corner];
        const h = new THREE.Mesh(
          new THREE.SphereGeometry(0.09, 12, 8),
          new THREE.MeshBasicMaterial({ color:0x000000 })
        );
        h.position.set(sx * GRAPH_WIDTH/2, sy * GRAPH_HEIGHT/2, 0.02);
        h.visible = false;
        h.userData.corner = corner;
        plane.add(h);
        handles.push(h);
      }
      return handles;
    }

    function selectGraph(entry){
      if (selectedGraphEntry && selectedGraphEntry !== entry){
        for (const h of selectedGraphEntry.handles) h.visible = false;
      }
      selectedGraphEntry = entry;
      if (entry) for (const h of entry.handles) h.visible = true;
    }

    function deselectGraph(){
      if (selectedGraphEntry){
        for (const h of selectedGraphEntry.handles) h.visible = false;
      }
      selectedGraphEntry = null;
    }

    let graphResizeAnchorCorner = 'BL';

    function tryStartGraphResize(ev){
      getPointerNDC(ev);
      raycaster.setFromCamera(mouse, camera);

      // 選択中グラフの四隅ハンドルを判定
      let hitEntry = null;
      let hitCorner = null;
      if (selectedGraphEntry) {
        for (const h of selectedGraphEntry.handles) {
          if (h.visible && raycaster.intersectObject(h, false).length) {
            hitEntry = selectedGraphEntry;
            hitCorner = h.userData.corner;

      const _isG2r = (hitEntry === liveGraphEntry2 || savedGraphEntries2.includes(hitEntry));
      const _rPlane = _isG2r ? GRAPH_DRAG_PLANE2 : GRAPH_DRAG_PLANE;
      if (!raycaster.ray.intersectPlane(_rPlane, _grHit)) return false;
      if (_isG2r) _grHit.z = 0; else _grHit.x = 0;
      graphResizeIsGraph2 = _isG2r;

      // ドラッグしたコーナーの対角を固定アンカーにする
      graphResizeAnchorCorner = OPPOSITE_CORNER[hitCorner];
      grAnchor.copy(getCornerWorld(hitEntry.planeMesh, graphResizeAnchorCorner));
      grStartScale = hitEntry.planeMesh.scale.x;

      // ドラッグ方向に合わせてWidth/Height方向を設定
      const [dx, dy] = CORNER_DIRS[hitCorner];
      hitEntry.planeMesh.getWorldQuaternion(_grQ);
      _grWidthDir.set(dx, 0, 0).applyQuaternion(_grQ).normalize();
      _grHeightDir.set(0, dy, 0).applyQuaternion(_grQ).normalize();

      _grDelta.copy(_grHit).sub(grAnchor);
      const w0 = Math.max(0, _grDelta.dot(_grWidthDir));
      const h0 = Math.max(0, _grDelta.dot(_grHeightDir));
      grStartProj = w0 * grUnitW + h0 * grUnitH;

      ev.stopPropagation();
      return true;
    }

    function updateGraphResize(ev){
      if (!graphResizing || !graphResizeEntry) return;

      getPointerNDC(ev);
      raycaster.setFromCamera(mouse, camera);
      const _rPlane2 = graphResizeIsGraph2 ? GRAPH_DRAG_PLANE2 : GRAPH_DRAG_PLANE;
      if (!raycaster.ray.intersectPlane(_rPlane2, _grHit)) return;
      if (graphResizeIsGraph2) _grHit.z = 0; else _grHit.x = 0;

      _grDelta.copy(_grHit).sub(grAnchor);

      const w = Math.max(0, _grDelta.dot(_grWidthDir));
      const h = Math.max(0, _grDelta.dot(_grHeightDir));
      const proj = w * grUnitW + h * grUnitH;

      let newScale = grStartScale * (proj / grStartProj);
      newScale = Math.max(GRAPH_SCALE_MIN, Math.min(GRAPH_SCALE_MAX, newScale));

      graphResizeEntry.planeMesh.scale.set(newScale, newScale, newScale);
      graphResizeEntry.planeMesh.updateMatrixWorld(true);

      const newAnchor = getCornerWorld(graphResizeEntry.planeMesh, graphResizeAnchorCorner);
      _grShift.copy(grAnchor).sub(newAnchor);

      graphResizeEntry.group.position.add(_grShift);
      graphResizeEntry.group.position.x = 0;
      graphResizeEntry.group.updateMatrixWorld(true);

      ev.preventDefault();
    }

    function endGraphResize(ev){
      if (!graphResizing) return;

      graphResizing    = false;
      graphResizeEntry = null;
      controls.enabled = true;

    // データ
    let graphData = []; // {t, x}

    let graphLastTickSec = nowSec();

    function graphPlotRect(){
      const W = graphCanvas.width;
      const H = graphCanvas.height;

    function drawGraphBase(){
      if (!graphCtx || !graphCanvas) return;
      const ctx = graphCtx;
      const {W,H,x0,y0,x1,y1} = graphPlotRect();

      ctx.clearRect(0, 0, W, H);

      // グリッド（薄いグレー）
      ctx.strokeStyle = 'rgba(0, 0, 0, 0.09)';
      ctx.lineWidth = 2;
      const yCenter = (y0 + y1) / 2;          // 原点のcanvas y座標
      const step = (y0 - y1) / (2 * DEFAULT_R); // 1単位(r=1)あたりのピクセル数
      const yGridTop = y1 - 169;  // 縦軸の矢印先端と同じ
      const yGridBot = y0 + 167;  // 縦軸の下端と同じ
      const xGridRight = x1 + 102;   // 縦線の間隔計算に使う（変更しない）
      const xAxisRight = x1 + 150;   // 横線・横軸の右端
      const nSec = Math.round(GRAPH_TIME_WINDOW); // 表示窓の秒数（=8）
      for (let k = 1; k <= nSec; k++){
        const x = x0 + k * (xGridRight - x0) / nSec;
        ctx.beginPath(); ctx.moveTo(x, yGridTop); ctx.lineTo(x, yGridBot); ctx.stroke();
      }
      for (let k = -3; k <= 3; k++){
        const y = yCenter - k * step;
        ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(xAxisRight, y); ctx.stroke();
      }
    }

    function drawGraph(){
      if (!graphCtx || !graphCanvas || !graphTexture) return;

      drawGraphBase();

      const ctx = graphCtx;
      const {x0,y0,x1,y1} = graphPlotRect();

      const xMin = -3, xMax = 3;

      // 横軸（時間）：
      // tEnd = 現在（経過時間）
      // tStart = 表示窓の開始（8秒窓）
      const tEnd = graphTime;
      const tStart = Math.max(0, tEnd - GRAPH_TIME_WINDOW);

      // y=0 の画面上の位置（常に中央）
      const yZero = y0 - ((0 - xMin) / (xMax - xMin)) * (y0 - y1);

      // ===== 軸（矢印付き） =====
      const AW = 16, AH = 8; // 矢印：長さ・半幅
      ctx.strokeStyle = 'rgba(20, 20, 20, 0.92)';
      ctx.fillStyle   = 'rgba(20, 20, 20, 0.92)';
      ctx.lineWidth = 3;

      // 縦軸（Y軸）：x=x0、下から上へ
      const yTop = y1 - 169;
      ctx.beginPath(); ctx.moveTo(x0, y0 + 167); ctx.lineTo(x0, yTop + AW); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x0, yTop);
      ctx.lineTo(x0 - AH, yTop + AW);
      ctx.lineTo(x0 + AH, yTop + AW);
      ctx.closePath(); ctx.fill();

      // 横軸（時間軸）：y=yZero、左から右へ
      const xRight = x1 + 150;
      ctx.beginPath(); ctx.moveTo(x0, yZero); ctx.lineTo(xRight - AW, yZero); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(xRight, yZero);
      ctx.lineTo(xRight - AW, yZero - AH);
      ctx.lineTo(xRight - AW, yZero + AH);
      ctx.closePath(); ctx.fill();

      // ===== ラベル =====
      ctx.fillStyle = 'rgba(20, 20, 20, 0.92)';
      ctx.font = '32px system-ui, -apple-system, sans-serif';

      // キャンバスと3Dパネルのアスペクト比ずれを補正（縦方向を伸ばす）
      const textScaleY = (graphCanvas.height * GRAPH_WIDTH) / (graphCanvas.width * GRAPH_HEIGHT);

      // 縦軸「変位 y」
      ctx.save();
      ctx.translate(5, yTop - 4);
      ctx.scale(1, textScaleY);
      ctx.textAlign = 'left';
      ctx.textBaseline = 'bottom';
      ctx.fillText('変位 y', 0, 0);
      ctx.restore();

      // 横軸「時間 t」
      ctx.save();
      ctx.translate(xRight + 7, yZero);
      ctx.scale(1, textScaleY);
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillText('時間 t', 0, 0);
      ctx.restore();

      // ===== プロット線 =====
      if (graphData.length >= 2){
        ctx.strokeStyle = 'rgba(100, 220, 70, 0.95)'; // 明るい黄緑
        ctx.lineWidth = 4;
        ctx.beginPath();

        let started = false;

        // 古い点→新しい点の順（左→右）に描く
        const waveXMin = -DEFAULT_R;
        const waveXMax = DEFAULT_R;
        for (let i = 0; i < graphData.length; i++){
          const p = graphData[i];
          if (p.t < tStart || p.t > tEnd) continue;

          const sx = x0 + ((p.t - tStart) / GRAPH_TIME_WINDOW) * (x1 + 102 - x0);

          const v = (p.x - waveXMin) / (waveXMax - waveXMin);
          const sy = y0 - v * (y0 - y1);

          if (!started){
            ctx.moveTo(sx, sy);
            started = true;
          } else {
            ctx.lineTo(sx, sy);
          }
        }

        if (started) ctx.stroke();
      }

      graphDirty = true;
    }

    function ensureGraph(){
      if (graphGroup) return graphGroup;

      graphCanvas = document.createElement('canvas');
      graphCanvas.width = 1152;
      graphCanvas.height = 786;
      graphCtx = graphCanvas.getContext('2d');

      graphTexture = new THREE.CanvasTexture(graphCanvas);
      graphTexture.colorSpace = THREE.SRGBColorSpace;

      drawGraph(); // 初期描画

      const mat = new THREE.MeshBasicMaterial({
        map: graphTexture,
        transparent: true,
        side: THREE.DoubleSide,
      });

      const plane = new THREE.Mesh(new THREE.PlaneGeometry(GRAPH_WIDTH, GRAPH_HEIGHT), mat);
      graphPlaneMesh = plane;                 // クリック判定する対象
      // --- 初期サイズ調整：縦軸(-r..+r)の物理長 = 円運動の直径(2r)に合わせる ---
      // 現在の縦軸レンジは -r..+r（初期は r=2 なので -2..2）。その表示部分の高さだけを直径に一致させます。
      {
        const rect = graphPlotRect(); // {H, y0, y1, ...}
        const plotFrac = (rect.y0 - rect.y1) / rect.H; // キャンバス全高のうち「プロット領域」が占める割合

        const r0 = DEFAULT_R;            // 初期の半径（いまは2）
        const diameter = 2 * r0;         // 円運動の直径（= 4）

        // プロット領域の物理高さ = (GRAPH_HEIGHT * scale) * plotFrac
        // これを diameter にしたい → scale = diameter / (GRAPH_HEIGHT * plotFrac)
        const s = diameter / (GRAPH_HEIGHT * plotFrac);

        plane.scale.set(s, s, s);        // 縦横比固定（等倍スケール）
      }

      // --- リサイズ用ハンドル（四隅、選択時のみ表示） ---
      graphHandles = makeCornerHandles(plane);

    // 毎フレーム呼ぶ：円運動が動いている間だけ graphTime を進め、点を追加する
    function updateGraphTick(tNow){
      // ★ここは毎フレーム更新（dtジャンプ防止）
      const dt = Math.max(0, tNow - graphLastTickSec);
      graphLastTickSec = tNow;

      // ★グラフが「存在＆表示」していないなら、何もしない
      if (!graphGroup || !graphGroup.visible) return;

      // 球があれば球から、なければ sharedCirc から変位を取得
      let x;
      if (placedSphere?.userData?.circ?.active) {
        x = placedSphere.position.y - ORBIT_CENTER.y;
      } else if (sharedCirc.active) {
        const omega = Math.PI * 2 / sharedCirc.T;
        const elapsed = sharedCirc.frozenElapsed + (tNow - sharedCirc.startTime);
        x = sharedCirc.r * Math.sin(sharedCirc.startTheta + omega * elapsed);
      } else {
        return;
      }

      // 停止中は進めない（再開で時間が飛ばない）
      graphTime += dt;

      // サンプリング間引き
      if ((graphTime - graphLastSampleT) < GRAPH_SAMPLE_DT) return;
      graphLastSampleT = graphTime;

      graphData.push({ t: graphTime, x });

      // 古いデータを捨てる（表示窓の外）
      const tMinKeep = Math.max(0, graphTime - GRAPH_TIME_WINDOW);
      while (graphData.length && graphData[0].t < tMinKeep){
        graphData.shift();
      }

      // 表示中なので描き直す
      drawGraph();
    }

      ctx.beginPath();
      ctx.moveTo(x0, yTop); ctx.lineTo(x0 - AH, yTop + AW); ctx.lineTo(x0 + AH, yTop + AW);
      ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(x0, yZero); ctx.lineTo(xRight - AW, yZero); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(xRight, yZero);
      ctx.lineTo(xRight - AW, yZero - AH); ctx.lineTo(xRight - AW, yZero + AH);
      ctx.closePath(); ctx.fill();

      // ラベル

    function updateGraphTick2(tNow){
      const dt = Math.max(0, tNow - graphLastTickSec2);
      graphLastTickSec2 = tNow;
      if (!graphGroup2 || !graphGroup2.visible) return;
      let x;
      if (placedSphere?.userData?.circ?.active) {
        x = placedSphere.position.y - ORBIT_CENTER.y;
      } else if (sharedCirc.active) {
        const omega = Math.PI * 2 / sharedCirc.T;
        const elapsed = sharedCirc.frozenElapsed + (tNow - sharedCirc.startTime);
        x = sharedCirc.r * Math.sin(sharedCirc.startTheta + omega * elapsed);
      } else {
        return;
      }
      graphTime2 += dt;
      if ((graphTime2 - graphLastSampleT2) < GRAPH_SAMPLE_DT) return;
      graphLastSampleT2 = graphTime2;
      graphData2.push({ t: graphTime2, x });
      const tMinKeep = Math.max(0, graphTime2 - GRAPH_TIME_WINDOW);
      while (graphData2.length && graphData2[0].t < tMinKeep) graphData2.shift();
      drawGraph2();
    }

    function makeShadedSphereMaterial(hexColor) {
      return new THREE.ShaderMaterial({
        uniforms: { baseColor: { value: new THREE.Color(hexColor) } },
        vertexShader: `
          varying vec3 vNormalView;
          void main() {
            vNormalView = normalize(normalMatrix * normal);
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          uniform vec3 baseColor;
          varying vec3 vNormalView;
          void main() {
            vec3 N = normalize(vNormalView);
            vec3 V = vec3(0.0, 0.0, 1.0);
            float ndotv = max(dot(N, V), 0.0);
            float shade = pow(ndotv, 0.5);
            vec3 dark   = baseColor * 0.45;
            vec3 bright = mix(baseColor, vec3(1.0), 0.28);
            vec3 color  = mix(dark, bright, shade);
            vec3 L = normalize(vec3(-0.55, 0.65, 0.55));
            vec3 H = normalize(L + V);
            float spec = pow(max(dot(N, H), 0.0), 52.0);
            color += vec3(1.0) * spec * 1.1;
            float fresnel = pow(1.0 - ndotv, 3.0);
            color += baseColor * fresnel * 0.45;
            gl_FragColor = vec4(color, 1.0);
          }
        `,
      });
    }

    function spawnSphere() {
      if (placedSphere) return;

      const geo = new THREE.SphereGeometry(0.25, 32, 16);
      const mat = makeShadedSphereMaterial(0xffff00);
      const mesh = new THREE.Mesh(geo, mat);

      // ★ 出現位置を固定（あなたの指定）
      mesh.position.copy(SPHERE_START);     // (-6,5,0)
      snapToGrid(mesh);                    // x,zだけ吸着（yはそのまま5）

      sphereGroup = new THREE.Group();
      scene.add(sphereGroup);
      sphereGroup.add(mesh);

      // 透明ヒットボックス（軌道内側を円盤でカバー）
      sphereHitbox = new THREE.Mesh(new THREE.CircleGeometry(DEFAULT_R, 64), _hitboxMat);
      sphereHitbox.position.copy(ORBIT_CENTER);
      sphereGroup.add(sphereHitbox);

      placedSphere = mesh;

      // ★ 視点中心も常に円運動中心へ
      orbitCenter.copy(ORBIT_CENTER);      // (0,5,0)
      controls.target.copy(orbitCenter);
      controls.update();

      setMode('select');

        );
        centerDot.position.copy(ORBIT_CENTER);

        sphereGroup.add(centerDot);
        // 軌跡（黄色い円）
        trajectoryLine = new THREE.Line(

          new THREE.LineBasicMaterial({ color: 0xffee00 })
        );
        trajectoryLine.visible = false;
        sphereGroup.add(trajectoryLine);
        // 中心線（中心→球、黄色）
        centerLineMesh = new THREE.Line(

          new THREE.LineBasicMaterial({ color: 0xffee00 })
        );

        sphereGroup.add(centerLineMesh);
      }

    function tryStartSpringRopeDrag() {
      const spTargets = [placedSphere, sphereHitbox].filter(Boolean);
      if (spTargets.length) {
        const hits = raycaster.intersectObjects(spTargets);
        if (hits.length) {
          _dragGroup = sphereGroup;
          raycaster.ray.intersectPlane(_dragPlane, _dragHitPt);
          _dragOffset.copy(sphereGroup.position).sub(_dragHitPt);
          controls.enabled = false;
          return true;
        }
      }
      const sTargets = [springBall, springCeil, springMesh, springHitbox].filter(Boolean);
      if (sTargets.length) {
        const hits = raycaster.intersectObjects(sTargets);
        if (hits.length) {
          _dragGroup = springGroup;
          raycaster.ray.intersectPlane(_dragPlane, _dragHitPt);
          _dragOffset.copy(springGroup.position).sub(_dragHitPt);
          controls.enabled = false;
          return true;
        }
      }
      const rTargets = [ropeLine, ropeHitbox, ropeHandHitbox].filter(Boolean);
      if (rTargets.length) {
        const hits = raycaster.intersectObjects(rTargets);
        if (hits.length) {
          _dragGroup = ropeGroup;
          raycaster.ray.intersectPlane(_dragPlane, _dragHitPt);
          _dragOffset.copy(ropeGroup.position).sub(_dragHitPt);
          controls.enabled = false;
          return true;
        }
      }
      return false;
    }

    const _rDummy = new THREE.Object3D();

    const _rDir   = new THREE.Vector3();
    function updateRopeInstances(inst) {
      const pos = inst.userData.posArr;
      const n   = inst.userData.segs;
      for (let i = 0; i < n - 1; i++) {
        const x0 = pos[i*3], y0 = pos[i*3+1], z0 = pos[i*3+2];
        const x1 = pos[(i+1)*3], y1 = pos[(i+1)*3+1], z1 = pos[(i+1)*3+2];
        const dx = x1-x0, dy = y1-y0, dz = z1-z0;
        const len = Math.sqrt(dx*dx + dy*dy + dz*dz);
        _rDummy.position.set((x0+x1)/2, (y0+y1)/2, (z0+z1)/2);
        _rDummy.scale.set(1, len, 1);
        _rDir.set(dx/len, dy/len, dz/len);
        _rDummy.quaternion.setFromUnitVectors(_rYAxis, _rDir);
        _rDummy.updateMatrix();
        inst.setMatrixAt(i, _rDummy.matrix);
      }
      inst.instanceMatrix.needsUpdate = true;
    }

    document.getElementById('toolSpring')?.addEventListener('click', () => {
      if (springBall) {
        scene.remove(springGroup);
        springGroup = null; springBall = null; springMesh = null; springCeil = null; springHitbox = null;
        document.getElementById('toolSpring').classList.remove('active');
        return;
      }

      springGroup = new THREE.Group();
      scene.add(springGroup);

      // 球
      const geo = new THREE.SphereGeometry(0.25, 32, 16);
      const mat = makeShadedSphereMaterial(0xffff00);
      springBall = new THREE.Mesh(geo, mat);
      springBall.position.set(-4, 5, 0);
      springGroup.add(springBall);

      // ばね（下端・上端ともに直線→コイル→直線、単一TubeGeometry）
      const springMat = new THREE.MeshPhongMaterial({ color: 0x999999, specular: 0xffffff, shininess: 100 });

      const bx = -4, bz = 0;
      const springBotY   = 5;    // 球の中心（ばね下端）
      const springTopY   = 8.6;  // 天井下面（ばね上端）
      const totalH       = springTopY - springBotY;
      const coilR        = 0.15;
      const turns        = 10;
      const straightFrac = 0.14; // 直線部分の割合（上下対称）
      const blendFrac    = 0.04; // コイルへのブレンド幅

      const springCurve = new THREE.Curve();
      springCurve.getPoint = (t) => {
        const y = springBotY + t * totalH;

        // コイル進行度（straightFrac〜(1-straightFrac) を 0〜1 に正規化）
        const coilStart = straightFrac;
        const coilEnd   = 1 - straightFrac;
        const coilT     = Math.max(0, Math.min(1, (t - coilStart) / (coilEnd - coilStart)));
        const angle     = coilT * turns * Math.PI * 2;

        // 下端ブレンド（r: 0→coilR）
        const bb = Math.min(1, Math.max(0, t - straightFrac) / blendFrac);
        const blendBot = bb * bb * (3 - 2 * bb);

        // 上端ブレンド（r: coilR→0）
        const bt = Math.min(1, Math.max(0, (1 - t) - straightFrac) / blendFrac);
        const blendTop = bt * bt * (3 - 2 * bt);

        const r = coilR * Math.min(blendBot, blendTop);
        return new THREE.Vector3(
          bx + Math.cos(angle) * r,
          y,
          bz + Math.sin(angle) * r
        );
      };

      const tubeGeo = new THREE.TubeGeometry(springCurve, 500, 0.035, 8, false);
      springMesh = new THREE.Mesh(tubeGeo, springMat);
      springGroup.add(springMesh);

      // 天井（茶色い直方体）
      const ceilGeo = new THREE.BoxGeometry(2.0, 0.4, 1.5);
      const ceilMat = new THREE.MeshPhongMaterial({ color: 0x8b5e3c, specular: 0x442200, shininess: 30 });
      springCeil = new THREE.Mesh(ceilGeo, ceilMat);
      springCeil.position.set(-4, springTopY + 0.2, 0);
      springGroup.add(springCeil);

      // 透明ヒットボックス（コイル＋球の動く範囲）
      springHitbox = new THREE.Mesh(new THREE.BoxGeometry(0.7, 5.5, 0.7), _hitboxMat);
      springHitbox.position.set(-4, 6.3, 0);
      springGroup.add(springHitbox);

      document.getElementById('toolSpring').classList.add('active');
    });

    // hor+: 16:9基準で水平方向の見え方を固定するためのFOV計算
    const BASE_FOV    = 50;
    const BASE_ASPECT = 16 / 9;
    function hPlusFov(aspect){
      return aspect >= BASE_ASPECT
        ? BASE_FOV
        : 2 * Math.atan(Math.tan(BASE_FOV * Math.PI / 360) * BASE_ASPECT / aspect) * 180 / Math.PI;
    }
    function resize(){

    function startViewSnapAroundCenter(dirVec, duration = 0.35, center = null) {
      // ★視点の中心は常に「円運動の中心」（オーバーライド可）
      center = center ?? orbitCenter.clone();

      // 今のズーム感（中心からの距離）を保つ
      const dist = camera.position.distanceTo(controls.target);

      // dirVec方向へ dist だけ離れた位置にカメラを置く
      const dir = dirVec.clone().normalize();
      const endPos = center.clone().add(dir.multiplyScalar(dist));

      // カメラが見る中心（target）は center 固定
      const endTarget = center;

      // Tween（スムーズ移動）
      viewTween = {
        startPos: camera.position.clone(),
        endPos: endPos,
        startTarget: controls.target.clone(),
        endTarget: endTarget,
        startTime: nowSec(),
        dur: duration,
      };
    }

    function buildSlinkyBalls() {

    function removeSlinkyBalls() {

    function resetSlinkyBalls() {
      if (!slinkyBalls) return;
      for (let i = 0; i < SL_N_BALLS; i++) {
        const x0 = (i / (SL_N_BALLS - 1)) * SL_LENGTH - SL_LENGTH / 2;
        _slBallMat.setPosition(x0, 0.9, 0);
        slinkyBalls.setMatrixAt(i, _slBallMat);
      }
      slinkyBalls.instanceMatrix.needsUpdate = true;
    }

    function slinkyWaveDx(x0, x_front) {
      if (x0 > x_front) return 0;
      if (slinkyWaveMode === 'single' && x0 < x_front - SL_WAVE_LAMBDA) return 0;
      return SL_WAVE_A * Math.sin(SL_WAVE_K * (x_front - x0));
    }
    function updateSlinkyBalls(elapsed, x_front) {
      if (!slinkyBalls) return;
      for (let i = 0; i < SL_N_BALLS; i++) {
        const x0 = (i / (SL_N_BALLS - 1)) * SL_LENGTH - SL_LENGTH / 2;
        const dx = slinkyWaveDx(x0, x_front);
        _slBallMat.setPosition(x0 + dx, 0.9, 0);
        slinkyBalls.setMatrixAt(i, _slBallMat);

      slinkyBalls.instanceMatrix.needsUpdate = true;

    function _fillWaveLinePts(pts, elapsed, x_front) {
      const cosR = Math.cos(slinkyRotAngle);
      const sinR = Math.sin(slinkyRotAngle);
      for (let i = 0; i < SL_N_CURVE; i++) {
        const x0 = (i / (SL_N_CURVE - 1)) * SL_LENGTH - SL_LENGTH / 2;
        const dx = elapsed >= 0 ? slinkyWaveDx(x0, x_front) : 0;
        pts[i * 3 + 0] = x0 + dx * cosR;
        pts[i * 3 + 1] = 0.9;
        pts[i * 3 + 2] = slinkyDispZOffset - dx * sinR;
      }
    }
    function updateSlinkyWaveLine(elapsed, x_front) {
      if (!slinkyWaveLine) return;
      const pts = new Float32Array(SL_N_CURVE * 3);
      _fillWaveLinePts(pts, elapsed, x_front);
      slinkyWaveLine.geometry.setPositions(pts);
      updateSlinkyWaveFill(elapsed, x_front);
    }
    function resetSlinkyWaveLine() {
      if (!slinkyWaveLine) return;
      const pts = new Float32Array(SL_N_CURVE * 3);
      for (let i = 0; i < SL_N_CURVE; i++) {
        const x0 = (i / (SL_N_CURVE - 1)) * SL_LENGTH - SL_LENGTH / 2;
        pts[i * 3 + 0] = x0; pts[i * 3 + 1] = 0.9; pts[i * 3 + 2] = slinkyDispZOffset;

    function buildSlinkyWaveFill() {

      const idxArr = new Uint32Array((N - 1) * 6);
      for (let i = 0; i < N - 1; i++) {
        const b = i * 6;
        idxArr[b+0]=i;   idxArr[b+1]=N+i;   idxArr[b+2]=i+1;
        idxArr[b+3]=N+i; idxArr[b+4]=N+i+1; idxArr[b+5]=i+1;
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
      geo.setIndex(new THREE.BufferAttribute(idxArr, 1));
      const mat = new THREE.MeshBasicMaterial({ color: 0xff2222, transparent: true, opacity: 0, side: THREE.DoubleSide, depthWrite: false });
      slinkyWaveFill = new THREE.Mesh(geo, mat);
      slinkyWaveFill.frustumCulled = false;
      transverseGroup.add(slinkyWaveFill);

    function updateSlinkyWaveFill(elapsed, x_front) {
      if (!slinkyWaveFill) return;
      const N = SL_N_CURVE;
      const cosR = Math.cos(slinkyRotAngle);
      const sinR = Math.sin(slinkyRotAngle);
      const posArr = slinkyWaveFill.geometry.attributes.position.array;
      for (let i = 0; i < N; i++) {
        const x0 = (i / (N - 1)) * SL_LENGTH - SL_LENGTH / 2;
        const dx = elapsed >= 0 ? slinkyWaveDx(x0, x_front) : 0;
        posArr[i*3+0] = x0 + dx * cosR; posArr[i*3+1] = 0.9; posArr[i*3+2] = slinkyDispZOffset - dx * sinR;
        posArr[(N+i)*3+0] = x0;         posArr[(N+i)*3+1] = 0.9; posArr[(N+i)*3+2] = slinkyDispZOffset;
      }
      slinkyWaveFill.geometry.attributes.position.needsUpdate = true;
      slinkyWaveFill.geometry.computeBoundingSphere();
    }
    function resetSlinkyWaveFill() {
      if (!slinkyWaveFill) return;
      const N = SL_N_CURVE;
      const posArr = slinkyWaveFill.geometry.attributes.position.array;
      for (let i = 0; i < N; i++) {

        posArr[i*3+0]=x0; posArr[i*3+1]=0.9; posArr[i*3+2]=slinkyDispZOffset;

    function buildSlinkyGridLines() {
      if (slinkyGridLines) return;
      const positions = [];
      for (let i = 0; i < SL_N_BALLS; i++) {
        const x0 = (i / (SL_N_BALLS - 1)) * SL_LENGTH - SL_LENGTH / 2;
        // Z方向の点線（真上視点で縦線として見える）
        positions.push(x0, 0.9, -1.8,  x0, 0.9, 1.8);
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      const mat = new THREE.LineDashedMaterial({ color: 0x4477aa, dashSize: 0.15, gapSize: 0.12 });
      slinkyGridLines = new THREE.LineSegments(geo, mat);
      slinkyGridLines.computeLineDistances();
      transverseGroup.add(slinkyGridLines);
    }

    function removeSlinkyGridLines() {
      if (!slinkyGridLines) return;
      transverseGroup.remove(slinkyGridLines);
      slinkyGridLines.geometry.dispose();
      slinkyGridLines.material.dispose();
      slinkyGridLines = null;
    }

    function buildSlinky() {
      if (slinkyMesh) return;
      const pts = [];
      for (let i = 0; i <= SL_N_PTS; i++) {
        const frac  = i / SL_N_PTS;
        const angle = frac * SL_TURNS * Math.PI * 2;
        pts.push(new THREE.Vector3(
          frac * SL_LENGTH - SL_LENGTH / 2,
          Math.cos(angle) * SL_HELIX_R,
          Math.sin(angle) * SL_HELIX_R
        ));
      }
      const curve  = new THREE.CatmullRomCurve3(pts);
      slinkyGeo    = new THREE.TubeGeometry(curve, SL_TUB_SEG, SL_TUBE_R, SL_RAD_SEG, false);
      slinkyOrigPos = new Float32Array(slinkyGeo.attributes.position.array);
      const mat    = new THREE.MeshStandardMaterial({ color: 0x99bbdd, metalness: 0.85, roughness: 0.15 });
      slinkyMesh   = new THREE.Mesh(slinkyGeo, mat);
      slinkyMesh.position.set(0, 0.9, 0);
      transverseGroup.add(slinkyMesh);
      document.getElementById('btnSlinky').classList.add('active');
      document.getElementById('slinkyBallRow').style.maxHeight = '400px';
    }

    function removeSlinky() {
      if (!slinkyMesh) return;
      waveActive = false;
      wavePausedElapsed = 0;
      document.getElementById('btnSlinkyStart').textContent = '▶ 開始';
      // 球モードをリセット
      slinkyBallMode = false;
      document.getElementById('ckSlinkyBall').textContent = '□';
      slinkyGridMode = false;
      document.getElementById('ckSlinkyGrid').textContent = '□';
      slinkyDispMode = false;
      document.getElementById('ckSlinkyDisp').textContent = '□';
      slinkyDispZOffset = 0;
      slinkySlideFrom = 0; slinkySlideTarget = 0; slinkySlideStartT = -1;
      slinkyRotAngle = 0; slinkyRotFrom = 0; slinkyRotTarget = 0; slinkyRotStartT = -1;
      document.getElementById('ckSlinkyRot').textContent = '□';
      document.getElementById('slinkyRotRow').style.display = 'none';
      resetSlinkyGraph();
      document.getElementById('btnSlinkySlide').classList.remove('active');
      document.getElementById('slinkySlideRow').style.display = 'none';
      document.getElementById('slinkyBallRow').style.maxHeight = '0';
      removeSlinkyBalls();
      removeSlinkyGridLines();
      removeSlinkyDispLines();
      transverseGroup.remove(slinkyMesh);
      slinkyMesh.material.dispose();
      slinkyGeo.dispose();
      slinkyMesh = null; slinkyGeo = null; slinkyOrigPos = null;
      document.getElementById('btnSlinky').classList.remove('active');
    }

    function pauseSlinkyWave() {
      wavePausedElapsed = nowSec() - waveStartTime;
      waveActive = false;
      document.getElementById('btnSlinkyStart').textContent = '▶ 開始';
    }

    function resetSlinkyWave() {
      waveActive = false;
      wavePausedElapsed = 0;
      document.getElementById('btnSlinkyStart').textContent = '▶ 開始';
      if (slinkyGeo && slinkyOrigPos) {
        slinkyGeo.attributes.position.array.set(slinkyOrigPos);
        slinkyGeo.attributes.position.needsUpdate = true;
      }
      slinkyDispZOffset = 0;
      slinkySlideFrom = 0; slinkySlideTarget = 0; slinkySlideStartT = -1;
      slinkyRotAngle = 0; slinkyRotFrom = 0; slinkyRotTarget = 0; slinkyRotStartT = -1;
      document.getElementById('ckSlinkyRot').textContent = '□';
      document.getElementById('slinkyRotRow').style.display = 'none';
      resetSlinkyGraph();
      document.getElementById('btnSlinkySlide').classList.remove('active');
      document.getElementById('slinkySlideRow').style.display = 'none';
      resetSlinkyBalls();
      resetSlinkyDispLines();
    }

    function startSlinkyWave() {
      buildSlinky();
      waveStartTime = nowSec() - wavePausedElapsed;
      waveActive    = true;
      document.getElementById('btnSlinkyStart').textContent = '■ 停止';
    }

    function autoStopSingleWave() {
      waveActive = false;
      wavePausedElapsed = 0;
      document.getElementById('btnSlinkyStart').textContent = '▶ 開始';
      if (slinkyGeo && slinkyOrigPos) {
        slinkyGeo.attributes.position.array.set(slinkyOrigPos);
        slinkyGeo.attributes.position.needsUpdate = true;
      }
      resetSlinkyBalls();
      resetSlinkyDispLines();
    }
    function updateSlinkyWave(t) {
      if (!waveActive) return;
      const elapsed = t - waveStartTime;
      const x_front = -SL_LENGTH / 2 + SL_WAVE_V * elapsed;

      // 単体モード: 波パケット末端が右端を通過したら自動停止
      if (slinkyWaveMode === 'single' && x_front - SL_WAVE_LAMBDA > SL_LENGTH / 2) {
        autoStopSingleWave();
        return;
      }

      if (slinkyGeo && slinkyOrigPos) {
        const posArr = slinkyGeo.attributes.position.array;
        const vps    = SL_RAD_SEG + 1;
        for (let s = 0; s <= SL_TUB_SEG; s++) {
          const x0 = (s / SL_TUB_SEG) * SL_LENGTH - SL_LENGTH / 2;
          const dx = slinkyWaveDx(x0, x_front);
          const base = s * vps;
          for (let v = 0; v < vps; v++) {
            posArr[(base + v) * 3] = slinkyOrigPos[(base + v) * 3] + dx;
          }
        }
        slinkyGeo.attributes.position.needsUpdate = true;
      }

      updateSlinkyBalls(elapsed, x_front);
      updateSlinkyDispLines(elapsed, x_front);
    }

    document.getElementById('btnSlinky').addEventListener('click', () => {
      if (slinkyMesh) removeSlinky(); else buildSlinky();
    });
    document.getElementById('ckSlinkyBall').addEventListener('click', () => {
      slinkyBallMode = !slinkyBallMode;
      document.getElementById('ckSlinkyBall').textContent = slinkyBallMode ? '☑' : '□';
      if (slinkyBallMode) {
        if (slinkyMesh) slinkyMesh.visible = false;
        buildSlinkyBalls();
      } else {
        removeSlinkyBalls();
        if (slinkyMesh) slinkyMesh.visible = true;
      }
      updateSlideButtonVisibility();
    });
    document.getElementById('ckSlinkyGrid').addEventListener('click', () => {
      slinkyGridMode = !slinkyGridMode;
      document.getElementById('ckSlinkyGrid').textContent = slinkyGridMode ? '☑' : '□';
      if (slinkyGridMode) buildSlinkyGridLines();
      else removeSlinkyGridLines();
      updateSlideButtonVisibility();
    });
    document.getElementById('ckSlinkyDisp').addEventListener('click', () => {
      slinkyDispMode = !slinkyDispMode;
      document.getElementById('ckSlinkyDisp').textContent = slinkyDispMode ? '☑' : '□';
      if (slinkyDispMode) buildSlinkyDispLines();
      else removeSlinkyDispLines();
      updateSlideButtonVisibility();
    });
    function updateSlideButtonVisibility() {
      const show = slinkyBallMode && slinkyGridMode && slinkyDispMode;
      document.getElementById('slinkySlideRow').style.display = show ? '' : 'none';
      if (!show) {
        if (slinkyDispZOffset !== 0 || slinkyRotAngle !== 0) {
          slinkyDispZOffset = 0;
          slinkySlideFrom = 0; slinkySlideTarget = 0; slinkySlideStartT = -1;
          slinkyRotAngle = 0; slinkyRotFrom = 0; slinkyRotTarget = 0; slinkyRotStartT = -1;
          document.getElementById('ckSlinkyRot').textContent = '□';
          document.getElementById('slinkyRotRow').style.display = 'none';
          resetSlinkyGraph();
          document.getElementById('btnSlinkySlide').classList.remove('active');
          resetSlinkyDispLines();
        }
      }
    }
    function refreshSlinkyDispLines() {
      if (!slinkyDispLines) return;
      const arr = slinkyDispLines.geometry.attributes.instanceStart.data.array;
      const elapsed = wavePausedElapsed;
      const x_front = -SL_LENGTH / 2 + SL_WAVE_V * elapsed;
      const cosR = Math.cos(slinkyRotAngle);
      const sinR = Math.sin(slinkyRotAngle);
      for (let i = 0; i < SL_N_BALLS; i++) {
        const x0 = (i / (SL_N_BALLS - 1)) * SL_LENGTH - SL_LENGTH / 2;
        const dx = elapsed > 0 ? slinkyWaveDx(x0, x_front) : 0;
        arr[i * 6 + 0] = x0;              arr[i * 6 + 1] = 0.9; arr[i * 6 + 2] = slinkyDispZOffset;
        arr[i * 6 + 3] = x0 + dx * cosR;  arr[i * 6 + 4] = 0.9; arr[i * 6 + 5] = slinkyDispZOffset - dx * sinR;
      }
      slinkyDispLines.geometry.attributes.instanceStart.needsUpdate = true;
      slinkyDispLines.geometry.attributes.instanceEnd.needsUpdate = true;
      updateSlinkyWaveLine(elapsed, x_front);
    }
    function updateSlinkySlide(t) {
      if (slinkySlideStartT < 0) return;
      const frac = Math.min((t - slinkySlideStartT) / 1.0, 1.0);
      const ease = frac < 0.5 ? 2*frac*frac : -1 + (4 - 2*frac)*frac;
      slinkyDispZOffset = slinkySlideFrom + (slinkySlideTarget - slinkySlideFrom) * ease;
      if (frac >= 1.0) {
        slinkyDispZOffset = slinkySlideTarget;
        slinkySlideStartT = -1;
      }
      if (!waveActive) refreshSlinkyDispLines();
    }
    function updateSlinkyRot(t) {
      if (slinkyRotStartT < 0) return;
      const frac = Math.min((t - slinkyRotStartT) / 1.0, 1.0);
      const ease = frac < 0.5 ? 2*frac*frac : -1 + (4 - 2*frac)*frac;
      slinkyRotAngle = slinkyRotFrom + (slinkyRotTarget - slinkyRotFrom) * ease;
      if (frac >= 1.0) {
        slinkyRotAngle = slinkyRotTarget;
        slinkyRotStartT = -1;
      }
      if (!waveActive) refreshSlinkyDispLines();
    }
    document.getElementById('btnSlinkySlide').addEventListener('click', () => {
      if (!slinkyDispLines) return;
      slinkySlideFrom   = slinkyDispZOffset;
      slinkySlideTarget = (slinkySlideTarget === -7) ? 0 : -7;
      slinkySlideStartT = nowSec();
      const sliding = slinkySlideTarget === -7;
      document.getElementById('btnSlinkySlide').classList.toggle('active', sliding);
      document.getElementById('slinkyRotRow').style.display = sliding ? '' : 'none';
      if (!sliding) {
        slinkyRotAngle = 0; slinkyRotFrom = 0; slinkyRotTarget = 0; slinkyRotStartT = -1;
        document.getElementById('ckSlinkyRot').textContent = '□';
        resetSlinkyGraph();
        if (!waveActive) refreshSlinkyDispLines();
      }
    });
    function _setSlinkyGraphAlpha(a) {
      if (!slinkyGraphAxes) return;
      slinkyGraphAxes.traverse(obj => {
        if (obj.material) { obj.material.transparent = true; obj.material.opacity = a; obj.material.needsUpdate = true; }
      });
    }
    function _setSlinkyWaveLineAlpha(a) {
      if (slinkyWaveLine) slinkyWaveLine.material.opacity = a;
      if (slinkyWaveFill) slinkyWaveFill.material.opacity = 0.18 * a;
    }
    function makeSlinkyAxisLabel(text) {
      const canvas = document.createElement('canvas');
      canvas.width = 256; canvas.height = 64;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, 256, 64);
      ctx.fillStyle = '#334466';
      ctx.font = 'bold 40px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, 128, 32);
      const tex = new THREE.CanvasTexture(canvas);
      const mat = new THREE.SpriteMaterial({ map: tex, depthTest: false, transparent: true });
      const sprite = new THREE.Sprite(mat);
      sprite.scale.set(2.0, 0.5, 1);
      return sprite;
    }
    function buildSlinkyGraphAxes() {
      if (slinkyGraphAxes) return;
      slinkyGraphAxes = new THREE.Group();
      const z0  = slinkyDispZOffset;
      const xL  = -SL_LENGTH / 2;
      const xR  =  SL_LENGTH / 2;
      const amp = SL_WAVE_A * 1.6;
      const y   = 0.9;
      const vx  = xL;            // 縦軸X = 1番目のグリッド線
      const vy  = y - 0.005;    // 縦軸Y = 横軸より少し下（赤い線との重なり回避）
      const ax2 = xR + 1.2;
      const az1 = z0 + amp + 0.3, az2 = z0 - amp - 0.8;
      const pts = [
        // 横軸 (位置X) — 縦軸より少し手前から
        vx - 0.5, y, z0,   ax2, y, z0,
        // 矢印 (+X)
        ax2, y, z0,   ax2 - 0.45, y, z0 - 0.18,
        ax2, y, z0,   ax2 - 0.45, y, z0 + 0.18,
        // 縦軸 (変位) — Y方向に0.05下げて赤い線の下に描画
        vx, vy, az1,   vx, vy, az2,
        // 矢印 (-Z = 正変位)
        vx, vy, az2,   vx - 0.18, vy, az2 + 0.45,
        vx, vy, az2,   vx + 0.18, vy, az2 + 0.45,
        // 原点マーク
        vx - 0.08, vy, z0,   vx + 0.08, vy, z0,
      ];
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
      const lineMat = new THREE.LineBasicMaterial({ color: 0x334466, transparent: true });
      slinkyGraphAxes.add(new THREE.LineSegments(geo, lineMat));
      const lblX = makeSlinkyAxisLabel('位置X');
      lblX.position.set(ax2 + 1.2, y, z0);
      slinkyGraphAxes.add(lblX);
      const lblY = makeSlinkyAxisLabel('変位Y');
      lblY.position.set(vx, y, az2 - 0.8);
      slinkyGraphAxes.add(lblY);
      transverseGroup.add(slinkyGraphAxes);
    }
    function removeSlinkyGraphAxes() {
      if (!slinkyGraphAxes) return;
      transverseGroup.remove(slinkyGraphAxes);
      slinkyGraphAxes.traverse(obj => {
        if (obj.geometry) obj.geometry.dispose();
        if (obj.material) {
          if (obj.material.map) obj.material.map.dispose();
          obj.material.dispose();
        }
      });
      slinkyGraphAxes = null;
    }
    function resetSlinkyWaveLineMode() {
      slinkyWaveLineMode       = false;
      slinkyWaveLineFadeDir    = 0;
      slinkyWaveLineAlpha      = 1;
      document.getElementById('ckSlinkyWaveLine').textContent = '□';
      document.getElementById('slinkyWaveLineRow').style.display = 'none';
      removeSlinkyWaveLine();
    }
    function resetSlinkyGraph() {
      resetSlinkyWaveLineMode();
      slinkyGraphMode    = false;
      slinkyGraphFadeDir = 0;
      slinkyGraphAlpha   = 1;
      document.getElementById('ckSlinkyGraph').textContent = '□';
      document.getElementById('slinkyGraphRow').style.display = 'none';
      removeSlinkyGraphAxes();
    }
    document.getElementById('ckSlinkyRot').addEventListener('click', () => {
      const toRot = slinkyRotTarget !== Math.PI / 2;
      slinkyRotFrom   = slinkyRotAngle;
      slinkyRotTarget = toRot ? Math.PI / 2 : 0;
      slinkyRotStartT = nowSec();
      document.getElementById('ckSlinkyRot').textContent = toRot ? '☑' : '□';
      document.getElementById('slinkyGraphRow').style.display = toRot ? '' : 'none';
      if (!toRot) resetSlinkyGraph();
    });
    document.getElementById('ckSlinkyGraph').addEventListener('click', () => {
      slinkyGraphMode = !slinkyGraphMode;
      document.getElementById('ckSlinkyGraph').textContent = slinkyGraphMode ? '☑' : '□';
      if (slinkyGraphMode) {
        buildSlinkyGraphAxes();
        _setSlinkyGraphAlpha(0);
        slinkyGraphAlpha      = 0;
        slinkyGraphFadeDir    = 1;
        slinkyGraphFadeStartT = nowSec();
        document.getElementById('slinkyWaveLineRow').style.display = '';
      } else {
        // 曲線も同時にフェードアウト
        if (slinkyWaveLineMode) {
          slinkyWaveLineMode = false;
          document.getElementById('ckSlinkyWaveLine').textContent = '□';
          slinkyWaveLineAlpha      = 1;
          slinkyWaveLineFadeDir    = -1;
          slinkyWaveLineFadeStartT = nowSec();
        }
        document.getElementById('slinkyWaveLineRow').style.display = 'none';
        slinkyGraphAlpha      = 1;
        slinkyGraphFadeDir    = -1;
        slinkyGraphFadeStartT = nowSec();
      }
    });
    document.getElementById('ckSlinkyWaveLine').addEventListener('click', () => {
      slinkyWaveLineMode = !slinkyWaveLineMode;
      document.getElementById('ckSlinkyWaveLine').textContent = slinkyWaveLineMode ? '☑' : '□';
      if (slinkyWaveLineMode) {
        buildSlinkyWaveLine();
        refreshSlinkyDispLines();
        _setSlinkyWaveLineAlpha(0);
        slinkyWaveLineAlpha      = 0;
        slinkyWaveLineFadeDir    = 1;
        slinkyWaveLineFadeStartT = nowSec();
      } else {
        slinkyWaveLineAlpha      = 1;
        slinkyWaveLineFadeDir    = -1;
        slinkyWaveLineFadeStartT = nowSec();
      }
    });
    document.getElementById('ckSlinkyModeCont').addEventListener('click', () => {
      if (slinkyWaveMode === 'continuous') return;
      slinkyWaveMode = 'continuous';
      document.getElementById('ckSlinkyModeCont').textContent   = '☑';
      document.getElementById('ckSlinkyModeSingle').textContent = '□';
    });
    document.getElementById('ckSlinkyModeSingle').addEventListener('click', () => {
      if (slinkyWaveMode === 'single') return;
      slinkyWaveMode = 'single';
      document.getElementById('ckSlinkyModeSingle').textContent = '☑';
      document.getElementById('ckSlinkyModeCont').textContent   = '□';
      if (waveActive) pauseSlinkyWave();
    });
    document.getElementById('btnSlinkyStart').addEventListener('click', () => {
      if (waveActive) pauseSlinkyWave(); else startSlinkyWave();
    });
    document.getElementById('btnSlinkyReset').addEventListener('click', resetSlinkyWave);

    // ===== 真上視点（横波と縦波タブ） =====
    function snapToTopDown() {
      // camera.up は (0,1,0) のまま変更しない（ジンバルロック回避のため Z に微小オフセット）
      viewTween = {
        startPos:    camera.position.clone(),
        endPos:      new THREE.Vector3(-2, 17, -3.99),
        startTarget: controls.target.clone(),
        endTarget:   new THREE.Vector3(-2, 0, -4),
        startTime:   nowSec(),
        dur:         0.5,
      };
    }
    document.getElementById('btnViewTopDown').addEventListener('click', snapToTopDown);

    function tick(){
      requestAnimationFrame(tick);
      controls.update();
      const t = nowSec();
      updateViewSnap(t);
      for (const obj of placedGroup.children){
        updateCircular(obj, t);
      }
      if (placedSphere) updateCircular(placedSphere, t);

      // 軌跡（半径変化時のみ再構築）・中心線（毎フレーム更新）
      if (trajectoryLine && placedSphere) {
        const r = sharedCirc.r;
        if (r !== lastOrbitR) {
          trajectoryLine.geometry.setFromPoints(buildOrbitCirclePoints(r));
          if (sphereHitbox) {
            sphereHitbox.geometry.dispose();
            sphereHitbox.geometry = new THREE.CircleGeometry(r, 64);
          }
          lastOrbitR = r;
        }
        if (centerLineMesh) {
          centerLineMesh.geometry.setFromPoints([ORBIT_CENTER, placedSphere.position]);
        }
      }

      updateGraphTick(t);
      updateGraphTick2(t);
      updateSlinkyRot(t);
      updateSlinkySlide(t);
      updateSlinkyWave(t);

      // □グラフ フェード
      if (slinkyGraphFadeDir !== 0) {
        const frac = Math.min(1, t - slinkyGraphFadeStartT);
        slinkyGraphAlpha = slinkyGraphFadeDir === 1 ? frac : 1 - frac;
        _setSlinkyGraphAlpha(slinkyGraphAlpha);
        if (frac >= 1) {
          slinkyGraphFadeDir = 0;
          if (slinkyGraphAlpha <= 0) removeSlinkyGraphAxes();
        }
      }
      // □曲線 フェード
      if (slinkyWaveLineFadeDir !== 0) {
        const frac = Math.min(1, t - slinkyWaveLineFadeStartT);
        slinkyWaveLineAlpha = slinkyWaveLineFadeDir === 1 ? frac : 1 - frac;
        _setSlinkyWaveLineAlpha(slinkyWaveLineAlpha);
        if (frac >= 1) {
          slinkyWaveLineFadeDir = 0;
          if (slinkyWaveLineAlpha <= 0) removeSlinkyWaveLine();
        }
      }

      // 球とばねの更新（円運動の Y 成分に連動した単振動）
      if (springBall && springMesh) {
        const circ = sharedCirc;
        if (circ.active) {
          const elapsed = circ.frozenElapsed + (t - circ.startTime);
          const dy = circ.r * Math.sin(circ.startTheta + (Math.PI * 2 / circ.T) * elapsed);
          springBall.position.y = 5 + dy;
          const baseLen = 3.6; // springTopY(8.6) - springBotY(5)
          const s = Math.max(0.01, (baseLen - dy) / baseLen);
          springMesh.scale.y = s;
          springMesh.position.y = 8.6 * (1 - s);
        }
      }

      // ロープと手の更新（単振動が右へ伝播する横波）
      if (ropeLine) {
        const circ = sharedCirc;
        if (circ.active) {
          const RX0 = 0, RX1 = ROPE_LEN, RY = 5, RZ = 0;
          const elapsed = circ.frozenElapsed + (t - circ.startTime);
          const omega   = Math.PI * 2 / circ.T;
          const wavelen = RX1 - RX0;
          const pos = ropeLine.userData.posArr;
          const n   = ropeLine.userData.segs;

          for (let i = 0; i < n; i++) {
            const x     = RX0 + (RX1 - RX0) * i / (n - 1);
            const delay = (x - RX0) * GRAPH_TIME_WINDOW / wavelen;
            const y     = elapsed >= delay
              ? RY + circ.r * Math.sin(circ.startTheta + omega * (elapsed - delay))
              : RY;
            pos[i*3] = x; pos[i*3+1] = y; pos[i*3+2] = RZ;
          }
          updateRopeInstances(ropeLine);

          // ノード球の位置を更新
          if (ropeNodes) {
            const _nd = new THREE.Object3D();
            for (let i = 0; i < n; i++) {
              _nd.position.set(pos[i*3], pos[i*3+1], pos[i*3+2]);
              _nd.updateMatrix();
              ropeNodes.setMatrixAt(i, _nd.matrix);
            }
            ropeNodes.instanceMatrix.needsUpdate = true;
          }

          // 中央マーカーをロープ中央セグメントに追従
          if (ropeCenterMarker) {
            const _ci = Math.floor((n - 1) / 2);
            const _ax = pos[_ci*3],     _ay = pos[_ci*3+1],     _az = pos[_ci*3+2];
            const _bx = pos[(_ci+1)*3], _by = pos[(_ci+1)*3+1], _bz = pos[(_ci+1)*3+2];
            ropeCenterMarker.position.set((_ax+_bx)/2, (_ay+_by)/2, (_az+_bz)/2);
            const _dir = new THREE.Vector3(_bx-_ax, _by-_ay, _bz-_az).normalize();
            ropeCenterMarker.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), _dir);
          }

          // 手（P0 と同じ変位）
          if (ropeHandGroup) {
            ropeHandGroup.position.y = RY + circ.r * Math.sin(circ.startTheta + omega * elapsed);
          }
        }
      }

      // テクスチャ更新（pointermoveのたびではなく1フレーム1回）
      if (inkDirty)    { if (inkBoardTexture) inkBoardTexture.needsUpdate = true; inkDirty    = false; }
      if (graphDirty)  { if (graphTexture)   graphTexture.needsUpdate    = true; graphDirty  = false; }
      if (graphDirty2) { if (graphTexture2)  graphTexture2.needsUpdate   = true; graphDirty2 = false; }
      renderer.render(scene, camera);
    }
    tick();
  </script>
