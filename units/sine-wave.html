<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>正弦波（授業用）｜3Dボード</title>
  <style>
    :root{
      --bg:#ffffff;
      --panel:rgba(240,243,252,0.95);
      --border:rgba(70,90,160,0.30);
      --text:#1a2040;
      --muted:#5566aa;
    }
    html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    #app{position:fixed;inset:0;overflow:hidden}

    /* 3Dキャンバス */
    canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

    /* 上バー */
    .topbar{
      position:absolute;left:0;top:0;right:0;z-index:5;
      display:flex;gap:8px;align-items:center;
      padding:10px 12px;
      background:linear-gradient(to bottom, rgba(255,255,255,.80), rgba(255,255,255,0));
      pointer-events:none;
    }
    .topbar a, .topbar button, .topbar .pill{pointer-events:auto}
    .btn, .pill{
      border:1px solid var(--border);
      background:var(--panel);
      color:var(--text);
      border-radius:12px;
      padding:8px 10px;
      font-size:12px;
      cursor:pointer;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      gap:6px;
    }
    .btn:hover{opacity:.9}
    .pill{cursor:default;color:var(--muted)}
    .btn.active{ outline:2px solid rgba(120,170,255,.6); }

    /* 左サイドバー */
    .sidebar{
      position:absolute;left:10px;top:56px;bottom:10px;z-index:6;
      width:280px;max-width:85vw;
      background:var(--panel);
      border:1px solid var(--border);
      border-radius:16px;
      padding:12px;
      overflow:auto;
      backdrop-filter: blur(6px);
    }
    .h{font-weight:800;font-size:13px;margin:0 0 8px}
    .sub{color:var(--muted);font-size:12px;line-height:1.5;margin:0 0 10px}
    .group{margin:10px 0 12px}
    .groupTitle{font-weight:700;font-size:12px;color:var(--text);margin:0 0 8px}
    .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
    .lbl{color:var(--muted);font-size:12px;align-self:center}
    .num{width:72px;max-width:90px}
    .row .btn{flex:1;justify-content:center}

    /* 道具箱の開閉 */
    #toolboxPanel{
      position: fixed;
      left: 16px;
      top: 72px;
      z-index: 1000;
      transition: transform 180ms ease;
      transform: translateX(0);
    }
    #toolboxPanel.is-collapsed{
      transform: translateX(calc(-100% + 36px));
    }
    #toolboxToggle.toolboxToggle{
      position: absolute;
      top: 10px;
      right: 10px;
      width: 28px;
      height: 28px;
      border-radius: 10px;
      border: 1px solid rgba(70,90,160,0.25);
      background: rgba(240,243,252,0.90);
      color: #1a2040;
      cursor: pointer;
      display: grid;
      place-items: center;
      font-weight: 700;
      line-height: 1;
    }
    #toolboxPanel.is-collapsed #toolboxToggle{
      right: 4px;
    }
    #toolboxPanel{
      overflow: hidden auto;              /* 中身が画面より長いときは縦にスクロール（横は出さない） */
      overscroll-behavior: contain;
    }
    #toolboxPanel.is-collapsed > :not(#toolboxToggle){
      display: none !important;
    }

    /* 右下ヘルプ */
    .help{
      position:absolute;right:10px;bottom:10px;z-index:6;
      background:rgba(240,243,252,0.92);
      border:1px solid rgba(70,90,160,0.20);
      border-radius:14px;
      padding:10px 12px;
      font-size:12px;
      color:var(--muted);
      max-width:420px;
    }
    .help b{color:var(--text)}
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="app">
    <canvas id="c"></canvas>

    <!-- 上バー -->
    <div class="topbar">
      <a class="btn" href="../waves-propagation.html">← 波の性質へ</a>
      <a class="btn" href="../index.html">ホーム</a>
    </div>

    <!-- 左サイドバー：道具箱 -->
    <aside class="sidebar" id="toolboxPanel">
      <button id="toolboxToggle" class="toolboxToggle" type="button" aria-expanded="false">＞</button>

      <p class="h">道具箱</p>

      <div class="group">
        <p class="groupTitle">単振動</p>
        <div class="row">
          <span class="lbl">D</span>
          <input id="circD" class="num" type="number" value="4" step="0.5" min="0" />
          <span class="lbl">T</span>
          <input id="circT" class="num" type="number" value="4" step="0.5" min="0.1" />
        </div>
        <div class="row">
          <button class="btn" id="circToggle">▶ 開始</button>
          <button class="btn" id="circReset">↺ リセット</button>
        </div>
      </div>

      <div class="group">
        <div class="row">
          <button class="btn" id="toolSpring">球とばね</button>
        </div>
        <div class="row">
          <button class="btn" id="toolRopeHand">ロープと手</button>
        </div>
        <div id="ropeSubBtns" style="max-height:0;overflow:hidden;transition:max-height 0.35s ease">
          <div class="row">
            <button class="btn" id="ropeToSphere">ロープ→球</button>
          </div>
        </div>
      </div>

    </aside>

    <div class="help">
      <b>操作</b>：ドラッグ＝視点回転／ホイール＝ズーム／右ドラッグ＝平行移動
    </div>
  </div>

  <!-- エラー表示 -->
  <div id="errOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:99999;padding:24px;overflow:auto;">
    <div style="background:#1a0808;border:2px solid #cc3333;border-radius:10px;padding:18px;max-width:820px;margin:auto;color:#ffcccc;font-family:monospace;font-size:12px;">
      <div style="color:#ff5555;font-size:14px;font-weight:bold;margin-bottom:10px;">⚠ JavaScript Error</div>
      <pre id="errMsg" style="white-space:pre-wrap;word-break:break-all;margin:0;"></pre>
    </div>
  </div>
  <script>
  window.addEventListener('error', (e) => {
    const el = document.getElementById('errOverlay');
    const msg = document.getElementById('errMsg');
    if (el && msg) {
      el.style.display = 'block';
      msg.textContent += (e.message || 'Unknown error') + '\n' +
        (e.filename ? '  at ' + e.filename + ':' + e.lineno + ':' + e.colno + '\n' : '') +
        (e.error?.stack ? e.error.stack : '') + '\n\n';
    }
  });
  window.addEventListener('unhandledrejection', (e) => {
    const el = document.getElementById('errOverlay');
    const msg = document.getElementById('errMsg');
    if (el && msg) {
      el.style.display = 'block';
      msg.textContent += 'Unhandled Promise rejection:\n' +
        (e.reason?.message || String(e.reason) || 'Unknown') + '\n' +
        (e.reason?.stack || '') + '\n\n';
    }
  });
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ===== 基本セットアップ =====
    const canvas = document.getElementById('c');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(2, window.devicePixelRatio));

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xffffff);

    const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 200);
    camera.position.set(0, 8, 18);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.target.set(0, 0, 0);
    controls.zoomToCursor = true;
    controls.update();

    // ライト
    scene.add(new THREE.AmbientLight(0xffffff, 1.0));
    const dir = new THREE.DirectionalLight(0xffffff, 0.70);
    dir.position.set(6, 10, 6);
    scene.add(dir);

    // 地面グリッド
    const grid = new THREE.GridHelper(20, 8, 0x9bb0d0, 0xc8d6e8);
    grid.position.y = 0;
    scene.add(grid);

    // テキストスプライト生成ヘルパー
    function makeTextSprite(text, { fontSize = 26, color = '#000000', scale = 1.1 } = {}) {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      ctx.font = `bold ${fontSize}px system-ui`;
      const w = Math.ceil(ctx.measureText(text).width) + 24;
      const h = fontSize + 24;
      canvas.width = w; canvas.height = h;
      ctx.font = `bold ${fontSize}px system-ui`;
      ctx.fillStyle = color;
      ctx.textBaseline = 'middle';
      ctx.fillText(text, 12, h / 2);
      const tex = new THREE.CanvasTexture(canvas);
      const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false });
      const sprite = new THREE.Sprite(mat);
      sprite.scale.set(scale * w / h, scale, 1);
      return sprite;
    }

    // 分数スプライト生成ヘルパー（numerator/denominator + suffix）
    function makeFractionSprite(numerator, denominator, suffix, { color = '#000000', scale = 1.0 } = {}) {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      const fs = 22, gap = 6, pad = 10;
      ctx.font = `bold ${fs}px system-ui`;
      const nW = ctx.measureText(numerator).width;
      const dW = ctx.measureText(denominator).width;
      const sW = suffix ? ctx.measureText(suffix).width : 0;
      const fracW = Math.max(nW, dW) + 6;
      const fracH = fs * 2 + 6;
      const totalW = fracW + (suffix ? gap + sW : 0) + pad * 2;
      const totalH = fracH + pad * 2;
      canvas.width  = Math.ceil(totalW);
      canvas.height = Math.ceil(totalH);
      ctx.font = `bold ${fs}px system-ui`;
      ctx.fillStyle = color;
      ctx.textAlign = 'center';
      // 分子
      ctx.textBaseline = 'alphabetic';
      ctx.fillText(numerator, pad + fracW / 2, pad + fs);
      // 横線
      ctx.fillRect(pad, pad + fs + 3, fracW, 1.5);
      // 分母
      ctx.textBaseline = 'top';
      ctx.fillText(denominator, pad + fracW / 2, pad + fs + 5);
      // 後置文字（"T" など）
      if (suffix) {
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText(suffix, pad + fracW + gap, totalH / 2);
      }
      const tex = new THREE.CanvasTexture(canvas);
      const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false });
      const sp = new THREE.Sprite(mat);
      sp.scale.set(scale * totalW / totalH, scale, 1);
      return sp;
    }

    // Z軸矢印：(-10,0,-10) → (-10,0,12)
    const _arrowZDir = new THREE.Vector3(0, 0, 1);
    const _arrowZOrg = new THREE.Vector3(-10, 0, -10);
    const arrowZ = new THREE.ArrowHelper(_arrowZDir, _arrowZOrg, 22, 0x334488, 0.8, 0.4);
    scene.add(arrowZ);
    const labelArrowZ = makeTextSprite('時間t');
    labelArrowZ.position.set(-10, 0.8, 12.8);
    scene.add(labelArrowZ);

    // X軸矢印：(-10,0,-10) → (12,0,-10)
    const _arrowXDir = new THREE.Vector3(1, 0, 0);
    const _arrowXOrg = new THREE.Vector3(-10, 0, -10);
    const arrowX = new THREE.ArrowHelper(_arrowXDir, _arrowXOrg, 22, 0x334488, 0.8, 0.4);
    scene.add(arrowX);
    const labelArrowX = makeTextSprite('位置x');
    labelArrowX.position.set(12.8, 0.8, -10);
    scene.add(labelArrowX);

    // 時間軸の目盛りラベル（2グリッドごと：Z=-5, 0, 5, 10）
    {
      const lbl1 = makeFractionSprite('1', '2', 'T', { scale: 0.9 });
      lbl1.position.set(-11.5, 0.8, -5);
      scene.add(lbl1);
      const lbl2 = makeTextSprite('T', { fontSize: 22, scale: 0.9 });
      lbl2.position.set(-11.5, 0.8, 0);
      scene.add(lbl2);
      const lbl3 = makeFractionSprite('3', '2', 'T', { scale: 0.9 });
      lbl3.position.set(-11.5, 0.8, 5);
      scene.add(lbl3);
      const lbl4 = makeTextSprite('2T', { fontSize: 22, scale: 0.9 });
      lbl4.position.set(-11.5, 0.8, 10);
      scene.add(lbl4);
    }

    // ===== リサイズ =====
    const BASE_FOV    = 50;
    const BASE_ASPECT = 16 / 9;
    function hPlusFov(aspect){
      return aspect >= BASE_ASPECT
        ? BASE_FOV
        : 2 * Math.atan(Math.tan(BASE_FOV * Math.PI / 360) * BASE_ASPECT / aspect) * 180 / Math.PI;
    }
    function resize(){
      const w = window.innerWidth, h = window.innerHeight;
      renderer.setSize(w, h, false);
      camera.fov    = hPlusFov(w / h);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', resize);
    resize();

    function nowSec(){ return performance.now() / 1000; }

    // ===== 単振動制御 =====
    const circ = { active: false, r: 2, T: 4, startTime: 0, startTheta: 0, frozenElapsed: 0 };

    function readCircParams() {
      const D = parseFloat(document.getElementById('circD')?.value || '0');
      return {
        r: Math.max(0, D / 2),
        T: Math.max(0.1, parseFloat(document.getElementById('circT')?.value || '1')),
      };
    }

    function updateCircToggleBtn() {
      const btn = document.getElementById('circToggle');
      if (btn) btn.textContent = circ.active ? '■ 停止' : '▶ 開始';
    }

    document.getElementById('circToggle')?.addEventListener('click', () => {
      const { r, T } = readCircParams();
      if (circ.active) {
        // 停止：経過時間を積算保存（wave-medium-motion と同じ frozenElapsed パターン）
        circ.frozenElapsed += nowSec() - circ.startTime;
        circ.active = false;
      } else {
        circ.r = r; circ.T = T;
        if (circ.frozenElapsed === 0) {
          // 初回スタート or リセット後：グラフをリセットして最初から
          circ.startTheta = 0;
          resetYtGraph(T);
          resetYxGraph();
          resetYxShiftedGraphs();
        }
        // 再開：startTime だけ更新、frozenElapsed・startTheta は維持
        circ.startTime = nowSec();
        circ.active = true;
      }
      updateCircToggleBtn();
    });



    document.getElementById('circReset')?.addEventListener('click', () => {
      circ.active = false;
      circ.startTheta = 0;
      circ.frozenElapsed = 0;
      updateCircToggleBtn();
      if (springBall && springMesh) {
        springBall.position.y = 5;
        springMesh.scale.y = 1;
        springMesh.position.y = 0;
      }
      if (ropeLine) {
        const pos = ropeLine.userData.posArr;
        const n   = ropeLine.userData.segs;
        for (let i = 0; i < n; i++) {
          pos[i*3] = 20 * i / (n - 1); pos[i*3+1] = 5; pos[i*3+2] = 0;
        }
        updateRopeInstances(ropeLine);
        if (ropeHandGroup) ropeHandGroup.position.y = 5;
      }
      ropeParticles.forEach(s => { s.position.y = 5; });
      if (ytLine) resetYtGraph(circ.T);
      if (yxLine) resetYxGraph();
      if (yxShiftedLines.length > 0) resetYxShiftedGraphs();
    });

    // ===== 球とばね =====
    let springGroup   = null;
    let springBall    = null;
    let springMesh    = null;
    let springCeil    = null;
    let springHitbox  = null;

    function makeShadedSphereMaterial(hexColor) {
      return new THREE.ShaderMaterial({
        uniforms: { baseColor: { value: new THREE.Color(hexColor) } },
        vertexShader: `
          varying vec3 vNormalView;
          void main() {
            vNormalView = normalize(normalMatrix * normal);
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          uniform vec3 baseColor;
          varying vec3 vNormalView;
          void main() {
            vec3 N = normalize(vNormalView);
            vec3 V = vec3(0.0, 0.0, 1.0);
            float ndotv = max(dot(N, V), 0.0);
            float shade = pow(ndotv, 0.5);
            vec3 dark   = baseColor * 0.45;
            vec3 bright = mix(baseColor, vec3(1.0), 0.28);
            vec3 color  = mix(dark, bright, shade);
            vec3 L = normalize(vec3(-0.55, 0.65, 0.55));
            vec3 H = normalize(L + V);
            float spec = pow(max(dot(N, H), 0.0), 52.0);
            color += vec3(1.0) * spec * 1.1;
            float fresnel = pow(1.0 - ndotv, 3.0);
            color += baseColor * fresnel * 0.45;
            gl_FragColor = vec4(color, 1.0);
          }
        `,
      });
    }

    document.getElementById('toolSpring')?.addEventListener('click', () => {
      if (springBall) {
        scene.remove(springGroup);
        springGroup = null; springBall = null; springMesh = null; springCeil = null; springHitbox = null;
        document.getElementById('toolSpring').classList.remove('active');
        return;
      }

      springGroup = new THREE.Group();
      scene.add(springGroup);

      // 球
      springBall = new THREE.Mesh(
        new THREE.SphereGeometry(0.25, 32, 16),
        makeShadedSphereMaterial(0xffff00)
      );
      springBall.position.set(-4, 5, 0);
      springGroup.add(springBall);

      // ばね（直線→コイル→直線、単一TubeGeometry）
      const springMat = new THREE.MeshPhongMaterial({ color: 0x999999, specular: 0xffffff, shininess: 100 });
      const bx = -4, bz = 0;
      const springBotY   = 5;
      const springTopY   = 8.6;
      const totalH       = springTopY - springBotY;
      const coilR        = 0.15;
      const turns        = 10;
      const straightFrac = 0.14;
      const blendFrac    = 0.04;
      const springCurve  = new THREE.Curve();
      springCurve.getPoint = (t) => {
        const y = springBotY + t * totalH;
        const coilStart = straightFrac, coilEnd = 1 - straightFrac;
        const coilT = Math.max(0, Math.min(1, (t - coilStart) / (coilEnd - coilStart)));
        const angle = coilT * turns * Math.PI * 2;
        const bb = Math.min(1, Math.max(0, t - straightFrac) / blendFrac);
        const blendBot = bb * bb * (3 - 2 * bb);
        const bt = Math.min(1, Math.max(0, (1 - t) - straightFrac) / blendFrac);
        const blendTop = bt * bt * (3 - 2 * bt);
        const r = coilR * Math.min(blendBot, blendTop);
        return new THREE.Vector3(bx + Math.cos(angle) * r, y, bz + Math.sin(angle) * r);
      };
      springMesh = new THREE.Mesh(
        new THREE.TubeGeometry(springCurve, 500, 0.035, 8, false),
        springMat
      );
      springGroup.add(springMesh);

      // 天井
      springCeil = new THREE.Mesh(
        new THREE.BoxGeometry(2.0, 0.4, 1.5),
        new THREE.MeshPhongMaterial({ color: 0x8b5e3c, specular: 0x442200, shininess: 30 })
      );
      springCeil.position.set(-4, springTopY + 0.2, 0);
      springGroup.add(springCeil);

      // ばね全体の透明ヒットボックス（コイル＋球の動く範囲をカバー）
      springHitbox = new THREE.Mesh(new THREE.BoxGeometry(0.7, 5.5, 0.7), _hitboxMat);
      springHitbox.position.set(-4, 6.3, 0);
      springGroup.add(springHitbox);

      document.getElementById('toolSpring').classList.add('active');
    });

    // ===== ロープと手 =====
    let ropeGroup      = null;
    let ropeLine       = null;
    let ropeHandGroup  = null;
    let ropeHitbox     = null;
    let ropeHandHitbox = null;
    let ropeParticles  = [];

    // 透明ヒットボックス用の共通マテリアル
    const _hitboxMat = new THREE.MeshBasicMaterial({
      transparent: true, opacity: 0, side: THREE.DoubleSide, depthWrite: false
    });

    const _rDummy = new THREE.Object3D();
    const _rYAxis = new THREE.Vector3(0, 1, 0);
    const _rDir   = new THREE.Vector3();
    function updateRopeInstances(inst) {
      const pos = inst.userData.posArr;
      const n   = inst.userData.segs;
      for (let i = 0; i < n - 1; i++) {
        const x0 = pos[i*3], y0 = pos[i*3+1], z0 = pos[i*3+2];
        const x1 = pos[(i+1)*3], y1 = pos[(i+1)*3+1], z1 = pos[(i+1)*3+2];
        const dx = x1-x0, dy = y1-y0, dz = z1-z0;
        const len = Math.sqrt(dx*dx + dy*dy + dz*dz);
        _rDummy.position.set((x0+x1)/2, (y0+y1)/2, (z0+z1)/2);
        _rDummy.scale.set(1, len, 1);
        _rDir.set(dx/len, dy/len, dz/len);
        _rDummy.quaternion.setFromUnitVectors(_rYAxis, _rDir);
        _rDummy.updateMatrix();
        inst.setMatrixAt(i, _rDummy.matrix);
      }
      inst.instanceMatrix.needsUpdate = true;
    }

    function buildHandGroup() {
      const g = new THREE.Group();
      new THREE.TextureLoader().load('hand.jpeg', (tex) => {
        const img = tex.image;
        const can = document.createElement('canvas');
        can.width = img.width; can.height = img.height;
        const ctx = can.getContext('2d');
        ctx.drawImage(img, 0, 0);
        const id = ctx.getImageData(0, 0, can.width, can.height);
        const d = id.data;
        for (let i = 0; i < d.length; i += 4) {
          const m = Math.min(d[i], d[i+1], d[i+2]);
          if (m > 230) d[i+3] = 0;
          else if (m > 200) d[i+3] = Math.round((230 - m) / 30 * 255);
        }
        ctx.putImageData(id, 0, 0);
        const geo = new THREE.PlaneGeometry(3.6, 2.7);
        const mat = new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(can), transparent: true, side: THREE.DoubleSide });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(0 - (0.78 - 0.5) * 3.6, -(0.45 - 0.5) * 2.7, 0);
        g.add(mesh);
      });
      return g;
    }

    document.getElementById('toolRopeHand')?.addEventListener('click', () => {
      if (ropeLine) {
        scene.remove(ropeGroup);
        ropeGroup = null; ropeLine = null; ropeHandGroup = null; ropeHitbox = null; ropeHandHitbox = null;
        ropeParticles = [];
        document.getElementById('toolRopeHand').classList.remove('active');
        document.getElementById('ropeToSphere').classList.remove('active');
        document.getElementById('ropeSubBtns').style.maxHeight = '0';
        return;
      }

      ropeGroup = new THREE.Group();
      scene.add(ropeGroup);

      const RX0 = 0, RX1 = 20, RY = 5, RZ = 0;
      const RSEGS = 80;

      const ropePosArr = new Float32Array(RSEGS * 3);
      for (let i = 0; i < RSEGS; i++) {
        ropePosArr[i*3]   = RX0 + (RX1 - RX0) * i / (RSEGS - 1);
        ropePosArr[i*3+1] = RY;
        ropePosArr[i*3+2] = RZ;
      }

      // ロープテクスチャ（斜め縞）
      const ropeTC = document.createElement('canvas');
      ropeTC.width = 64; ropeTC.height = 64;
      const ropeRCtx = ropeTC.getContext('2d');
      ropeRCtx.fillStyle = '#c89050';
      ropeRCtx.fillRect(0, 0, 64, 64);
      ropeRCtx.strokeStyle = '#7a5020';
      ropeRCtx.lineWidth = 10;
      for (let yy = -64; yy < 128; yy += 20) {
        ropeRCtx.beginPath();
        ropeRCtx.moveTo(0, yy); ropeRCtx.lineTo(64, yy + 64);
        ropeRCtx.stroke();
      }
      const ropeTex = new THREE.CanvasTexture(ropeTC);
      ropeTex.wrapS = THREE.RepeatWrapping;
      ropeTex.wrapT = THREE.RepeatWrapping;
      ropeTex.repeat.set(2, 2);

      const ropeInstGeo = new THREE.CylinderGeometry(0.12, 0.12, 1, 8, 1);
      const ropeInstMat = new THREE.MeshLambertMaterial({ map: ropeTex });
      ropeLine = new THREE.InstancedMesh(ropeInstGeo, ropeInstMat, RSEGS - 1);
      ropeLine.userData.posArr = ropePosArr;
      ropeLine.userData.segs   = RSEGS;
      updateRopeInstances(ropeLine);
      ropeGroup.add(ropeLine);

      ropeHandGroup = buildHandGroup();
      ropeHandGroup.position.set(RX0, RY, RZ);
      ropeGroup.add(ropeHandGroup);

      // ロープ全体の透明ヒットボックス（波の振れ幅±2.5 をカバー）
      ropeHitbox = new THREE.Mesh(new THREE.BoxGeometry(RX1 - RX0, 5.0, 0.5), _hitboxMat);
      ropeHitbox.position.set((RX0 + RX1) / 2, RY, RZ);
      ropeGroup.add(ropeHitbox);

      // 手イラストの透明ヒットボックス（PlaneGeometry、手のアニメに追従）
      ropeHandHitbox = new THREE.Mesh(new THREE.PlaneGeometry(3.6, 2.7), _hitboxMat);
      ropeHandHitbox.position.set(-1.008, 0.135, 0);
      ropeHandGroup.add(ropeHandHitbox);

      document.getElementById('toolRopeHand').classList.add('active');
      document.getElementById('ropeSubBtns').style.maxHeight = '60px';
    });

    // ===== ロープ→球 =====
    document.getElementById('ropeToSphere')?.addEventListener('click', () => {
      if (!ropeGroup) return;
      if (ropeParticles.length) {
        ropeParticles.forEach(s => ropeGroup.remove(s));
        ropeParticles = [];
        if (ropeLine) ropeLine.visible = true;
        document.getElementById('ropeToSphere').classList.remove('active');
        return;
      }
      const RX0 = 0, RX1 = 20, RY = 5;
      const mat = makeShadedSphereMaterial(0x44bbff);
      for (let x = RX0; x <= RX1; x += 0.5) {
        const sphere = new THREE.Mesh(new THREE.SphereGeometry(0.22, 16, 12), mat);
        sphere.position.set(x, RY, 0);
        sphere.userData.x = x;
        ropeGroup.add(sphere);
        ropeParticles.push(sphere);
      }
      if (ropeLine) ropeLine.visible = false;
      document.getElementById('ropeToSphere').classList.add('active');
    });

    // ===== y-t グラフ（3D曲線）=====
    // X=-10 固定、Z=-10 スタート、+Z方向に伸びる
    // Y = 変位（地面 Y=0 が基準）
    const YT_X         = -10;
    const YT_Z_START   = -10;
    const YT_Z_END     = 10;     // この Z 座標に達したら停止
    const YT_SAMPLE_DT = 1 / 60;
    const YT_MAX_PTS   = 7200;
    let   ytZScale     = 1.0;    // 開始時に計算 (= 10 / T → 2波長が20ユニットに収まる)

    let ytLine        = null;
    let ytGeo         = null;
    let ytPositions   = null;    // Float32Array
    let ytData        = [];
    let ytLastSampleT = -Infinity;

    function ensureYtGraph() {
      if (ytLine) return;
      ytPositions = new Float32Array(YT_MAX_PTS * 3);
      ytGeo = new THREE.BufferGeometry();
      ytGeo.setAttribute('position', new THREE.BufferAttribute(ytPositions, 3));
      ytGeo.setDrawRange(0, 0);
      const mat = new THREE.LineBasicMaterial({ color: 0x64dc46 });
      ytLine = new THREE.Line(ytGeo, mat);
      scene.add(ytLine);
    }

    function resetYtGraph(T) {
      // 2波長が Z=-10〜10（20ユニット）に収まるよう倍率を計算
      ytZScale = (YT_Z_END - YT_Z_START) / (2 * Math.max(T, 0.01));
      ytData = [];
      ytLastSampleT = -Infinity;
      ensureYtGraph();
      ytPositions.fill(0);
      ytGeo.setDrawRange(0, 0);
      ytGeo.attributes.position.needsUpdate = true;
      resetYtFill();
    }

    // ===== y-t グラフ 塗りつぶし（地面と曲線が囲む面）=====
    const YT_FILL_MAX_IDX = (YT_MAX_PTS - 1) * 6;

    let ytFillMesh      = null;
    let ytFillGeo       = null;
    let ytFillPositions = null;
    let ytFillIdxArr    = null;
    let ytFillIdxCount  = 0;

    function ensureYtFill() {
      if (ytFillMesh) return;
      ytFillPositions = new Float32Array(YT_MAX_PTS * 2 * 3);
      ytFillIdxArr    = new Uint32Array(YT_FILL_MAX_IDX);
      ytFillGeo = new THREE.BufferGeometry();
      ytFillGeo.setAttribute('position', new THREE.BufferAttribute(ytFillPositions, 3));
      ytFillGeo.setIndex(new THREE.BufferAttribute(ytFillIdxArr, 1));
      ytFillGeo.setDrawRange(0, 0);
      const mat = new THREE.MeshBasicMaterial({
        color: 0x64dc46,
        opacity: 0.28,
        transparent: true,
        side: THREE.DoubleSide,
        depthWrite: false
      });
      ytFillMesh = new THREE.Mesh(ytFillGeo, mat);
      scene.add(ytFillMesh);
    }

    function resetYtFill() {
      ytFillIdxCount = 0;
      ensureYtFill();
      ytFillPositions.fill(0);
      ytFillGeo.setDrawRange(0, 0);
      ytFillGeo.attributes.position.needsUpdate = true;
      ytFillGeo.index.needsUpdate = true;
    }

    // ===== y-x グラフ（3D曲線）=====
    // X=-10〜10、Z=10 固定、Y = 変位
    // 2波長が X=-10〜10（20ユニット）に収まるよう v_world = 10/T
    const YX_X_START  = -10;
    const YX_X_END    =  10;
    const YX_Z        =  10;
    const YX_N_POINTS = 400;

    let yxLine      = null;
    let yxGeo       = null;
    let yxPositions = null;
    let yxFillMesh      = null;
    let yxFillGeo       = null;
    let yxFillPositions = null;

    // y-x 系グラフ共通: 曲線と地面(y=0)を結ぶ塗りつぶしメッシュを生成
    function buildYxFill(nPoints, zVal) {
      const positions = new Float32Array(nPoints * 2 * 3);
      for (let i = 0; i < nPoints; i++) {
        const x = YX_X_START + (YX_X_END - YX_X_START) * i / (nPoints - 1);
        positions[(2*i)*3+0]   = x; positions[(2*i)*3+1]   = 0; positions[(2*i)*3+2]   = zVal;
        positions[(2*i+1)*3+0] = x; positions[(2*i+1)*3+1] = 0; positions[(2*i+1)*3+2] = zVal;
      }
      const idx = new Uint32Array((nPoints - 1) * 6);
      let ii = 0;
      for (let i = 0; i < nPoints - 1; i++) {
        idx[ii++] = 2*i; idx[ii++] = 2*i+1; idx[ii++] = 2*i+3;
        idx[ii++] = 2*i; idx[ii++] = 2*i+3; idx[ii++] = 2*i+2;
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geo.setIndex(new THREE.BufferAttribute(idx, 1));
      const mat = new THREE.MeshBasicMaterial({
        color: 0xBE461E, opacity: 0.28, transparent: true,
        side: THREE.DoubleSide, depthWrite: false
      });
      const mesh = new THREE.Mesh(geo, mat);
      scene.add(mesh);
      return { geo, positions, mesh };
    }

    function ensureYxGraph() {
      if (yxLine) return;
      yxPositions = new Float32Array(YX_N_POINTS * 3);
      for (let i = 0; i < YX_N_POINTS; i++) {
        yxPositions[i*3]   = YX_X_START + (YX_X_END - YX_X_START) * i / (YX_N_POINTS - 1);
        yxPositions[i*3+1] = 0;
        yxPositions[i*3+2] = YX_Z;
      }
      yxGeo = new THREE.BufferGeometry();
      yxGeo.setAttribute('position', new THREE.BufferAttribute(yxPositions, 3));
      yxGeo.setDrawRange(0, YX_N_POINTS);
      const mat = new THREE.LineBasicMaterial({ color: 0xBE461E });
      yxLine = new THREE.Line(yxGeo, mat);
      scene.add(yxLine);
      const _f = buildYxFill(YX_N_POINTS, YX_Z);
      yxFillMesh = _f.mesh; yxFillGeo = _f.geo; yxFillPositions = _f.positions;
    }

    function resetYxGraph() {
      ensureYxGraph();
      for (let i = 0; i < YX_N_POINTS; i++) {
        yxPositions[i*3+1] = 0;
        yxFillPositions[(2*i)*3+1] = 0;
      }
      yxGeo.attributes.position.needsUpdate = true;
      yxFillGeo.attributes.position.needsUpdate = true;
    }

    // ===== y-x グラフ（λ/4ずつシフト、Z=7.5〜Z=-7.5）=====
    // Z座標が2.5減るごとに遅延をT/4追加し、波形が-X方向にλ/4ずつシフトして見える
    const YX_SHIFT_Z_LIST  = [7.5, 5.0, 2.5, 0.0, -2.5, -5.0, -7.5];
    const YX_SHIFT_N_POINTS = 400;

    let yxShiftedLines    = [];
    let yxShiftedGeos     = [];
    let yxShiftedPos      = [];
    let yxShiftedFillGeos = [];
    let yxShiftedFillPos  = [];

    function ensureYxShiftedGraphs() {
      if (yxShiftedLines.length > 0) return;
      for (let g = 0; g < YX_SHIFT_Z_LIST.length; g++) {
        const positions = new Float32Array(YX_SHIFT_N_POINTS * 3);
        for (let i = 0; i < YX_SHIFT_N_POINTS; i++) {
          positions[i*3]   = YX_X_START + (YX_X_END - YX_X_START) * i / (YX_SHIFT_N_POINTS - 1);
          positions[i*3+1] = 0;
          positions[i*3+2] = YX_SHIFT_Z_LIST[g];
        }
        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geo.setDrawRange(0, YX_SHIFT_N_POINTS);
        const mat = new THREE.LineBasicMaterial({ color: 0xBE461E });
        const line = new THREE.Line(geo, mat);
        scene.add(line);
        yxShiftedLines.push(line);
        yxShiftedGeos.push(geo);
        yxShiftedPos.push(positions);
        const _f = buildYxFill(YX_SHIFT_N_POINTS, YX_SHIFT_Z_LIST[g]);
        yxShiftedFillGeos.push(_f.geo);
        yxShiftedFillPos.push(_f.positions);
      }
    }

    function resetYxShiftedGraphs() {
      ensureYxShiftedGraphs();
      for (let g = 0; g < yxShiftedLines.length; g++) {
        for (let i = 0; i < YX_SHIFT_N_POINTS; i++) {
          yxShiftedPos[g][i*3+1] = 0;
          yxShiftedFillPos[g][(2*i)*3+1] = 0;
        }
        yxShiftedGeos[g].attributes.position.needsUpdate = true;
        yxShiftedFillGeos[g].attributes.position.needsUpdate = true;
      }
    }

    // ===== XY平面ドラッグ =====
    const _dragRaycaster = new THREE.Raycaster();
    const _dragPlane     = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
    let   _dragGroup     = null;
    const _dragOffset    = new THREE.Vector3();
    const _dragHitPt     = new THREE.Vector3();

    function _toNDC(e) {
      const rect = renderer.domElement.getBoundingClientRect();
      return new THREE.Vector2(
        ((e.clientX - rect.left) / rect.width)  * 2 - 1,
        -((e.clientY - rect.top)  / rect.height) * 2 + 1
      );
    }

    renderer.domElement.addEventListener('pointerdown', (e) => {
      _dragRaycaster.setFromCamera(_toNDC(e), camera);

      // 球とばね
      const sTargets = [springBall, springCeil, springMesh, springHitbox].filter(Boolean);
      if (sTargets.length) {
        const hits = _dragRaycaster.intersectObjects(sTargets);
        if (hits.length) {
          _dragGroup = springGroup;
          _dragRaycaster.ray.intersectPlane(_dragPlane, _dragHitPt);
          _dragOffset.copy(springGroup.position).sub(_dragHitPt);
          controls.enabled = false;
          return;
        }
      }

      // ロープと手
      const rTargets = [ropeLine, ropeHitbox, ropeHandHitbox].filter(Boolean);
      if (rTargets.length) {
        const hits = _dragRaycaster.intersectObjects(rTargets);
        if (hits.length) {
          _dragGroup = ropeGroup;
          _dragRaycaster.ray.intersectPlane(_dragPlane, _dragHitPt);
          _dragOffset.copy(ropeGroup.position).sub(_dragHitPt);
          controls.enabled = false;
        }
      }
    });

    renderer.domElement.addEventListener('pointermove', (e) => {
      if (!_dragGroup) return;
      _dragRaycaster.setFromCamera(_toNDC(e), camera);
      if (_dragRaycaster.ray.intersectPlane(_dragPlane, _dragHitPt)) {
        _dragGroup.position.x = _dragHitPt.x + _dragOffset.x;
        _dragGroup.position.y = _dragHitPt.y + _dragOffset.y;
      }
    });

    renderer.domElement.addEventListener('pointerup', () => {
      if (_dragGroup) { _dragGroup = null; controls.enabled = true; }
    });

    // ===== 道具箱 開閉 =====
    const toolboxPanel  = document.getElementById('toolboxPanel');
    const toolboxToggle = document.getElementById('toolboxToggle');
    toolboxToggle?.addEventListener('click', () => {
      const collapsed = toolboxPanel.classList.toggle('is-collapsed');
      toolboxToggle.textContent = collapsed ? '＜' : '＞';
      toolboxToggle.setAttribute('aria-expanded', String(!collapsed));
    });

    // ===== メインループ =====
    function tick(){
      requestAnimationFrame(tick);
      controls.update();

      const t = nowSec();

      // 球とばねの更新（単振動）
      if (springBall && springMesh && circ.active) {
        const dy = circ.r * Math.sin(circ.startTheta + (Math.PI * 2 / circ.T) * (circ.frozenElapsed + (t - circ.startTime)));
        springBall.position.y = 5 + dy;
        const baseLen = 3.6;
        const s = Math.max(0.01, (baseLen - dy) / baseLen);
        springMesh.scale.y = s;
        springMesh.position.y = 8.6 * (1 - s);
      }

      // ロープと手の更新（横波）
      if (ropeLine && circ.active) {
        const RX0 = 0, RX1 = 20, RY = 5, RZ = 0;
        const elapsed = circ.frozenElapsed + (t - circ.startTime);
        const omega   = Math.PI * 2 / circ.T;
        const waveSpeed = (RX1 - RX0) / (2 * circ.T); // y-xグラフに合わせて2波長が収まる速度
        const pos = ropeLine.userData.posArr;
        const n   = ropeLine.userData.segs;
        for (let i = 0; i < n; i++) {
          const x     = RX0 + (RX1 - RX0) * i / (n - 1);
          const delay = (x - RX0) / waveSpeed;
          const y     = elapsed >= delay
            ? RY + circ.r * Math.sin(circ.startTheta + omega * (elapsed - delay))
            : RY;
          pos[i*3] = x; pos[i*3+1] = y; pos[i*3+2] = RZ;
        }
        updateRopeInstances(ropeLine);
        if (ropeHandGroup) {
          ropeHandGroup.position.y = RY + circ.r * Math.sin(circ.startTheta + omega * elapsed);
        }

        // 媒質の球を同じ波の式で更新
        if (ropeParticles.length) {
          for (const s of ropeParticles) {
            const delay = s.userData.x / waveSpeed;
            s.position.y = elapsed >= delay
              ? RY + circ.r * Math.sin(circ.startTheta + omega * (elapsed - delay))
              : RY;
          }
        }
      }

      // y-x グラフの更新（y-t グラフが動いている間だけ更新）
      if (yxLine && circ.active) {
        const elapsed  = circ.frozenElapsed + (t - circ.startTime);
        const zPos     = YT_Z_START + elapsed * ytZScale;
        if (zPos < YT_Z_END) {
          const omega   = Math.PI * 2 / circ.T;
          const v_world = (YX_X_END - YX_X_START) / (2 * circ.T);
          for (let i = 0; i < YX_N_POINTS; i++) {
            const worldX  = YX_X_START + (YX_X_END - YX_X_START) * i / (YX_N_POINTS - 1);
            const delay   = (worldX - YX_X_START) / v_world;
            const waveAge = elapsed - delay;
            yxPositions[i*3+1] = waveAge >= 0 ? circ.r * Math.sin(omega * waveAge) : 0;
            if (yxFillPositions) yxFillPositions[(2*i)*3+1] = yxPositions[i*3+1];
          }
          yxGeo.attributes.position.needsUpdate = true;
          if (yxFillGeo) yxFillGeo.attributes.position.needsUpdate = true;
        }
      }

      // y-t グラフの更新（3D曲線を +Z方向に伸ばす）
      if (ytLine && circ.active) {
        const elapsed = circ.frozenElapsed + (t - circ.startTime);
        const zPos = YT_Z_START + elapsed * ytZScale;
        if (zPos < YT_Z_END && elapsed - ytLastSampleT >= YT_SAMPLE_DT && ytData.length < YT_MAX_PTS) {
          const dy = circ.r * Math.sin(circ.startTheta + (Math.PI * 2 / circ.T) * elapsed);
          const idx = ytData.length;
          ytPositions[idx * 3 + 0] = YT_X;
          ytPositions[idx * 3 + 1] = dy;
          ytPositions[idx * 3 + 2] = zPos;
          ytData.push(1);
          ytGeo.setDrawRange(0, ytData.length);
          ytGeo.attributes.position.needsUpdate = true;
          ytLastSampleT = elapsed;
          // 塗りつぶしメッシュ更新
          if (ytFillMesh) {
            const n = idx; // 今追加した点の 0-based インデックス
            ytFillPositions[(2*n)*3+0]   = YT_X; ytFillPositions[(2*n)*3+1]   = dy;  ytFillPositions[(2*n)*3+2]   = zPos;
            ytFillPositions[(2*n+1)*3+0] = YT_X; ytFillPositions[(2*n+1)*3+1] = 0;   ytFillPositions[(2*n+1)*3+2] = zPos;
            if (n >= 1) {
              ytFillIdxArr[ytFillIdxCount++] = 2*(n-1);   ytFillIdxArr[ytFillIdxCount++] = 2*(n-1)+1; ytFillIdxArr[ytFillIdxCount++] = 2*n+1;
              ytFillIdxArr[ytFillIdxCount++] = 2*(n-1);   ytFillIdxArr[ytFillIdxCount++] = 2*n+1;     ytFillIdxArr[ytFillIdxCount++] = 2*n;
            }
            ytFillGeo.setDrawRange(0, ytFillIdxCount);
            ytFillGeo.attributes.position.needsUpdate = true;
            ytFillGeo.index.needsUpdate = true;
          }
        }
      }

      // y-x グラフ（λ/4ずつシフト）更新：Z段ごとにT/4遅延を追加
      if (yxShiftedLines.length > 0 && circ.active) {
        const elapsed  = circ.frozenElapsed + (t - circ.startTime);
        const zPos     = YT_Z_START + elapsed * ytZScale;
        if (zPos < YT_Z_END) {
          const omega   = Math.PI * 2 / circ.T;
          const v_world = (YX_X_END - YX_X_START) / (2 * circ.T);
          for (let g = 0; g < YX_SHIFT_Z_LIST.length; g++) {
            const extraDelay = (g + 1) * circ.T / 4;
            const positions  = yxShiftedPos[g];
            const fp = yxShiftedFillPos[g];
            for (let i = 0; i < YX_SHIFT_N_POINTS; i++) {
              const worldX  = YX_X_START + (YX_X_END - YX_X_START) * i / (YX_SHIFT_N_POINTS - 1);
              const delay   = (worldX - YX_X_START) / v_world + extraDelay;
              const waveAge = elapsed - delay;
              positions[i*3+1] = waveAge > 0 ? circ.r * Math.sin(omega * waveAge) : 0;
              if (fp) fp[(2*i)*3+1] = positions[i*3+1];
            }
            yxShiftedGeos[g].attributes.position.needsUpdate = true;
            if (yxShiftedFillGeos[g]) yxShiftedFillGeos[g].attributes.position.needsUpdate = true;
          }
        }
      }

      renderer.render(scene, camera);
    }
    tick();
  </script>
</body>
</html>
