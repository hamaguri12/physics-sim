  <style>
    :root{
      --bg:#ffffff;

    #app{position:fixed;inset:0;overflow:hidden}

    canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

    .topbar{
      position:absolute;left:0;top:0;right:0;z-index:5;
      display:flex;gap:8px;align-items:center;
      padding:10px 12px;
      background:linear-gradient(to bottom, rgba(255,255,255,.80), rgba(255,255,255,0));
      pointer-events:none;
    }
    .topbar a, .topbar button, .topbar .pill{pointer-events:auto}
    .btn, .pill{
      border:1px solid var(--border);
      background:var(--panel);

      cursor:pointer;

      align-items:center;

    }
    .btn:hover{opacity:.9}
    .pill{cursor:default;color:var(--muted)}
    .btn.active{ outline:2px solid rgba(120,170,255,.6); }

    .sidebar{
      position:absolute;left:10px;top:56px;bottom:10px;z-index:6;
      width:280px;max-width:85vw;
      background:var(--panel);
      border:1px solid var(--border);
      border-radius:16px;

    .group{margin:10px 0 12px}
    .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
    .row .btn{flex:1;justify-content:center}
    .note{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.45}

    #toolboxPanel{
      position: fixed;

    #toolboxPanel.is-collapsed{

    #toolboxToggle.toolboxToggle{
      position: absolute;
      top: 10px;
      right: 10px;

      border: 1px solid rgba(70,90,160,0.25);
      background: rgba(240,243,252,0.90);
      color: #1a2040;
      cursor: pointer;
      display: grid;
      place-items: center;

    #toolboxPanel.is-collapsed #toolboxToggle{

    #toolboxPanel{
      overflow: hidden auto;              /* 中身が画面より長いときは縦にスクロール（横は出さない） */
      overscroll-behavior: contain;
    }
    #toolboxPanel.is-collapsed > :not(#toolboxToggle){
      display: none !important;
    }

    .help{
      position:absolute;right:10px;bottom:10px;z-index:6;
      background:rgba(240,243,252,0.92);
      border:1px solid rgba(70,90,160,0.20);
      border-radius:14px;
      padding:10px 12px;
      font-size:12px;
      color:var(--muted);
      max-width:420px;
    }
    .help b{color:var(--text)}
  /* 画面の文字は選ばせない。つまみなどを速く連打すると近くの文字が選ばれ、その選んだ文字の上を
     押して動かすとブラウザが「文字の引きずり」を始め、禁止のしるし（🚫）が出たまま操作を
     横取りされる（CLAUDE.md §8-21）。入力欄の中だけは選べるままにしておく */
  #app{user-select:none}
  #app input,#app textarea,#app select{user-select:auto}
  </style>
  <script type="importmap">

<body>
  <div id="app">

    <div id="particleContextMenu" style="display:none;position:fixed;z-index:600;background:rgba(240,243,252,0.97);border:1px solid rgba(70,90,160,0.30);border-radius:10px;box-shadow:0 4px 14px rgba(20,30,60,0.18);padding:4px;">
      <button id="particleDeleteBtn" type="button" style="display:flex;align-items:center;gap:7px;border:none;background:none;padding:8px 16px;border-radius:7px;cursor:pointer;font-size:13px;color:#1a2040;white-space:nowrap">

    <!-- 上バー -->
    <div class="topbar">

      <!-- 図形（描画ボードはカメラ直下） -->

      <div class="group" style="margin-top:0">
        <div class="row">
          <button class="btn" id="toolPen" type="button">ペン</button>

        </div>

    <div class="help">
      <b>操作</b>：ドラッグ＝平行移動／ホイール＝ズーム／板は左右に引きずる・右クリックで削除
    </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // =====================================================================
    //  物質と電場（2026-09-29 に作り直し）
    //  一様な電場（左 → 右）の中に導体・不導体の板を置き、
    //   ・導体：自由電子が電場と逆向きに動いて左の面に集まり、中の電場が打ち消されて 0 になる（静電誘導）
    //   ・不導体：分子の向きがそろって表面に分極電荷が現れ、中の電場は弱まるが 0 にはならない（誘電分極）
    //  を中身の動きで見せ、その真下に「電場の強さ」「電位」のグラフを、横軸の位置を絵とそろえて描く。
    //  前の版（回路と極板で電場を作っていた）は dev\oldbuild\matter-electric-field.before_rebuild_20260929.html。
    //  教科書の図は 数研 総合物理 2 の図 22（導体）・図 26（不導体）。番号は画面に出さない（CLAUDE.md §8-20）
    // =====================================================================

    // ===== 基本セットアップ =====
    const canvas = document.getElementById('c');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(2, window.devicePixelRatio));

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xffffff);

    // 真上からの平行投影に固定する（画面右 ＝ ＋X、画面下 ＝ ＋Z）
    const camera = new THREE.OrthographicCamera(-38, 38, 38, -38, 0.1, 1000);
    camera.position.set(0, 100, 0);
    camera.up.set(0, 0, -1);
    camera.lookAt(0, 0, 0);
    scene.add(camera); // カメラ子要素（描画ボード）をシーングラフに含めるために必要

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.target.set(0, 0, 0);
    controls.zoomToCursor = true;
    controls.enableRotate = false;   // 真上固定なので回転させない
    controls.mouseButtons = { LEFT: THREE.MOUSE.PAN, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.PAN };
    controls.update();

    scene.add(new THREE.AmbientLight(0xffffff, 1.0));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.70);
    dirLight.position.set(6, 10, 6);
    scene.add(dirLight);

    // ===== 舞台の寸法（世界の単位。1 ＝ グリッド 1 マス相当）=====
    // 一様な電場の帯：X ∈ [XMIN, XMAX]、線は板の長さ（COND_W）の中に等間隔。帯の中心 Z ＝ ZC
    // グラフは絵の真下：電場の横軸が Z ＝ ZE、電位の横軸が Z ＝ ZV、高さ GH（上向き＝ −Z）
    const XMIN = -24, XMAX = 24, ZC = -14;
    const ZE = 12, ZV = 26, GH = 9;
    const EMAX = 5;            // つまみの最大
    const E0 = 3;              // 電気力線 5 本・ドリフトの基準になる強さ（前の版の 3 V と同じ比）
    let fieldE = 2;            // 外部の電場の強さ（つまみ）。既定は 2（2026-09-29 本人「E ＝ 2 をデフォルトに」。前は 0 から始めていた）
    // 0 なら電場が無いので線もマークも 0 本
    const lineCount = () => Math.round(5 * fieldE / E0);
    const _inField = () => fieldE > 0;   // 帯は画面いっぱいなので、板はいつも電場の中。電場があるかだけを見る

    // ===== 道具箱 開閉 =====
    const toolboxPanel  = document.getElementById('toolboxPanel');
    const toolboxToggle = document.getElementById('toolboxToggle');
    toolboxToggle.addEventListener('click', () => {
      const collapsed = toolboxPanel.classList.toggle('is-collapsed');
      toolboxToggle.textContent = collapsed ? '＞' : '＜';
      toolboxToggle.setAttribute('aria-expanded', String(!collapsed));
    });

    // ===== 道具箱ドラッグ：状態 =====
    let tbDrag = { pending: false, active: false, type: null, mesh: null,
                   pendingX: 0, pendingY: 0, isPickedParticle: false,
                   pickStartCX: 0, pickStartCY: 0, lastCX: 0, lastCY: 0, grabOffX: 0 };
    const placedParticles = [];   // 置いた板 { mesh, type }
    window._placedParticles = placedParticles;

    // ===== ホバー =====
    let hoveredParticle = null;
    function setHoveredParticle(p) { hoveredParticle = p; }

    // ===== レイキャスト =====
    const _tbPlane     = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0); // Y=0（XZ平面）
    const _tbRaycaster = new THREE.Raycaster();
    const _tbNDC       = new THREE.Vector2();
    const _tbHit       = new THREE.Vector3();

    function _tbProject(cx, cy) {
      _tbNDC.set((cx / window.innerWidth) * 2 - 1, -(cy / window.innerHeight) * 2 + 1);
      _tbRaycaster.setFromCamera(_tbNDC, camera);
      return _tbRaycaster.ray.intersectPlane(_tbPlane, _tbHit) ? _tbHit.clone() : null;
    }
    // 導体・不導体はどちらも板状で、掴み方も同じ扱いにする
    const _isSlabType = t => t === 'conductor' || t === 'insulator';

    function checkHoverPlacedParticle(cx, cy) {
      if (window._getDrawingToolActive?.()) return null;
      if (!placedParticles.length) return null;
      _tbNDC.set((cx / window.innerWidth) * 2 - 1, -(cy / window.innerHeight) * 2 + 1);
      _tbRaycaster.setFromCamera(_tbNDC, camera);
      let best = null, bestDist = Infinity;
      for (const p of placedParticles) {
        const hits = _tbRaycaster.intersectObject(p.mesh, false);   // 板の面との交差で判定
        if (hits.length && hits[0].distance < bestDist) { bestDist = hits[0].distance; best = p; }
      }
      return best;
    }
    function tryPickPlacedParticle(cx, cy) {
      const best = checkHoverPlacedParticle(cx, cy);
      if (!best) return false;
      const idx = placedParticles.indexOf(best);
      if (idx !== -1) placedParticles.splice(idx, 1);
      tbDrag.active = true; tbDrag.pending = false;
      tbDrag.type = best.type; tbDrag.mesh = best.mesh;
      tbDrag.isPickedParticle = true;
      // 板は面積が広いので、掴んだ点との位置関係（X）を保ったまま動かす
      tbDrag.grabOffX = 0;
      const hit = _tbProject(cx, cy);
      if (hit) tbDrag.grabOffX = best.mesh.position.x - hit.x;
      tbDrag.pickStartCX = cx; tbDrag.pickStartCY = cy;
      tbDrag.lastCX = cx; tbDrag.lastCY = cy;
      controls.enabled = false;
      renderer.domElement.style.cursor = 'grabbing';
      return true;
    }

    // 矢じり（「く」の字）を1枚の多角形として作る。
    // 羽根2本を別々の矩形で描くと先端に切れ目が出るため、
    // 先端を留め継ぎ（miter）して繋いだ形状にしている。
    //   x, zt : 先端の座標 ／ a : 羽根の半幅 ／ hb : 羽根が伸びるZ方向の量
    //   w     : 線の太さ   ／ y : 高さ
    function makeChevronGeometry(x, zt, a, hb, w, y) {
      const m = Math.hypot(a, hb);
      const sgn = Math.sign(hb) || 1;
      const miter = (w / 2) * m / a;          // 先端が伸びる量
      const onx =  Math.abs(hb) / m * (w / 2);
      const onz = -sgn * a / m * (w / 2);
      const apexOut = [x, zt - sgn * miter];
      const apexIn  = [x, zt + sgn * miter];
      const rx = x + a, lx = x - a, ez = zt + hb;
      const rOut = [rx + onx, ez + onz], rIn = [rx - onx, ez - onz];
      const lOut = [lx - onx, ez + onz], lIn = [lx + onx, ez - onz];
      const P = [];
      const push = (p) => P.push(p[0], y, p[1]);
      // 左の羽根
      push(apexOut); push(lOut); push(lIn);
      push(apexOut); push(lIn);  push(apexIn);
      // 右の羽根
      push(apexOut); push(apexIn); push(rIn);
      push(apexOut); push(rIn);   push(rOut);
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(P, 3));
      return g;
    }
    // ＋X 向き（右向き）の く の字。Z 向きに作ってから −90° 回す（ローカル +Z → 世界 −X：羽根が左、先端が右）
    function makeChevronGeometryRight(xTip, z, a, hb, w, y) {
      return makeChevronGeometry(0, 0, a, hb, w, y).rotateY(-Math.PI / 2).translate(xTip, 0, z);
    }

    // ===== 文字（スプライト）=====
    // 板をドラッグするとグラフが何度も作り直されるため、文字のテクスチャは内容ごとに使い回す（canvas 生成が重い）
    const YU = '"Yu Gothic","Meiryo",sans-serif';
    const _texCache = new Map();
    function makeTextSprite(text, h, opt = {}) {
      const { color = '#000', italic = false, bold = false, bg = null, border = null,
              family = '"Times New Roman", serif' } = opt;
      const key = `${text}|${color}|${italic}|${bold}|${bg}|${border}|${family}`;
      let cached = _texCache.get(key);
      if (!cached) {
        const size = 64, lines = String(text).split('\n');
        const font = `${italic ? 'italic ' : ''}${bold ? 'bold ' : ''}${size}px ${family}`;
        const meas = document.createElement('canvas').getContext('2d');
        meas.font = font;
        const wMax = Math.max(...lines.map(s => meas.measureText(s).width));
        const pad = Math.round(size * (bg ? 0.5 : 0.25));
        const lh = Math.round(size * 1.3);
        const c = document.createElement('canvas');
        c.width  = Math.ceil(wMax) + pad * 2;
        c.height = lh * lines.length + Math.round(size * (bg ? 0.55 : 0.15));
        const g = c.getContext('2d');
        if (bg) {
          g.fillStyle = bg;
          g.beginPath(); g.roundRect(2, 2, c.width - 4, c.height - 4, c.height * 0.22); g.fill();
          if (border) { g.strokeStyle = border; g.lineWidth = 3; g.stroke(); }
        }
        g.font = font; g.fillStyle = color;
        g.textAlign = 'center'; g.textBaseline = 'middle';
        lines.forEach((s, i) => g.fillText(s, c.width / 2, c.height / 2 + (i - (lines.length - 1) / 2) * lh));
        const t = new THREE.CanvasTexture(c);
        t.colorSpace = THREE.SRGBColorSpace;
        cached = { tex: t, aspect: c.width / c.height };
        _texCache.set(key, cached);
      }
      const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: cached.tex, transparent: true, depthTest: false }));
      sp.scale.set(h * cached.aspect, h, 1);
      return sp;
    }
    // グループの中身を捨てる（スプライトのジオメトリは three.js が共有しているので触らない。map は使い回すので捨てない）
    function _clear(grp) {
      for (const o of grp.children) {
        if (o.isSprite) o.material.dispose();
        else if (o.geometry) o.geometry.dispose();
      }
      grp.clear();
    }

    // ===== 導体（「静電気力」シミュから移植。板ローカル：長辺＝X 20.2・短辺＝Z 6）=====
    // 板は mesh.rotation.y ＝ +π/2 で回して縦長に置く（ローカル +Z → 世界 +X、ローカル +X → 世界 −Z）。
    // 電子はローカル −Z へドリフトするので、世界では左（−X）＝電場と逆向きへ動く。− の面は世界の左の面、＋ は右の面
    // 厚さ COND_D は 6 → 16（2026-09-29 本人「不導体と導体の電位のグラフの差が分かりにくい。教科書ぐらいはっきり」）。
    // 差は板の中の区間だけ（傾き 0 と 0.4E）なので、電場の幅 48 に対して板が 6 だと右端の差が 5 %。16（幅の 1/3。教科書の図の比率）で 17 %
    const COND_W = 20.2, COND_D = 16, COND_T = 0.3;
    const COND_CHARGE_R = 0.35;
    const COND_EL_R     = COND_CHARGE_R * 0.5;
    const _cMinPE = COND_CHARGE_R * 1.5;   // 陽子＋電子の最接近距離
    const _cMinEE = COND_CHARGE_R;         // 電子どうしの最接近距離
    // 電子が動ける範囲＝板の縁から電子の半径だけ内側（縁まで届く）
    const COND_BX = COND_W / 2 - COND_EL_R;
    const COND_BZ = COND_D / 2 - COND_EL_R;
    // 陽子の格子。間隔2ユニットのまま板の長さいっぱいに並べる（短辺は厚さに合わせて 2 きざみ、面から 1.5 内側から：厚さ 16 なら ±6.5 の 7 行）。
    // 面から 1.5 空けるのは、集まる電子の帯（COND_TOP_BAND 0.9）に外の陽子の行がかかると、電子が入りきらずに「集まりきった」判定に届かないため（厚さ 16 で 80 個のとき）
    const COND_ZS = [];
    for (let z = -(COND_D / 2 - 1.5); z <= COND_D / 2 - 1.5 + 1e-9; z += 2) COND_ZS.push(z);
    const COND_XS = [];
    for (let x = -(COND_W / 2 - 1.1); x <= COND_W / 2 - 1.1; x += 2) COND_XS.push(x);
    const _condProtonPos = [];
    for (const x of COND_XS) for (const z of COND_ZS) _condProtonPos.push({ x, z });
    const SLAB_ROT_Y = Math.PI / 2;

    // 金属板の質感。グラデーションのテクスチャで光沢を出す（スチール調）
    const conductorMat = (function () {
      const c = document.createElement('canvas');
      c.width = 8; c.height = 64;
      const g = c.getContext('2d');
      const grad = g.createLinearGradient(0, 0, 0, 64);
      grad.addColorStop(0.00, '#5b636f');
      grad.addColorStop(0.15, '#b7bfca');
      grad.addColorStop(0.44, '#8a929e');
      grad.addColorStop(0.60, '#7a828e');
      grad.addColorStop(0.85, '#a6aeb9');
      grad.addColorStop(1.00, '#565e69');
      g.fillStyle = grad;
      g.fillRect(0, 0, 8, 64);
      const t = new THREE.CanvasTexture(c);
      t.colorSpace = THREE.SRGBColorSpace;
      return new THREE.MeshBasicMaterial({ map: t });
    })();

    // 球の表面に直接記号を描くシェーダー（別メッシュにすると浮いて見えるため）
    function _condMarkMaterial(hexColor, halfLen, halfWid, withVertical) {
      const AL = halfLen.toFixed(6), AW = halfWid.toFixed(6);
      return new THREE.ShaderMaterial({
        uniforms: { baseColor: { value: new THREE.Color(hexColor) } },
        vertexShader: `
          varying vec3 vNormalView;
          varying vec3 vLocalPos;
          void main() {
            vNormalView = normalize(normalMatrix * normal);
            vLocalPos   = position;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          uniform vec3 baseColor;
          varying vec3 vNormalView;
          varying vec3 vLocalPos;
          void main() {
            vec3 N = normalize(vNormalView);
            vec3 V = vec3(0.0, 0.0, 1.0);
            float ndotv = max(dot(N, V), 0.0);
            float shade = pow(ndotv, 0.55);
            vec3 dark   = baseColor * 0.85;
            vec3 bright = mix(baseColor, vec3(1.0), 0.12);
            vec3 color  = mix(dark, bright, shade);
            vec3 L = normalize(vec3(-0.55, 0.65, 0.55));
            vec3 H = normalize(L + V);
            float spec = pow(max(dot(N, H), 0.0), 32.0);
            color += vec3(1.0) * spec * 0.85;
            float fresnel = pow(1.0 - ndotv, 3.0);
            color += baseColor * fresnel * 0.3;
            if (vLocalPos.y > 0.0) {
              float al = ${AL};
              float aw = ${AW};
              bool mark = (abs(vLocalPos.x) < al && abs(vLocalPos.z) < aw)
                ${withVertical ? '|| (abs(vLocalPos.z) < al && abs(vLocalPos.x) < aw)' : ''};
              if (mark) color = vec3(1.0);
            }
            gl_FragColor = vec4(color, 1.0);
          }
        `,
      });
    }
    const _condPlusMat  = _condMarkMaterial(0xff5500, COND_CHARGE_R * 0.88, COND_CHARGE_R * 0.10, true);
    const _condMinusMat = _condMarkMaterial(0x0066ff, COND_EL_R * 0.88,     COND_EL_R * 0.10,     false);
    const _condProtonGeo   = new THREE.SphereGeometry(COND_CHARGE_R, 32, 24);
    const _condElectronGeo = new THREE.SphereGeometry(COND_EL_R, 24, 18);

    // 置かれている導体の一覧。電子の座標は板ローカルなので、斥力や衝突の計算は必ず同じ板の中だけで行う
    const conductors = [];   // { mesh, electrons: [{ mesh, vel, targetVel, retargetTimer }], marks, innerLines }

    // 板の名前（上）。板の子にして一緒に動かす。
    // userData.keep を付けた子は、記号に切りかえるときの表示の入れかえから外す。
    // （はじめは教科書の吹き出し「打ち消しあって電場は 0」も板の上に出していたが、2026-09-29 本人「吹き出しはいりません」で消した）
    function _attachSlabTexts(mesh, name) {
      const nm = makeTextSprite(name, 2.4, { family: YU, bold: true });
      nm.position.set(COND_W / 2 + 1.7, 0.3, 0);          // ローカル +X ＝ 世界の上（−Z）
      nm.userData.keep = true;
      mesh.add(nm);
      return null;
    }

    function makeConductorMesh() {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(COND_W, COND_T, COND_D), conductorMat);
      mesh.rotation.y = SLAB_ROT_Y;
      const chargeY = 0.15;
      for (const pp of _condProtonPos) {
        const m = new THREE.Mesh(_condProtonGeo, _condPlusMat);
        m.position.set(pp.x, chargeY, pp.z);
        mesh.add(m);
      }
      // 陽子の格子と互い違いになる位置から始める
      const own = [];
      for (const x of COND_XS.map(v => v - 0.5)) {
        for (const z of COND_ZS) {
          const e = new THREE.Mesh(_condElectronGeo, _condMinusMat);
          e.position.set(x, chargeY, z);
          mesh.add(e);
          const fe = {
            mesh: e,
            vel:       new THREE.Vector3((Math.random() - 0.5) * 2, 0, (Math.random() - 0.5) * 2),
            targetVel: new THREE.Vector3(),
            retargetTimer: Math.random() * 0.8,
          };
          own.push(fe);
        }
      }
      const entry = { mesh, electrons: own };
      _attachSlabTexts(mesh, '導体');
      conductors.push(entry);
      mesh.userData.condEntry = entry;   // 削除時に一覧から外すため
      return mesh;
    }

    // 電場中で自由電子が受けるドリフト速度（E ＝ 3 のときの基準値）。見せるための速さなので、板を厚くしても渡りきる時間が同じになるよう厚さに比例させる
    const COND_DRIFT = 0.9 * (COND_D / 6);

    // 左の面に集まった電子が作る逆向きの電場が、外部の電場を打ち消していく。
    // 釣り合う枚数（＝電場の強さに比例）に達すると正味の力が0になり移動が止まる。
    // 少なすぎれば左へ、多すぎれば右へ戻る向きに働くので自動で釣り合う
    function _condDriftFactor(cond) {
      const total = cond.electrons.length;
      if (!total) return 0;
      const target = total * (fieldE / EMAX);   // 釣り合う表面電子数
      const net = (target - _condElectronsAtTop(cond)) / total;
      return THREE.MathUtils.clamp(net * 6, -1, 1);
    }

    // 自由電子のランダムウォーク＋衝突（導体ローカルのXZ平面内）
    function updateConductorElectrons(dt) {
      const edt = Math.min(dt, 0.05);
      for (const cond of conductors) _updateOneConductor(cond, edt);
    }

    function _updateOneConductor(cond, edt) {
      const conductorElectrons = cond.electrons;
      const repR = 2.0, repStr = 0.4;

      // 電場があるときだけ、電場から受ける力で左（ローカル −Z）へ寄る。
      // 速さは電場の強さに比例し、向きと停止は打ち消しの釣り合いで決まる
      const drift = _inField()
        ? COND_DRIFT * (fieldE / E0) * _condDriftFactor(cond) : 0;

      // 弱い斥力（集中しすぎを穏やかに防ぐ）
      for (let i = 0; i < conductorElectrons.length; i++) {
        const pi = conductorElectrons[i].mesh.position;
        for (let j = i + 1; j < conductorElectrons.length; j++) {
          const pj = conductorElectrons[j].mesh.position;
          const dx = pi.x - pj.x, dz = pi.z - pj.z;
          const d2 = dx * dx + dz * dz;
          if (d2 < repR * repR && d2 > 0.001) {
            const d = Math.sqrt(d2);
            const f = repStr * (1 - d / repR) * edt;
            const nx = dx / d, nz = dz / d;
            conductorElectrons[i].vel.x += nx * f; conductorElectrons[i].vel.z += nz * f;
            conductorElectrons[j].vel.x -= nx * f; conductorElectrons[j].vel.z -= nz * f;
          }
        }
      }

      for (const fe of conductorElectrons) {
        fe.retargetTimer -= edt;
        if (fe.retargetTimer <= 0) {
          const spd = 0.4 + Math.random() * 0.8;
          const ang = Math.random() * Math.PI * 2;
          fe.targetVel.set(Math.cos(ang) * spd, 0, Math.sin(ang) * spd);
          fe.retargetTimer = 0.5 + Math.random() * 1.0;
        }
        fe.vel.lerp(fe.targetVel, 3.0 * edt);
        const s = Math.hypot(fe.vel.x, fe.vel.z);
        if (s > 1.5) { fe.vel.x *= 1.5 / s; fe.vel.z *= 1.5 / s; }
        const p = fe.mesh.position;
        p.x += fe.vel.x * edt;
        // ドリフトは速度系とは別に加える。こうすると壁で跳ね返されても
        // 押し戻され続け、左の面に集まった状態が保たれる
        p.z += (fe.vel.z - drift) * edt;
        // 陽子との貫通防止
        for (const pp of _condProtonPos) {
          const dx = p.x - pp.x, dz = p.z - pp.z;
          const d2 = dx * dx + dz * dz;
          if (d2 < _cMinPE * _cMinPE && d2 > 0.0001) {
            const d = Math.sqrt(d2), nx = dx / d, nz = dz / d;
            p.x = pp.x + nx * _cMinPE;
            p.z = pp.z + nz * _cMinPE;
            const vn = fe.vel.x * nx + fe.vel.z * nz;
            if (vn < 0) { fe.vel.x -= 2 * vn * nx; fe.vel.z -= 2 * vn * nz; }
          }
        }
        if (p.x < -COND_BX) { p.x = -COND_BX; fe.vel.x =  Math.abs(fe.vel.x); fe.targetVel.x =  Math.abs(fe.targetVel.x); }
        if (p.x >  COND_BX) { p.x =  COND_BX; fe.vel.x = -Math.abs(fe.vel.x); fe.targetVel.x = -Math.abs(fe.targetVel.x); }
        if (p.z < -COND_BZ) { p.z = -COND_BZ; fe.vel.z =  Math.abs(fe.vel.z); fe.targetVel.z =  Math.abs(fe.targetVel.z); }
        if (p.z >  COND_BZ) { p.z =  COND_BZ; fe.vel.z = -Math.abs(fe.vel.z); fe.targetVel.z = -Math.abs(fe.targetVel.z); }
      }

      // 電子どうしの貫通防止（弾性衝突）
      for (let i = 0; i < conductorElectrons.length; i++) {
        const a = conductorElectrons[i], pa = a.mesh.position;
        for (let j = i + 1; j < conductorElectrons.length; j++) {
          const b = conductorElectrons[j], pb = b.mesh.position;
          const dx = pa.x - pb.x, dz = pa.z - pb.z;
          const d2 = dx * dx + dz * dz;
          if (d2 < _cMinEE * _cMinEE && d2 > 0.0001) {
            const d = Math.sqrt(d2), nx = dx / d, nz = dz / d;
            const sep = (_cMinEE - d) * 0.5;
            pa.x += nx * sep; pa.z += nz * sep;
            pb.x -= nx * sep; pb.z -= nz * sep;
            const dvn = (a.vel.x - b.vel.x) * nx + (a.vel.z - b.vel.z) * nz;
            if (dvn < 0) {
              a.vel.x -= dvn * nx; a.vel.z -= dvn * nz;
              b.vel.x += dvn * nx; b.vel.z += dvn * nz;
            }
          }
        }
      }
    }

    // ===== 不導体（誘電体）=====
    // 電子は構成粒子から離れられないので、粒子ごとに電子の位置がずれる＝誘電分極。
    // 内部にできる逆向きの電場は外部を完全には打ち消せず、E は 0 にならない
    const INS_MOL_R   = 0.35;     // 構成粒子の大きさ
    const INS_E_RATIO = 0.4;      // 内部に残る電場 E' の割合（E' = 0.4E。2026-09-29 本人「0.4 倍のままでいい」）

    const insulatorMat = (function () {
      const c = document.createElement('canvas');
      c.width = 8; c.height = 64;
      const g = c.getContext('2d');
      const grad = g.createLinearGradient(0, 0, 0, 64);
      grad.addColorStop(0.00, '#cdb994');
      grad.addColorStop(0.16, '#f2e6d2');
      grad.addColorStop(0.50, '#e2d2b8');
      grad.addColorStop(0.86, '#efe2ce');
      grad.addColorStop(1.00, '#c9b48e');
      g.fillStyle = grad;
      g.fillRect(0, 0, 8, 64);
      const t = new THREE.CanvasTexture(c);
      t.colorSpace = THREE.SRGBColorSpace;
      return new THREE.MeshBasicMaterial({ map: t });
    })();

    // 構成粒子は常に ＋ と − を持つ双極子。ローカル−Z側が −、+Z側が ＋。
    // 電場の中では − が電場と逆（世界の左）へ、＋ が電場の向き（右）へ引かれるので、
    // 粒子をY軸まわりに回すだけで「向きの偏り」を表せる
    const _insMolMat = (function () {
      const AL = (INS_MOL_R * 0.34).toFixed(6);   // 記号の腕の半長
      const AW = (INS_MOL_R * 0.10).toFixed(6);   // 記号の腕の半幅
      const CZ = (INS_MOL_R * 0.46).toFixed(6);   // ＋/− を置くZオフセット
      return new THREE.ShaderMaterial({
        vertexShader: `
          varying vec3 vNormalView;
          varying vec3 vLocalPos;
          void main() {
            vNormalView = normalize(normalMatrix * normal);
            vLocalPos   = position;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          varying vec3 vNormalView;
          varying vec3 vLocalPos;
          void main() {
            vec3 negCol = vec3(0.36, 0.56, 0.85);   // −側
            vec3 posCol = vec3(0.91, 0.54, 0.24);   // ＋側
            // ローカルZで塗り分ける（※ half は GLSL の予約語なので使わない）
            float zSide = smoothstep(-0.12, 0.12, vLocalPos.z / ${INS_MOL_R.toFixed(3)});
            vec3 baseColor = mix(negCol, posCol, zSide);

            vec3 N = normalize(vNormalView);
            vec3 V = vec3(0.0, 0.0, 1.0);
            float ndotv = max(dot(N, V), 0.0);
            float shade = pow(ndotv, 0.55);
            vec3 dark   = baseColor * 0.85;
            vec3 bright = mix(baseColor, vec3(1.0), 0.12);
            vec3 color  = mix(dark, bright, shade);
            vec3 L = normalize(vec3(-0.55, 0.65, 0.55));
            vec3 H = normalize(L + V);
            float spec = pow(max(dot(N, H), 0.0), 32.0);
            color += vec3(1.0) * spec * 0.85;
            float fresnel = pow(1.0 - ndotv, 3.0);
            color += baseColor * fresnel * 0.3;

            if (vLocalPos.y > 0.0) {
              float al = ${AL}, aw = ${AW}, cz = ${CZ};
              bool minusMark = abs(vLocalPos.x) < al && abs(vLocalPos.z + cz) < aw;
              bool plusMark  = (abs(vLocalPos.x) < al && abs(vLocalPos.z - cz) < aw)
                            || (abs(vLocalPos.z - cz) < al && abs(vLocalPos.x) < aw);
              if (minusMark || plusMark) color = vec3(1.0);
            }
            gl_FragColor = vec4(color, 1.0);
          }
        `,
      });
    })();

    const _insMolGeo = new THREE.SphereGeometry(INS_MOL_R, 24, 18);
    const insulators = [];   // { mesh, mols, marks, innerLines }

    function makeInsulatorMesh() {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(COND_W, COND_T, COND_D), insulatorMat);
      mesh.rotation.y = SLAB_ROT_Y;
      const mols = [];
      for (const x of COND_XS) {
        for (const z of COND_ZS) {
          const m = new THREE.Mesh(_insMolGeo, _insMolMat);
          m.position.set(x, 0.15, z);
          m.scale.set(1, 1, 1.3);                 // 双極子らしく軸方向へ少し伸ばす
          m.userData.baseAngle = (Math.random() * 2 - 1) * Math.PI;  // ばらばらの向き
          m.rotation.y = m.userData.baseAngle;
          mesh.add(m);
          mols.push(m);
        }
      }
      const entry = { mesh, mols };
      _attachSlabTexts(mesh, '不導体');
      insulators.push(entry);
      mesh.userData.insEntry = entry;
      return mesh;
    }

    // 電場が無ければ向きがばらばら。電場があると − が左へ、＋ が右へ引かれて向きが揃っていく。
    // 揃い方（偏りの強さ）は電場の強さに比例する
    function updateInsulators(dt) {
      const k = Math.min(1, 3.0 * dt);            // 向きを変える速さ
      for (const ins of insulators) {
        const inField = _inField();
        const align = inField ? fieldE / EMAX : 0;
        // 分極電荷の表示は「正・負がON かつ 電場がある」ときだけ
        const polarized = showCharges && inField;
        if (!!(ins.marks && ins.marks.visible) !== polarized) _insSetPolarized(ins, polarized);
        for (const m of ins.mols) {
          const target = m.userData.baseAngle * (1 - align);
          m.rotation.y += (target - m.rotation.y) * k;
        }
        _insSyncInnerLines(ins, inField);
      }
    }

    // 不導体の中に描く線は「分極電荷がつくる逆向きの電場」であって、
    // 残っている電場 E' ではない。外部 E のうち (1 - INS_E_RATIO) だけを打ち消すので、
    // 本数は N × (1 - INS_E_RATIO)。残るのが E' = INS_E_RATIO × E になり、電場のグラフと合う。
    // （導体は全部を打ち消すので本数が N。これが「残っている電場ではない」ことの証拠）
    function _insInnerLineCount() {
      return Math.round(lineCount() * (1 - INS_E_RATIO));
    }

    // 外部の電気力線の位置（板ローカル X。世界では Z ＝ ZC − x）。板の長さ COND_W を N 等分した中央
    function _extLineXs() {
      const N = lineCount(), out = [];
      for (let i = 0; i < N; i++) out.push(-COND_W / 2 + COND_W * (i + 0.5) / N);
      return out;
    }

    // 内部の線は外部の線と本数が違うため、x がたまたま一致して重なることがある。
    // 近すぎるものは外部の半間隔だけずらして谷間へ逃がす
    function _avoidExternalLines(xs) {
      const N = lineCount();
      if (!N) return xs;
      const s = COND_W / N;
      const ext = _extLineXs();
      const lim = COND_W / 2 - 1.0;
      return xs.map(x => {
        let near = ext[0];
        for (const p of ext) if (Math.abs(p - x) < Math.abs(near - x)) near = p;
        if (Math.abs(near - x) >= 0.5) return x;
        return THREE.MathUtils.clamp(x >= near ? near + s / 2 : near - s / 2, -lim, lim);
      });
    }

    function _insInnerLineXs() {
      const n  = _insInnerLineCount();
      const s  = COND_W / (n || 1);
      const xs = [];
      for (let i = 0; i < n; i++) xs.push(-COND_W / 2 + s * (i + 0.5));
      return _avoidExternalLines(xs);
    }

    function _insBuildInnerLines(ins) {
      if (ins.innerLines) {
        for (const m of ins.innerLines.children) m.geometry.dispose();
        ins.mesh.remove(ins.innerLines);
        ins.innerLines = null;
      }
      const grp = new THREE.Group();
      const LW = 0.18, y = 0.55;      // 外部の電気力線と同じ高さ
      const AW = 0.40, AH = 0.80;
      const mat = _matLine;
      // ＋/− マークに食い込まないよう導体と同じ余白を取る
      const zStart = (COND_D / 2 - 0.9) - 0.7;    // ＋マークの内側から
      const zEnd   = (-COND_D / 2 + 0.9) + 0.5;   // −マークの手前まで

      for (const x of _insInnerLineXs()) {
        const nx = LW / 2;
        const g = new THREE.BufferGeometry();
        g.setAttribute('position', new THREE.Float32BufferAttribute([
          x - nx, y, zStart,  x + nx, y, zStart,  x + nx, y, zEnd,
          x - nx, y, zStart,  x + nx, y, zEnd,    x - nx, y, zEnd,
        ], 3));
        grp.add(new THREE.Mesh(g, mat));
        grp.add(new THREE.Mesh(makeChevronGeometry(x, zEnd, AW, AH, LW, y), mat));
      }
      ins.mesh.add(grp);
      ins.innerLines = grp;
      ins.innerLineKey = _insInnerLineXs().join(',');
    }

    // 分極電荷のマーク（左の面が−、右の面が＋）。
    // 内部の線は 右の面の＋ から 左の面の− へ向かう「分極電荷がつくる電場」なので、
    // マークは線の根元と先端に置く ＝ 本数も位置も内部の線と同じでよい
    function _insMarkXs() {
      return _insInnerLineXs();
    }

    // マークの大きさ（線の隣に収まるよう小さめ）。導体と不導体で共通
    const COND_MARK_DX  = 0.72;
    const COND_MARK_LEN = 0.8, COND_MARK_BAR = 0.20;

    function _insBuildMarks(ins) {
      if (ins.marks) {
        for (const m of ins.marks.children) m.geometry.dispose();
        ins.mesh.remove(ins.marks);
        ins.marks = null;
      }
      const grp = new THREE.Group();
      const BAR = COND_MARK_BAR, LEN = COND_MARK_LEN, y = 0.2;
      const zTop = -COND_D / 2 + 0.9, zBot = COND_D / 2 - 0.9;
      function bar(x, z, w, d, mat) {
        const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), mat);
        m.rotation.x = -Math.PI / 2;
        m.position.set(x, y, z);
        grp.add(m);
      }
      // 板は回してあるので、世界で横棒（−）にするにはローカル Z 方向に長く描く（ローカル Z ＝ 世界 X）
      for (const x of _insMarkXs()) {
        bar(x, zTop, BAR, LEN, _matNeg);   // −（左の面。世界で横棒）
        bar(x, zBot, LEN, BAR, _matPos);   // ＋の一方の棒（右の面）
        bar(x, zBot, BAR, LEN, _matPos);   // ＋のもう一方の棒
      }
      grp.visible = false;
      ins.mesh.add(grp);
      ins.marks = grp;
      ins.markKey = _insMarkXs().join(',');
    }

    // 分極電荷の表示に切り替える／構成粒子の表示に戻す
    function _insSetPolarized(ins, on) {
      if (!ins.marks || ins.markKey !== _insMarkXs().join(',')) _insBuildMarks(ins);
      ins.marks.visible = on;
      for (const m of ins.mols) m.visible = !on;
    }

    function _insSyncInnerLines(ins, inField) {
      const want = inField && fieldLines.visible && _insInnerLineCount() > 0;
      if (want && ins.innerLineKey !== _insInnerLineXs().join(',')) _insBuildInnerLines(ins);
      if (ins.innerLines) ins.innerLines.visible = want;
    }

    // ===== 導体の誘導電荷表示 =====
    // 自由電子が左の面に十分集まった＝静電誘導が完了した状態とみなし、
    // 個々の電荷ではなく左の面が−・右の面が＋という誘導電荷の表示に切り替える
    // 「面に接している」だと弱い電場で判定が厳しすぎるため、
    // 左のこの帯に入っていれば表面へ移った電子として数える。
    // 一番左の陽子列（ローカル z=-2）より外側がおおよそこの範囲にあたる
    const COND_TOP_BAND = 0.9;
    // 集まる枚数は電場の強さに比例するので、固定数ではなく
    // 「釣り合う枚数の8割以上まで集まったか」で静電誘導の完了を判定する
    // on には「いま誘導電荷の表示になっているか」を渡す。
    // 同じしきい値だと、面の電子数が境目で揺れるたびに表示が切りかわってしまうので、
    // いったん切りかわったら少し粘らせる（0.8 で入り、0.6 で戻る）
    function _condIsPolarizable(cond, on) {
      const total = cond.electrons.length;
      const target = total * (fieldE / EMAX);
      if (target < 1) return false;
      const ratio = _condElectronsAtTop(cond) / target;
      return on ? ratio >= 0.6 : ratio >= 0.8;
    }

    // 「正・負」を出したまま電場を強めても、電子が集まりきった時点で
    // 誘導電荷の表示に切りかわるように、毎コマ見直す
    function syncConductorPolarized() {
      for (const cond of conductors) {
        const now  = !!(cond.marks && cond.marks.visible);
        const want = showCharges && _condIsPolarizable(cond, now);
        if (now !== want) _condSetPolarized(cond, want);
      }
    }

    function _condElectronsAtTop(cond) {
      let n = 0;
      for (const fe of cond.electrons) {
        if (fe.mesh.position.z <= -COND_BZ + COND_TOP_BAND) n++;
      }
      return n;
    }

    // マークを置く位置（導体ローカル X）。
    // 本数は電気力線と同じにして1対1に対応させつつ、線の真上だと重なるので
    // 各線のすぐ隣（世界では線の上）へ寄せる。ずらし幅は隣の線に触れない範囲に収めてある
    function _condMarkXs() {
      const lim = COND_W / 2 - COND_MARK_LEN / 2 - 0.15;   // 板からはみ出さない範囲
      return _extLineXs().map(x => Math.min(x + COND_MARK_DX, lim));
    }

    function _condBuildMarks(cond) {
      if (cond.marks) {                            // 電場の強さが変わると位置も変わるので作り直す
        for (const m of cond.marks.children) m.geometry.dispose();
        cond.mesh.remove(cond.marks);
        cond.marks = null;
      }
      const grp = new THREE.Group();
      const BAR = COND_MARK_BAR, LEN = COND_MARK_LEN, y = 0.2;
      const zTop = -COND_D / 2 + 0.9, zBot = COND_D / 2 - 0.9;
      function bar(x, z, w, d, mat) {
        const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), mat);
        m.rotation.x = -Math.PI / 2;
        m.position.set(x, y, z);
        grp.add(m);
      }
      // 板は回してあるので、世界で横棒（−）にするにはローカル Z 方向に長く描く（ローカル Z ＝ 世界 X）
      for (const x of _condMarkXs()) {
        bar(x, zTop, BAR, LEN, _matNeg);   // −（電子が集まった左の面。世界で横棒）
        bar(x, zBot, LEN, BAR, _matPos);   // ＋の一方の棒（右の面）
        bar(x, zBot, BAR, LEN, _matPos);   // ＋のもう一方の棒
      }
      grp.visible = false;
      cond.mesh.add(grp);
      cond.marks = grp;

      _condBuildInnerLines(cond, zTop, zBot);
    }

    // 誘導電荷がつくる導体内部の電気力線。
    // 右の面の＋から左の面の−へ向かうので、外部の電場とはちょうど逆向きになり、
    // 本数が同じことで「内部の電場は打ち消されて0」を表す
    function _condBuildInnerLines(cond, zTop, zBot) {
      if (cond.innerLines) {
        for (const m of cond.innerLines.children) m.geometry.dispose();
        cond.mesh.remove(cond.innerLines);
        cond.innerLines = null;
      }
      const grp = new THREE.Group();
      // 短い矢印なので、外部の線より細く・矢じりも小さめにして形を整える
      const LW = 0.18, y = 0.55;      // 高さは外部の電気力線と同じ
      const AW = 0.40, AH = 0.80;     // 矢じりの半幅・長さ
      const mat = _matLine;
      const zStart = zBot - 0.7;      // ＋マークの内側から
      const zEnd   = zTop + 0.5;      // −マークの手前まで

      function seg(x1, z1, x2, z2, w) {
        const dx = x2 - x1, dz = z2 - z1, L = Math.hypot(dx, dz) || 1;
        const nx = -dz / L * w / 2, nz = dx / L * w / 2;
        const g = new THREE.BufferGeometry();
        g.setAttribute('position', new THREE.Float32BufferAttribute([
          x1+nx, y, z1+nz,  x1-nx, y, z1-nz,  x2-nx, y, z2-nz,
          x1+nx, y, z1+nz,  x2-nx, y, z2-nz,  x2+nx, y, z2+nz,
        ], 3));
        grp.add(new THREE.Mesh(g, mat));
      }

      for (const x of _condMarkXs()) {
        seg(x, zStart, x, zEnd, LW);                 // 本体（＋→−）
        grp.add(new THREE.Mesh(makeChevronGeometry(x, zEnd, AW, AH, LW, y), mat));
      }
      grp.visible = false;
      cond.mesh.add(grp);
      cond.innerLines = grp;
    }

    // 誘導電荷を表示していて、かつ電気力線がONのときだけ内部の線を出す
    function _condSyncInnerLines(cond) {
      if (!cond.innerLines) return;
      cond.innerLines.visible = !!(cond.marks && cond.marks.visible) && fieldLines.visible;
    }

    function _condSetPolarized(cond, on) {
      _condBuildMarks(cond);
      cond.marks.visible = on;
      // 陽子と自由電子はまとめて表示を入れ替える（名前＝ keep は入れかえない）
      for (const child of cond.mesh.children) {
        if (child.userData.keep) continue;
        if (child !== cond.marks && child !== cond.innerLines) child.visible = !on;
      }
      _condSyncInnerLines(cond);
    }

    // ===== 一様な電場（左 → 右の電気力線）=====
    const fieldLines = new THREE.Group();   // 既定で表示（一様な電場がこのページの土台）
    scene.add(fieldLines);
    let showCharges = false;                // 「正・負」ボタン

    // 電場の強さを変えるたびに作り直すので、マテリアルは使い回して漏らさない
    const _matLine = new THREE.MeshBasicMaterial({ color: 0xf0a060, side: THREE.DoubleSide });
    const _matPos  = new THREE.MeshBasicMaterial({ color: 0xff5500, side: THREE.DoubleSide });
    const _matNeg  = new THREE.MeshBasicMaterial({ color: 0x0066ff, side: THREE.DoubleSide });

    function buildFieldLines() {
      _clear(fieldLines);
      const N  = lineCount();   // 本数は電場の強さに比例
      const LW = 0.22;          // 線の太さ
      // 導体（板の上面 0.15＋陽子スフィアの上端 0.45）より上に置き、
      // 教科書の図のように電気力線が導体に隠れないようにする
      const Y  = 0.55;
      const AW = 0.80, AH = 1.6;  // 矢じりの半幅・長さ
      const span = XMAX - XMIN;
      for (const xl of _extLineXs()) {
        const z = ZC - xl;                       // 板ローカル X → 世界 Z
        const line = new THREE.Mesh(new THREE.PlaneGeometry(span, LW), _matLine);
        line.rotation.x = -Math.PI / 2;
        line.position.set((XMIN + XMAX) / 2, Y, z);
        fieldLines.add(line);
        // 矢じり（左 → 右）。先端が右端にちょうど届く
        fieldLines.add(new THREE.Mesh(makeChevronGeometryRight(XMAX, z, AW, AH, LW, Y), _matLine));
      }
      if (N > 0) {
        const t = makeTextSprite('外部の電場', 2.3, { family: YU });
        t.position.set(XMAX + 6.6, 0.6, ZC - 1.4);
        fieldLines.add(t);
        const e = makeTextSprite('E', 2.8, { italic: true });
        e.position.set(XMAX + 6.6, 0.6, ZC + 1.7);
        fieldLines.add(e);
      }
    }
    buildFieldLines();

    // ===== グラフ（絵の真下。横軸 ＝ 世界の X）=====
    const graphE = new THREE.Group(), graphV = new THREE.Group(), guides = new THREE.Group();
    graphE.visible = graphV.visible = false;
    scene.add(graphE, graphV, guides);
    const _gMat = {
      axis:   new THREE.MeshBasicMaterial({ color: 0x000000, side: THREE.DoubleSide }),
      orange: new THREE.MeshBasicMaterial({ color: 0xe8961e, side: THREE.DoubleSide }),
      fill:   new THREE.MeshBasicMaterial({ color: 0xfae3c0, side: THREE.DoubleSide }),
      green:  new THREE.MeshBasicMaterial({ color: 0x00b473, side: THREE.DoubleSide }),
      dash:   new THREE.MeshBasicMaterial({ color: 0x777777, side: THREE.DoubleSide }),
      cmp:    new THREE.MeshBasicMaterial({ color: 0x9a9a9a, side: THREE.DoubleSide }),
    };
    let compareOn = true;   // 不導体のとき「導体の場合」を点線で重ねる

    // 置いてある板を X の順に並べる。a・b ＝ 板の左右の端（世界 X）、r ＝ 中に残る電場の割合（導体 0・不導体 0.4）。
    // つまんで動かしている板（一覧から外れている）も入れる：引きずっているあいだもグラフが位置に追いつくように（2026-09-29 本人の注文）
    function slabSpans() {
      const out = [];
      const list = placedParticles.slice();
      if (tbDrag.active && tbDrag.mesh) list.push({ mesh: tbDrag.mesh, type: tbDrag.type });
      for (const p of list) {
        const x = p.mesh.position.x;
        out.push({ a: x - COND_D / 2, b: x + COND_D / 2, r: p.type === 'conductor' ? 0 : INS_E_RATIO, type: p.type });
      }
      out.sort((u, v) => u.a - v.a);
      return out;
    }
    // XMIN から XMAX までを、電場の割合 r ごとの区間に切る（板の外は 1）。insAsCond ＝ 不導体も導体（0）として扱う
    function ratioSegments(spans, insAsCond) {
      const segs = []; let x = XMIN;
      for (const s of spans) {
        if (s.a > x + 1e-9) segs.push({ x0: x, x1: s.a, r: 1 });
        segs.push({ x0: s.a, x1: s.b, r: insAsCond ? 0 : s.r, type: s.type });
        x = s.b;
      }
      if (x < XMAX - 1e-9) segs.push({ x0: x, x1: XMAX, r: 1 });
      return segs;
    }
    // 電位の折れ線：左端を基準（V_left ＝ 高さ LVV）にして、電場ぶんだけ下がる。
    // 高さ h(x) ＝ LVV × (1 − S(x)/L)、S(x) ＝ ∫(E/E_ext)dx。板があると右端は 0 より上で終わる（教科書の図と同じ）
    function potentialPoints(segs, LVV) {
      const L = XMAX - XMIN, pts = [{ x: XMIN, h: LVV }];
      let S = 0;
      for (const s of segs) { S += s.r * (s.x1 - s.x0); pts.push({ x: s.x1, h: LVV * (1 - S / L) }); }
      return pts;
    }

    function buildGraphs() {
      _clear(graphE); _clear(graphV); _clear(guides);
      const LV = GH * 0.17 * fieldE;        // E の高さ（電場の強さに比例）
      const AXW = 0.26, LNW = 0.42;         // 軸の太さ / データ線の太さ
      const Y = 0.05;
      const spans = slabSpans();
      const segs = ratioSegments(spans, false);
      const hasIns = spans.some(s => s.type === 'insulator');
      const cmp = compareOn && hasIns ? ratioSegments(spans, true) : null;

      function rect(grp, x1, z1, x2, z2, m, y = Y) {
        const o = new THREE.Mesh(new THREE.PlaneGeometry(Math.abs(x2 - x1), Math.abs(z2 - z1)), m);
        o.rotation.x = -Math.PI / 2;
        o.position.set((x1 + x2) / 2, y, (z1 + z2) / 2);
        grp.add(o);
      }
      function seg(grp, x1, z1, x2, z2, w, m) {   // 軸平行の線
        const h = w / 2;
        rect(grp, Math.min(x1, x2) - h, Math.min(z1, z2) - h, Math.max(x1, x2) + h, Math.max(z1, z2) + h, m);
      }
      function slope(grp, x1, z1, x2, z2, w, m, y = Y) {   // 任意の向きの線
        const dx = x2 - x1, dz = z2 - z1, L = Math.hypot(dx, dz);
        if (L < 1e-6) return;
        const nx = -dz / L * w / 2, nz = dx / L * w / 2;
        const g = new THREE.BufferGeometry();
        g.setAttribute('position', new THREE.Float32BufferAttribute([
          x1+nx,y,z1+nz, x1-nx,y,z1-nz, x2-nx,y,z2-nz,
          x1+nx,y,z1+nz, x2-nx,y,z2-nz, x2+nx,y,z2+nz,
        ], 3));
        grp.add(new THREE.Mesh(g, m));
      }
      function dash(grp, x1, z1, x2, z2, m = _gMat.dash, w = 0.20) {   // 破線（任意の向き）
        const D = 1.0, G = 0.7;
        const L = Math.hypot(x2 - x1, z2 - z1);
        if (L < 1e-6) return;
        const ux = (x2 - x1) / L, uz = (z2 - z1) / L;
        for (let t = 0; t < L; t += D + G) {
          const e = Math.min(t + D, L);
          slope(grp, x1 + ux * t, z1 + uz * t, x1 + ux * e, z1 + uz * e, w, m, Y + 0.01);
        }
      }
      function tri(grp, ax, az, bx, bz, cx, cz, m) {
        const g = new THREE.BufferGeometry();
        g.setAttribute('position', new THREE.Float32BufferAttribute([ax,Y,az, bx,Y,bz, cx,Y,cz], 3));
        grp.add(new THREE.Mesh(g, m));
      }
      function dot(grp, x, z, m) {   // 折れ線の継ぎ目を丸める（太い線を突き合わせると段が見える）
        const o = new THREE.Mesh(new THREE.CircleGeometry(LNW / 2, 16), m);
        o.rotation.x = -Math.PI / 2;
        o.position.set(x, Y, z);
        grp.add(o);
      }
      function label(grp, text, x, z, h, opt) {
        const sp = makeTextSprite(text, h, opt);
        sp.position.set(x, Y + 0.1, z);
        grp.add(sp);
      }
      // 2本の軸（右向き・上向きの矢じり付き）と、O・位置
      function axes(grp, oz, title) {
        seg(grp, XMIN, oz, XMAX, oz, AXW, _gMat.axis);                 // 横軸
        tri(grp, XMAX + 1.1, oz, XMAX - 0.5, oz - 0.75, XMAX - 0.5, oz + 0.75, _gMat.axis);
        seg(grp, XMIN, oz, XMIN, oz - GH, AXW, _gMat.axis);             // 縦軸
        tri(grp, XMIN, oz - GH - 1.1, XMIN - 0.75, oz - GH + 0.5, XMIN + 0.75, oz - GH + 0.5, _gMat.axis);
        label(grp, 'O', XMIN - 1.6, oz + 1.6, 2.4);
        label(grp, '位置', XMAX + 4.3, oz + 0.1, 2.3, { family: YU });
        label(grp, title, XMIN + 4.4, oz - GH - 1.0, 2.3, { family: YU });
      }

      // ---- 電場のグラフ ----
      // 板の外は一定値 E、導体の中は 0、不導体の中は E′ ＝ 0.4E
      axes(graphE, ZE, '電場の強さ');
      let prevLv = null;
      for (const s of segs) {
        const lv = ZE - LV * s.r;
        rect(graphE, s.x0, ZE, s.x1, lv, _gMat.fill, Y - 0.01);
        seg(graphE, s.x0, lv, s.x1, lv, LNW, _gMat.orange);
        if (prevLv !== null) { seg(graphE, s.x0, prevLv, s.x0, lv, LNW, _gMat.orange); dot(graphE, s.x0, prevLv, _gMat.orange); dot(graphE, s.x0, lv, _gMat.orange); }   // 段（板の端で落ちる・立ち上がる）
        prevLv = lv;
      }
      if (cmp) {   // 導体の場合（不導体の区間だけ 0 に落ちる点線）
        for (const s of segs) {
          if (s.type !== 'insulator') continue;
          const lv = ZE - LV * s.r;
          dash(graphE, s.x0, lv, s.x0, ZE, _gMat.cmp); dash(graphE, s.x1, lv, s.x1, ZE, _gMat.cmp);
          dash(graphE, s.x0, ZE - 0.02, s.x1, ZE - 0.02, _gMat.cmp);
        }
        const s0 = segs.find(s => s.type === 'insulator');
        label(graphE, '不導体の場合', s0.x1 + 4.6, ZE - LV * s0.r - 1.15, 1.7, { family: YU });
        label(graphE, '導体の場合', s0.x1 + 4.3, ZE - 1.1, 1.7, { family: YU, color: '#666' });
      }
      if (fieldE > 0) {
        label(graphE, 'E', XMIN - 1.9, ZE - LV, 2.4, { italic: true });
        if (hasIns) label(graphE, "E'", XMIN - 2.1, ZE - LV * INS_E_RATIO, 2.2, { italic: true });
      }

      // ---- 電位のグラフ ----
      // 板の外は電場に沿って下がる坂、導体の中は平ら、不導体の中はゆるい坂。左端が基準
      axes(graphV, ZV, '電位');
      const LVV = GH * 0.17 * fieldE;
      const pts = potentialPoints(segs, LVV);
      for (let i = 1; i < pts.length; i++) {
        slope(graphV, pts[i - 1].x, ZV - pts[i - 1].h, pts[i].x, ZV - pts[i].h, LNW, _gMat.green);
        if (i < pts.length - 1) dot(graphV, pts[i].x, ZV - pts[i].h, _gMat.green);
      }
      if (cmp) {   // 導体の場合：最初の不導体の左端から先を点線で
        const pc = potentialPoints(cmp, LVV), i0 = Math.max(1, cmp.findIndex(s => s.type === 'insulator') + 1);
        for (let i = i0; i < pc.length; i++) dash(graphV, pc[i - 1].x, ZV - pc[i - 1].h, pc[i].x, ZV - pc[i].h, _gMat.cmp);
      }
      if (fieldE > 0) label(graphV, 'V', XMIN - 1.9, ZV - LVV, 2.4, { italic: true });

      // ---- 板の端から下ろす破線（絵とグラフの位置をつなぐ）----
      const zFrom = ZC + COND_W / 2 + 0.6;
      const zTo = graphV.visible ? ZV : graphE.visible ? ZE : null;
      if (zTo !== null) for (const s of spans) { dash(guides, s.a, zFrom, s.a, zTo); dash(guides, s.b, zFrom, s.b, zTo); }
    }
    buildGraphs();

    // 板が出入り・移動したり、電場の強さ・表示が変わったらグラフを作り直す（位置が変われば形も変わる）
    let _graphKey = '';
    function _syncGraphs() {
      // 細かく刻むとドラッグ中に毎フレーム作り直しになるので粗めに丸める
      const key = slabSpans().map(s => `${s.a.toFixed(2)},${s.type}`).join(';') + `|${fieldE}|${compareOn}|${graphE.visible}|${graphV.visible}`;
      if (key === _graphKey) return;
      _graphKey = key;
      buildGraphs();
    }

    // ===== 画面の枠（見えている物が道具箱の右に収まるように）=====
    const TOOLBOX_PX = 300;   // 道具箱が隠す幅（px）
    function contentBounds() {
      const zTop = ZC - COND_W / 2 - 4.2;          // 板の名前のぶん
      let zBot = ZC + COND_W / 2 + 2.5;
      if (graphE.visible) zBot = Math.max(zBot, ZE + 4.4);
      if (graphV.visible) zBot = Math.max(zBot, ZV + 4.4);
      return { xa: XMIN - 3.5, xb: XMAX + 11, zTop, zBot };
    }
    function fitView() {
      const W = window.innerWidth, H = window.innerHeight, aspect = W / H;

    const h=_dr.intersectObject(_shapeBoardMesh,false);
    if (!h.length||!h[0].uv) return false;
    const {x:cx,y:cy}=uv2xy(h[0].uv,_shapeBoardCanvas);
    if (selIdx>=0) { const hh=hitHandles(shapes[selIdx],cx,cy); if(hh){ selHandle=hh; selOrigin={x:cx,y:cy}; selSnap={...shapes[selIdx]}; selDragging=true; controls.enabled=false; try{renderer.domElement.setPointerCapture(ev.pointerId);}catch(e){} ev.preventDefault(); ev.stopPropagation(); return true; } }
    for (let i=shapes.length-1;i>=0;i--) { if(hitShape(shapes[i],cx,cy)){ selIdx=i; selDragging=false; redrawShapes(); ev.preventDefault(); ev.stopPropagation(); return true; } }
    if (selIdx>=0) { selIdx=-1; redrawShapes(); }
    return false;
  }
  function updateSel(ev) {
    if (!selDragging||selIdx<0) return;
    if (!_shapeBoardMesh) return;
    getNDC(ev); _dr.setFromCamera(_dm,camera);
    const h=_dr.intersectObject(_shapeBoardMesh,false);
    if (!h.length||!h[0].uv) return;
    const {x,y}=uv2xy(h[0].uv,_shapeBoardCanvas);
    const s=shapes[selIdx];
    if (s.type==='arrow') {
      if (selHandle==='start'){s.x1=x;s.y1=y;}
      else if(selHandle==='end'){s.x2=x;s.y2=y;}
      else if(selHandle==='mid'&&selOrigin&&selSnap){const dx=x-selOrigin.x,dy=y-selOrigin.y;s.x1=selSnap.x1+dx;s.y1=selSnap.y1+dy;s.x2=selSnap.x2+dx;s.y2=selSnap.y2+dy;}
    }
    redrawShapes(); ev.preventDefault();
  }
  function endSel(ev) {
    if (!selDragging) return;
    selDragging=false; selHandle=null; selOrigin=null; selSnap=null; controls.enabled=true;
    try{renderer.domElement.releasePointerCapture(ev?.pointerId);}catch(e){}
  }

  document.getElementById('toolPen').addEventListener('click', ()=>setInkMode('pen'));
  document.getElementById('toolEraser').addEventListener('click', ()=>setInkMode('eraser'));
  document.getElementById('inkClear').addEventListener('click', clearInk);
  document.getElementById('toolArrow').addEventListener('click', ()=>setShapeMode('arrow'));
  document.getElementById('shapeClear').addEventListener('click', ()=>{ shapes.length=0;selIdx=-1;if(_shapeBoardCtx)redrawShapes(); });

  renderer.domElement.addEventListener('pointerdown', e=>{ if(e.button===0) tryStartShape(e)||tryStartSel(e)||tryStartInk(e); });
  window.addEventListener('pointermove', e=>{ if(_shapeDrawing){updateShape(e);return;} if(selDragging){updateSel(e);return;} if(_inkDrawing){updateInk(e);return;} });
  window.addEventListener('pointerup',     e=>{ if(e.button===0){endShapeDraw(e);endSel(e);endInk(e);} });
  window.addEventListener('pointercancel', e=>{ endShapeDraw(e);endSel(e);endInk(e); });
  window.addEventListener('keydown', e=>{
    const tag=document.activeElement?.tagName;
    if(selIdx>=0&&(e.key==='Delete'||e.key==='Backspace')&&tag!=='INPUT'&&tag!=='TEXTAREA'){
      shapes.splice(selIdx,1);selIdx=-1;redrawShapes();e.preventDefault();
    }
  });
})();
  </script>
<!-- 文字や絵の引きずりを始めさせない。始まるとブラウザが禁止のしるし（🚫）を出したまま
     操作を横取りし、つまみや盤面にポインタが届かなくなる（CLAUDE.md §8-21） -->
<script>window.addEventListener('dragstart', e => e.preventDefault());</script>
