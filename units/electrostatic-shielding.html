  <style>

      --bg:#ffffff;
      --panel:rgba(240,243,252,0.95);

    #app{position:fixed;inset:0;overflow:hidden}

    canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

    .topbar{
      position:absolute;left:0;top:0;right:0;z-index:5;
      display:flex;gap:8px;align-items:center;
      padding:10px 12px;
      background:linear-gradient(to bottom, rgba(255,255,255,.80), rgba(255,255,255,0));
      pointer-events:none;
    }
    .topbar a, .topbar button, .topbar .pill{pointer-events:auto}
    .btn, .pill{
      border:1px solid var(--border);
      background:var(--panel);
      color:var(--text);
      border-radius:12px;
      padding:8px 10px;
      font-size:12px;
      cursor:pointer;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      gap:6px;
    }
    .btn:hover{opacity:.9}
    .pill{cursor:default;color:var(--muted)}
    .btn.active{ outline:2px solid rgba(120,170,255,.6); }
    .btn:disabled, .btn[aria-disabled="true"]{opacity:.45;cursor:default}

    .sidebar{
      position:absolute;left:10px;top:56px;bottom:10px;z-index:6;
      width:280px;max-width:85vw;
      background:var(--panel);
      border:1px solid var(--border);
      border-radius:16px;
      padding:12px;
      overflow:auto;
      backdrop-filter: blur(6px);
    }
    .h{font-weight:800;font-size:13px;margin:0 0 8px}
    .group{margin:10px 0 12px}
    .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}

    .seg{display:flex;gap:4px;margin-top:8px}

    #toolboxPanel{

    #toolboxToggle.toolboxToggle{
      position: absolute;

      right: 10px;
      width: 28px;

      border: 1px solid rgba(70,90,160,0.25);
      background: rgba(240,243,252,0.90);
      color: #1a2040;
      cursor: pointer;
      display: grid;

    #toolboxPanel.is-collapsed #toolboxToggle{

    #toolboxPanel{
      overflow: hidden auto;              /* 中身が画面より長いときは縦にスクロール（横は出さない） */
      overscroll-behavior: contain;
    }
    #toolboxPanel.is-collapsed > :not(#toolboxToggle){
      display: none !important;

    .help{
      position:absolute;right:10px;bottom:10px;z-index:6;
      background:rgba(240,243,252,0.92);
      border:1px solid rgba(70,90,160,0.20);

    .help b{color:var(--text)}
  /* 画面の文字は選ばせない（CLAUDE.md §8-21）。入力欄の中だけは選べるままにしておく */
  #app{user-select:none}
  #app input,#app textarea,#app select{user-select:auto}

      <button id="particleDeleteBtn" type="button" style="display:flex;align-items:center;gap:7px;border:none;background:none;padding:8px 16px;border-radius:7px;cursor:pointer;font-size:13px;color:#1a2040;white-space:nowrap">

    <div class="help">

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // =====================================================================
    //  静電遮蔽（2026-09-29 に新しく作った。設計は dev\notes\design_shielding.md）
    //   ・一様な電場の中の導体球：電気力線と等電位線が曲がり、力線は導体の表面に垂直（教科書 図 23）
    //   ・接地した導体の輪の外に電荷：輪の外側に −、空洞の中の電場は 0（図 24・図 25）
    //   ・輪の中に電荷：輪の内側に −。接地していなければ外側に ＋ が現れて外にも電場が出る。接地すると外には出ない
    //  電位 φ は升目（N×N）でポアソンの式を解いて出す（赤黒 SOR）。導体は升目を固定。中性の導体は φ0 ＋ Vc·φ1 の重ね合わせ
    //  （φ0：導体 0・境界と電荷あり／φ1：導体 1・境界 0・電荷なし。導体の電荷が 0 になる Vc を取る）。番号は画面に出さない（CLAUDE.md §8-20）
    // =====================================================================

    // ===== 基本セットアップ =====
    const canvas = document.getElementById('c');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(2, window.devicePixelRatio));

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xffffff);

    // 真上からの平行投影に固定する（画面右 ＝ ＋X、画面下 ＝ ＋Z）
    const camera = new THREE.OrthographicCamera(-38, 38, 38, -38, 0.1, 1000);
    camera.position.set(0, 100, 0);
    camera.up.set(0, 0, -1);
    camera.lookAt(0, 0, 0);
    scene.add(camera); // カメラ子要素（描画ボード）をシーングラフに含めるために必要

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.target.set(0, 0, 0);
    controls.zoomToCursor = true;
    controls.enableRotate = false;
    controls.mouseButtons = { LEFT: THREE.MOUSE.PAN, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.PAN };
    controls.update();

    scene.add(new THREE.AmbientLight(0xffffff, 1.0));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.70);
    dirLight.position.set(6, 10, 6);
    scene.add(dirLight);

    // ===== 舞台の寸法と升目 =====
    const L = 60;                 // 世界の一辺（±30）
    const N = 128;                // 升目の数（一辺）
    const H = L / N;              // 1 マスの大きさ
    const OMEGA = 2 / (1 + Math.sin(Math.PI / N));   // SOR の緩和の係数（この形の式でいちばん速い値）
    const E0 = 0.35;              // 一様な電場の強さ（導体球の場面）
    const NL_UNIFORM = 14;        // 一様な電場で描く電気力線の本数
    const PHI0 = E0 * L / NL_UNIFORM;   // 電気力線 1 本ぶんの流束
    const Q_UNIT = 16 * PHI0;     // 点電荷 1 個の電気量（1 個から 16 本）
    const CHARGE_R = 0.9;         // 点電荷の球の半径
    const MAX_CHARGES = 6;
    const cellX = i => -L / 2 + (i + 0.5) * H;   // 升目の中心の世界の座標（Z も同じ式）
    const cellOf = v => Math.floor((v + L / 2) / H);

    const phi0 = new Float32Array(N * N), phi1 = new Float32Array(N * N), phi = new Float32Array(N * N);
    const Ex = new Float32Array(N * N), Ez = new Float32Array(N * N);
    const fixed = new Uint8Array(N * N);     // 0 自由・1 導体・2 外枠
    const bc = new Float32Array(N * N);      // 外枠の値
    const src = new Float32Array(N * N);     // 電荷の密度
    let Vc = 0;                              // 中性の導体の電位（重ね合わせの係数）
    let conductor = { kind: 'none', cx: 0, cz: 0, rOut: 0, rIn: 0 };
    let sceneId = 'sphere';
    let grounded = true;
    let solveLeft = 0, solve1Left = 0;      // まだ回す必要があるか（残りの上限回数）
    let condQ1 = 1;                          // φ1 のときの導体の電荷（形が決まれば固定）

    // ===== 道具箱 開閉 =====
    const toolboxPanel  = document.getElementById('toolboxPanel');
    const toolboxToggle = document.getElementById('toolboxToggle');
    toolboxToggle.addEventListener('click', () => {
      const collapsed = toolboxPanel.classList.toggle('is-collapsed');
      toolboxToggle.textContent = collapsed ? '＞' : '＜';
      toolboxToggle.setAttribute('aria-expanded', String(!collapsed));
    });

    // ===== 文字（スプライト）=====
    const YU = '"Yu Gothic","Meiryo",sans-serif';
    const _texCache = new Map();
    function makeTextSprite(text, h, opt = {}) {
      const { color = '#000', italic = false, bold = false, bg = null, family = '"Times New Roman", serif' } = opt;
      const key = `${text}|${color}|${italic}|${bold}|${bg}|${family}`;
      let cached = _texCache.get(key);
      if (!cached) {
        const size = 64, font = `${italic ? 'italic ' : ''}${bold ? 'bold ' : ''}${size}px ${family}`;
        const meas = document.createElement('canvas').getContext('2d'); meas.font = font;
        const pad = Math.round(size * (bg ? 0.5 : 0.25));
        const c = document.createElement('canvas');
        c.width = Math.ceil(meas.measureText(text).width) + pad * 2; c.height = Math.round(size * (bg ? 1.7 : 1.45));
        const g = c.getContext('2d');
        if (bg) { g.fillStyle = bg; g.beginPath(); g.roundRect(2, 2, c.width - 4, c.height - 4, c.height * 0.26); g.fill(); }
        g.font = font; g.fillStyle = color; g.textAlign = 'center'; g.textBaseline = 'middle';
        g.fillText(text, c.width / 2, c.height / 2);
        const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
        cached = { tex: t, aspect: c.width / c.height };
        _texCache.set(key, cached);
      }
      const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: cached.tex, transparent: true, depthTest: false }));
      sp.scale.set(h * cached.aspect, h, 1);
      return sp;
    }
    function _clear(grp) {
      for (const o of grp.children) { if (o.isSprite) o.material.dispose(); else if (o.geometry) o.geometry.dispose(); }
      grp.clear();
    }

    // 矢じり（「く」の字）。先端を留め継ぎした 1 枚の多角形（CLAUDE.md §6）
    function makeChevronGeometry(x, zt, a, hb, w, y) {
      const m = Math.hypot(a, hb);
      const sgn = Math.sign(hb) || 1;
      const miter = (w / 2) * m / a;
      const onx =  Math.abs(hb) / m * (w / 2);
      const onz = -sgn * a / m * (w / 2);
      const apexOut = [x, zt - sgn * miter];
      const apexIn  = [x, zt + sgn * miter];
      const rx = x + a, lx = x - a, ez = zt + hb;
      const rOut = [rx + onx, ez + onz], rIn = [rx - onx, ez - onz];
      const lOut = [lx - onx, ez + onz], lIn = [lx + onx, ez - onz];
      const P = [];
      const push = (p) => P.push(p[0], y, p[1]);
      push(apexOut); push(lOut); push(lIn);
      push(apexOut); push(lIn);  push(apexIn);
      push(apexOut); push(apexIn); push(rIn);
      push(apexOut); push(rIn);   push(rOut);
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(P, 3));
      return g;
    }
    // 向き (dx, dz) を向く く の字。Z 向きに作って −90° 回すと ＋X 向き、そこから向きの角だけ回す（three の rotateY は ＋X を (cosθ, −sinθ) へ）
    function chevronToward(xTip, z, dx, dz, a, hb, w, y) {
      const ang = Math.atan2(dz, dx);
      return makeChevronGeometry(0, 0, a, hb, w, y).rotateY(-Math.PI / 2 - ang).translate(xTip, 0, z);
    }
    // 折れ線を太さ w の帯にする（電気力線・等電位線）
    function ribbonGeometry(pts, w, y) {
      const pos = [];
      for (let i = 0; i < pts.length - 1; i++) {
        const [x1, z1] = pts[i], [x2, z2] = pts[i + 1];
        const dx = x2 - x1, dz = z2 - z1, Ln = Math.hypot(dx, dz) || 1;
        const nx = -dz / Ln * w / 2, nz = dx / Ln * w / 2;
        pos.push(x1 + nx, y, z1 + nz,  x1 - nx, y, z1 - nz,  x2 - nx, y, z2 - nz,
                 x1 + nx, y, z1 + nz,  x2 - nx, y, z2 - nz,  x2 + nx, y, z2 + nz);
      }
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      return g;
    }

    // ===== 電荷の球（電位シミュと同じ見た目）=====
    function makeShadedSphereMaterial(hexColor) {
      return new THREE.ShaderMaterial({
        uniforms: { baseColor: { value: new THREE.Color(hexColor) } },
        vertexShader: `
          varying vec3 vNormalView;
          void main() {
            vNormalView = normalize(normalMatrix * normal);
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          uniform vec3 baseColor;
          varying vec3 vNormalView;
          void main() {
            vec3 N = normalize(vNormalView);
            vec3 V = vec3(0.0, 0.0, 1.0);
            float ndotv = max(dot(N, V), 0.0);
            float shade = pow(ndotv, 0.55);
            vec3 dark   = baseColor * 0.85;
            vec3 bright = mix(baseColor, vec3(1.0), 0.12);
            vec3 color  = mix(dark, bright, shade);
            vec3 L = normalize(vec3(-0.55, 0.65, 0.55));
            vec3 H = normalize(L + V);
            float spec = pow(max(dot(N, H), 0.0), 32.0);
            color += vec3(1.0) * spec * 0.85;
            float fresnel = pow(1.0 - ndotv, 3.0);
            color += baseColor * fresnel * 0.3;
            gl_FragColor = vec4(color, 1.0);
          }
        `,
      });
    }
    function makeSignTexture(plus) {
      const s = 256, cv = document.createElement('canvas'); cv.width = cv.height = s;
      const ctx = cv.getContext('2d'), cx = s / 2, cy = s / 2, armH = s * 0.46, armV = s * 0.403, wH = s * 0.08, wV = s * 0.095;
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(cx - armH, cy - wH / 2, armH * 2, wH);
      if (plus) ctx.fillRect(cx - wV / 2, cy - armV, wV, armV * 2);
      const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace; return tex;
    }
    const _plusTex = makeSignTexture(true), _minusTex = makeSignTexture(false);
    const _matPlus = makeShadedSphereMaterial(0xff5500), _matMinus = makeShadedSphereMaterial(0x0066ff);
    const _chargeGeo = new THREE.SphereGeometry(CHARGE_R, 28, 20);
    const charges = [];   // { mesh, sprite, q }
    const _crossDir = new THREE.Vector3();
    function updateCrossSprite(mesh, sprite) {
      camera.getWorldDirection(_crossDir).negate();
      sprite.position.copy(mesh.position).addScaledVector(_crossDir, CHARGE_R * 1.08);
      const size = CHARGE_R * 1.6; sprite.scale.set(size, size, 1);
    }
    function makeChargeMesh(sign) {
      const mesh = new THREE.Mesh(_chargeGeo, sign > 0 ? _matPlus : _matMinus);
      const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: sign > 0 ? _plusTex : _minusTex, transparent: true, depthTest: false, depthWrite: false }));
      scene.add(mesh); scene.add(sprite);
      return { mesh, sprite, q: sign * Q_UNIT };
    }
    function removeCharge(c) {
      c.mesh.removeFromParent(); c.sprite.removeFromParent(); c.sprite.material.dispose();
      const i = charges.indexOf(c); if (i !== -1) charges.splice(i, 1);
      markDirty();
    }

    // ===== 導体（球＝円板・輪）=====
    const conductorMat = (function () {   // 上から見た金属の質感（真ん中が明るい）
      const s = 256, c = document.createElement('canvas'); c.width = c.height = s;
      const g = c.getContext('2d');
      const grad = g.createRadialGradient(s * 0.42, s * 0.4, s * 0.05, s * 0.5, s * 0.5, s * 0.55);
      grad.addColorStop(0.00, '#d3d9e2');
      grad.addColorStop(0.45, '#a3abb6');
      grad.addColorStop(0.80, '#7e8792');
      grad.addColorStop(1.00, '#5f6773');
      g.fillStyle = grad; g.fillRect(0, 0, s, s);
      const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
      return new THREE.MeshBasicMaterial({ map: t });
    })();
    const condGroup = new THREE.Group(); scene.add(condGroup);
    const groundGroup = new THREE.Group(); scene.add(groundGroup);

    function hideCtx() { _ctxMenuEl.style.display = 'none'; ctxTarget = null; ctxArrowTarget = -1; }
    function showCtxAt(cx, cy) { _ctxMenuEl.style.left = cx + 'px'; _ctxMenuEl.style.top = cy + 'px'; _ctxMenuEl.style.display = 'block'; }
    renderer.domElement.addEventListener('contextmenu', e => {
      const c = checkHoverCharge(e.clientX, e.clientY);
      if (c) { e.preventDefault(); ctxTarget = c; ctxArrowTarget = -1; showCtxAt(e.clientX, e.clientY); return; }
      const ai = window._hitArrowAt?.(e.clientX, e.clientY) ?? -1;
      if (ai >= 0) { e.preventDefault(); ctxTarget = null; ctxArrowTarget = ai; showCtxAt(e.clientX, e.clientY); return; }
      hideCtx();
    });
    _ctxDeleteBtn.addEventListener('click', () => {
      if (ctxTarget) removeCharge(ctxTarget);
      else if (ctxArrowTarget >= 0) window._deleteArrowAt?.(ctxArrowTarget);
      hideCtx();
    });
    window.addEventListener('pointerdown', e => { if (_ctxMenuEl.style.display !== 'none' && !_ctxMenuEl.contains(e.target)) hideCtx(); });

    // ===== メインループ =====
    setScene('sphere');
    function rebuildVisuals() {
      buildFieldLines(); buildEquipotentials(); buildInduced(); buildColor(); buildNote();
    }
    function tick() {
      requestAnimationFrame(tick);
      controls.update();
      // 解き進める（毎コマ 40 回まで）。変わったコマと、解き終わったコマに描き直す
      const did = solveStep(40);
      if (did || visualsDirty) { rebuildVisuals(); visualsDirty = !converged; }
      for (const c of charges) updateCrossSprite(c.mesh, c.sprite);
      if (window._inkDirty   && window._inkBoardTex)   { window._inkBoardTex.needsUpdate   = true; window._inkDirty   = false; }
      if (window._shapeDirty && window._shapeBoardTex) { window._shapeBoardTex.needsUpdate = true; window._shapeDirty = false; }

    }
    tick();
// ===== 図形描画モジュール =====
(function(){
  const DB_Z = -8, DB_W = 20, DB_H = 12;
  const PEN_COLOR = 'rgba(255,40,40,1.0)', PEN_W = 2, ERASER_W = 20;
  const _dr = new THREE.Raycaster(), _dm = new THREE.Vector2();

  let inkMode = 'none', _inkDrawing = false;
  let _inkBoardMesh = null, _inkBoardCanvas = null, _inkBoardCtx = null;
  window._inkBoardTex = null;
  let _activeCtx = null, _activeMesh = null;
  let _lastX = 0, _lastY = 0;
  window._inkDirty = false;

  let shapeMode = 'none', _shapeDrawing = false;
  let _sx = 0, _sy = 0, _cx = 0, _cy = 0;
  let _shapeBoardMesh = null, _shapeBoardCanvas = null, _shapeBoardCtx = null;
  window._shapeBoardTex = null;
  window._shapeDirty = false;
  const shapes = [];
  let selIdx = -1, selDragging = false, selHandle = null, selOrigin = null, selSnap = null;

  window._getDrawingToolActive = () => inkMode !== 'none' || shapeMode !== 'none';

  function _fitBoard(mesh, cam) {
    let vw, vh;
    if (cam.isOrthographicCamera) {
      vh = (cam.top - cam.bottom) / cam.zoom;
      vw = (cam.right - cam.left) / cam.zoom;
    } else {
      vh = 2 * Math.abs(DB_Z) * Math.tan(cam.fov * Math.PI / 360);
      vw = vh * cam.aspect;
    }
    const s = Math.max(vw / DB_W, vh / DB_H);
    mesh.scale.set(s, s, 1);
  }
  window._syncDrawingBoards = (cam) => {
    if (!cam) return;
    for (const m of [_inkBoardMesh, _shapeBoardMesh]) {
      if (!m) continue;
      if (m.parent !== cam) cam.add(m);
      _fitBoard(m, cam);
    }
  };

  function getNDC(ev) {
    const r = renderer.domElement.getBoundingClientRect();
    _dm.set(((ev.clientX-r.left)/r.width)*2-1, -((ev.clientY-r.top)/r.height)*2+1);
  }
  function uv2xy(uv, cvs) { return { x: uv.x*cvs.width, y: (1-uv.y)*cvs.height }; }

  function _makeBoard(zOffset, order) {
    const cvs = document.createElement('canvas');
    cvs.width = 1024; cvs.height = 614;
    const ctx = cvs.getContext('2d');
    ctx.lineCap = ctx.lineJoin = 'round';
    const tex = new THREE.CanvasTexture(cvs);
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.generateMipmaps = false;
    tex.minFilter = THREE.LinearFilter;
    const mat = new THREE.MeshBasicMaterial({ map: tex, transparent:true, opacity:1, side:THREE.FrontSide, depthWrite:false, depthTest:false });
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(DB_W, DB_H), mat);
    mesh.position.set(0, 0, DB_Z + zOffset);
    mesh.renderOrder = order;
    camera.add(mesh);
    _fitBoard(mesh, camera);
    return { cvs, ctx, tex, mesh };
  }

  function ensureInk() {
    if (_inkBoardMesh) return;
    const b = _makeBoard(0, 200);
    _inkBoardCanvas = b.cvs; _inkBoardCtx = b.ctx; window._inkBoardTex = b.tex; _inkBoardMesh = b.mesh;
  }
  function ensureShape() {
    if (_shapeBoardMesh) return;
    const b = _makeBoard(-0.01, 201);
    _shapeBoardCanvas = b.cvs; _shapeBoardCtx = b.ctx; window._shapeBoardTex = b.tex; _shapeBoardMesh = b.mesh;
  }

  function setInkMode(next) {
    inkMode = inkMode === next ? 'none' : next;
    if (inkMode !== 'none') { ensureInk(); shapeMode='none'; document.getElementById('toolArrow').classList.remove('active'); selIdx=-1; redrawShapes(); if(_shapeDrawing) endShapeDraw(); }
    document.getElementById('toolPen').classList.toggle('active', inkMode==='pen');
    document.getElementById('toolEraser').classList.toggle('active', inkMode==='eraser');
    if (_inkDrawing) endInk();
  }
  function clearInk() {
    if (_inkBoardCtx && _inkBoardCanvas) { _inkBoardCtx.clearRect(0,0,_inkBoardCanvas.width,_inkBoardCanvas.height); if(window._inkBoardTex) window._inkBoardTex.needsUpdate=true; }
  }

  function tryStartInk(ev) {
    if (inkMode==='none') return false;
    ensureInk();
    if (!_inkBoardMesh) return false;
    getNDC(ev); _dr.setFromCamera(_dm, camera);
    const h = _dr.intersectObject(_inkBoardMesh, false);
    if (!h.length || !h[0].uv) return false;
    const xy = uv2xy(h[0].uv, _inkBoardCanvas);
    _activeCtx=_inkBoardCtx; _activeMesh=_inkBoardMesh;
    _lastX=xy.x; _lastY=xy.y; _inkDrawing=true;
    if (inkMode==='pen') { _activeCtx.globalCompositeOperation='source-over'; _activeCtx.strokeStyle=PEN_COLOR; _activeCtx.lineWidth=PEN_W; }
    else { _activeCtx.globalCompositeOperation='destination-out'; _activeCtx.strokeStyle='rgba(0,0,0,1)'; _activeCtx.lineWidth=ERASER_W; }
    _activeCtx.beginPath(); _activeCtx.moveTo(_lastX,_lastY); _activeCtx.lineTo(_lastX+0.01,_lastY+0.01); _activeCtx.stroke();
    controls.enabled=false; try{renderer.domElement.setPointerCapture(ev.pointerId);}catch(e){}
    window._inkDirty=true; ev.preventDefault(); ev.stopPropagation(); return true;
  }
  function updateInk(ev) {
    if (!_inkDrawing || !_activeMesh) return;
    getNDC(ev); _dr.setFromCamera(_dm, camera);
    const h = _dr.intersectObject(_activeMesh, false);
    if (!h.length || !h[0].uv) return;
    const xy = uv2xy(h[0].uv, _inkBoardCanvas);
    _activeCtx.beginPath(); _activeCtx.moveTo(_lastX,_lastY); _activeCtx.lineTo(xy.x,xy.y); _activeCtx.stroke();
    _lastX=xy.x; _lastY=xy.y; window._inkDirty=true; ev.preventDefault();
  }
  function endInk(ev) {
    if (!_inkDrawing) return;
    _inkDrawing=false; controls.enabled=true;
    try{renderer.domElement.releasePointerCapture(ev?.pointerId);}catch(e){}
  }

  function drawArrow(ctx, x1, y1, x2, y2) {
    const dx=x2-x1, dy=y2-y1, len=Math.hypot(dx,dy);
    if (len<2) return;
    const ang=Math.atan2(dy,dx), hw=Math.max(8,Math.min(24,len*0.10)), ha=Math.PI/8;
    function pass(w,c){ ctx.globalCompositeOperation='source-over'; ctx.strokeStyle=c; ctx.lineWidth=w; ctx.lineCap='round'; ctx.lineJoin='round';
      ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x2,y2); ctx.lineTo(x2-hw*Math.cos(ang-ha),y2-hw*Math.sin(ang-ha)); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x2,y2); ctx.lineTo(x2-hw*Math.cos(ang+ha),y2-hw*Math.sin(ang+ha)); ctx.stroke(); }
    pass(PEN_W+2,'rgba(0,0,0,0.88)'); pass(PEN_W,PEN_COLOR);
  }
  function drawHandle(ctx, x, y, isMid=false) {
    ctx.save(); ctx.fillStyle=isMid?'#88ccff':'#ffffff'; ctx.strokeStyle='#4499ff'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(x,y,5,0,Math.PI*2); ctx.fill(); ctx.stroke(); ctx.restore();
  }
  function drawShape(ctx, s, sel) {
    ctx.globalCompositeOperation='source-over';
    if (s.type==='arrow') { drawArrow(ctx,s.x1,s.y1,s.x2,s.y2);
      if (sel) { drawHandle(ctx,s.x1,s.y1); drawHandle(ctx,s.x2,s.y2); drawHandle(ctx,(s.x1+s.x2)/2,(s.y1+s.y2)/2,true); } }
  }
  function redrawShapes() {
    if (!_shapeBoardCtx) return;
    _shapeBoardCtx.clearRect(0,0,_shapeBoardCanvas.width,_shapeBoardCanvas.height);
    shapes.forEach((s,i)=>drawShape(_shapeBoardCtx,s,i===selIdx));
    window._shapeDirty=true;
  }

  function setShapeMode(next) {
    shapeMode = shapeMode===next?'none':next;
    if (shapeMode!=='none') { ensureShape(); selIdx=-1; redrawShapes(); inkMode='none'; document.getElementById('toolPen').classList.remove('active'); document.getElementById('toolEraser').classList.remove('active'); if(_inkDrawing)endInk(); }
    document.getElementById('toolArrow').classList.toggle('active', shapeMode==='arrow');
  }
  function tryStartShape(ev) {
    if (shapeMode==='none') return false;
    ensureShape(); if(!_shapeBoardMesh) return false;
    getNDC(ev); _dr.setFromCamera(_dm, camera);
    const h=_dr.intersectObject(_shapeBoardMesh,false);
    if (!h.length||!h[0].uv) return false;
    const xy=uv2xy(h[0].uv,_shapeBoardCanvas);
    _sx=xy.x; _sy=xy.y; _cx=xy.x; _cy=xy.y; _shapeDrawing=true;
    controls.enabled=false; try{renderer.domElement.setPointerCapture(ev.pointerId);}catch(e){}
    ev.preventDefault(); ev.stopPropagation(); return true;
  }
  function updateShape(ev) {
    if (!_shapeDrawing||!_shapeBoardMesh) return;
    getNDC(ev); _dr.setFromCamera(_dm,camera);
    const h=_dr.intersectObject(_shapeBoardMesh,false);
    if (!h.length||!h[0].uv) return;
    const xy=uv2xy(h[0].uv,_shapeBoardCanvas);
    _cx=xy.x; _cy=xy.y;
    _shapeBoardCtx.clearRect(0,0,_shapeBoardCanvas.width,_shapeBoardCanvas.height);
    shapes.forEach((s,i)=>drawShape(_shapeBoardCtx,s,i===selIdx));
    drawArrow(_shapeBoardCtx,_sx,_sy,_cx,_cy);
    window._shapeDirty=true; ev.preventDefault();
  }
  function endShapeDraw(ev) {
    if (!_shapeDrawing) return;
    _shapeDrawing=false; controls.enabled=true;
    try{renderer.domElement.releasePointerCapture(ev?.pointerId);}catch(e){}
    if (Math.hypot(_cx-_sx,_cy-_sy)>=4) shapes.push({type:'arrow',x1:_sx,y1:_sy,x2:_cx,y2:_cy});
    redrawShapes(); shapeMode='none'; document.getElementById('toolArrow').classList.remove('active');
  }

  function distSeg(px,py,x1,y1,x2,y2){ const dx=x2-x1,dy=y2-y1,l2=dx*dx+dy*dy; if(!l2) return Math.hypot(px-x1,py-y1); const t=Math.max(0,Math.min(1,((px-x1)*dx+(py-y1)*dy)/l2)); return Math.hypot(px-(x1+t*dx),py-(y1+t*dy)); }
  function hitShape(s,cx,cy){ return s.type==='arrow'&&distSeg(cx,cy,s.x1,s.y1,s.x2,s.y2)<12; }
  function hitHandles(s,cx,cy){ if(s.type==='arrow'){ if(Math.hypot(cx-s.x1,cy-s.y1)<8)return'start'; if(Math.hypot(cx-s.x2,cy-s.y2)<8)return'end'; if(Math.hypot(cx-(s.x1+s.x2)/2,cy-(s.y1+s.y2)/2)<8)return'mid'; } return null; }

  window._hitArrowAt = (clientX, clientY) => {
    if (!_shapeBoardMesh || !shapes.length) return -1;
    getNDC({ clientX, clientY }); _dr.setFromCamera(_dm, camera);
    const h = _dr.intersectObject(_shapeBoardMesh, false);
    if (!h.length || !h[0].uv) return -1;
    const {x:cx, y:cy} = uv2xy(h[0].uv, _shapeBoardCanvas);
    for (let i=shapes.length-1; i>=0; i--) if (hitShape(shapes[i],cx,cy)) return i;
    return -1;
  };
  window._deleteArrowAt = (i) => {
    if (i < 0 || i >= shapes.length) return;
    shapes.splice(i, 1);
    if (selIdx === i) selIdx = -1; else if (selIdx > i) selIdx--;
    redrawShapes();
  };

  function tryStartSel(ev) {
    if (shapeMode!=='none'||inkMode!=='none') return false;
    if (!_shapeBoardMesh) return false;
    getNDC(ev); _dr.setFromCamera(_dm,camera);
    const h=_dr.intersectObject(_shapeBoardMesh,false);
    if (!h.length||!h[0].uv) return false;
    const {x:cx,y:cy}=uv2xy(h[0].uv,_shapeBoardCanvas);
    if (selIdx>=0) { const hh=hitHandles(shapes[selIdx],cx,cy); if(hh){ selHandle=hh; selOrigin={x:cx,y:cy}; selSnap={...shapes[selIdx]}; selDragging=true; controls.enabled=false; try{renderer.domElement.setPointerCapture(ev.pointerId);}catch(e){} ev.preventDefault(); ev.stopPropagation(); return true; } }
    for (let i=shapes.length-1;i>=0;i--) { if(hitShape(shapes[i],cx,cy)){ selIdx=i; selDragging=false; redrawShapes(); ev.preventDefault(); ev.stopPropagation(); return true; } }
    if (selIdx>=0) { selIdx=-1; redrawShapes(); }
    return false;
  }
  function updateSel(ev) {
    if (!selDragging||selIdx<0) return;
    if (!_shapeBoardMesh) return;
    getNDC(ev); _dr.setFromCamera(_dm,camera);
    const h=_dr.intersectObject(_shapeBoardMesh,false);
    if (!h.length||!h[0].uv) return;
    const {x,y}=uv2xy(h[0].uv,_shapeBoardCanvas);
    const s=shapes[selIdx];
    if (s.type==='arrow') {
      if (selHandle==='start'){s.x1=x;s.y1=y;}
      else if(selHandle==='end'){s.x2=x;s.y2=y;}
      else if(selHandle==='mid'&&selOrigin&&selSnap){const dx=x-selOrigin.x,dy=y-selOrigin.y;s.x1=selSnap.x1+dx;s.y1=selSnap.y1+dy;s.x2=selSnap.x2+dx;s.y2=selSnap.y2+dy;}
    }
    redrawShapes(); ev.preventDefault();
  }
  function endSel(ev) {
    if (!selDragging) return;
    selDragging=false; selHandle=null; selOrigin=null; selSnap=null; controls.enabled=true;
    try{renderer.domElement.releasePointerCapture(ev?.pointerId);}catch(e){}
  }

  document.getElementById('toolPen').addEventListener('click', ()=>setInkMode('pen'));
  document.getElementById('toolEraser').addEventListener('click', ()=>setInkMode('eraser'));
  document.getElementById('inkClear').addEventListener('click', clearInk);
  document.getElementById('toolArrow').addEventListener('click', ()=>setShapeMode('arrow'));
  document.getElementById('shapeClear').addEventListener('click', ()=>{ shapes.length=0;selIdx=-1;if(_shapeBoardCtx)redrawShapes(); });

  renderer.domElement.addEventListener('pointerdown', e=>{ if(e.button===0) tryStartShape(e)||tryStartSel(e)||tryStartInk(e); });
  window.addEventListener('pointermove', e=>{ if(_shapeDrawing){updateShape(e);return;} if(selDragging){updateSel(e);return;} if(_inkDrawing){updateInk(e);return;} });
  window.addEventListener('pointerup',     e=>{ if(e.button===0){endShapeDraw(e);endSel(e);endInk(e);} });
  window.addEventListener('pointercancel', e=>{ endShapeDraw(e);endSel(e);endInk(e); });
  window.addEventListener('keydown', e=>{
    const tag=document.activeElement?.tagName;
    if(selIdx>=0&&(e.key==='Delete'||e.key==='Backspace')&&tag!=='INPUT'&&tag!=='TEXTAREA'){
      shapes.splice(selIdx,1);selIdx=-1;redrawShapes();e.preventDefault();
    }
  });
})();
  </script>
