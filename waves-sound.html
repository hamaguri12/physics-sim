<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>音｜波動｜高校物理シミュ集</title>
  <style>
    body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#ffffff;color:#1a2040}
    header{padding:18px 20px;border-bottom:1px solid rgba(70,90,160,0.30);display:flex;gap:12px;align-items:center}
    a.back{color:#1a2040;text-decoration:none;border:1px solid rgba(70,90,160,0.30);padding:8px 10px;border-radius:12px;background:rgba(240,243,252,0.95)}
    a.back:hover{opacity:.9}
    h1{margin:0;font-size:18px}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;padding:16px}
    a.card{display:block;text-decoration:none;color:inherit;background:rgba(240,243,252,0.95);
      border:1px solid rgba(70,90,160,0.30);border-radius:14px;padding:16px;
      transition:border-color .15s, box-shadow .15s, background .15s;
      /* 押すだけのボタンなので、文字を選べないようにし、リンクのドラッグも切る。
         文字を選んでしまうと次のクリックが「選択のドラッグ」になり、
         押したまま数px動かすと「リンクのドラッグ」になって、どちらもクリックが消える */
      user-select:none;-webkit-user-select:none;-webkit-user-drag:none}
    /* マウスを乗せてもカードの位置を動かさない。
       以前は translateY(-2px) で浮かせていたが、カードが 2px 上へ逃げるので
       下の縁にカーソルがあると「当たる→外れる」を繰り返し、クリックが空振りしていた
       （2026-09-14 実測：5 枚中 4 枚で発生）。動かさずに 枠と影 で反応を見せる */
    a.card:hover{border-color:rgba(70,90,160,0.55);background:rgba(232,238,252,0.98);
      box-shadow:0 4px 12px rgba(70,90,160,0.18)}
    .title{font-weight:800;font-size:15px;margin-bottom:8px}
    .desc{font-size:12px;color:#5566aa;line-height:1.45}
    /* 準備中のボタンは「押せない見た目」にする。押しても何も起きないのが正しい姿なので、
       ふつうのボタンと同じ見た目だと「壊れている」と見えてしまう（2026-09-16） */
    a.card.soon{background:rgba(236,238,244,0.85);border-style:dashed;
      border-color:rgba(70,90,160,0.22);cursor:default}
    a.card.soon .title{color:#7a83a0}
    a.card.soon .desc{color:#9aa2bb}
    a.card.soon:hover{border-color:rgba(70,90,160,0.22);background:rgba(236,238,244,0.85);
      box-shadow:none}
    /* 押したときの知らせ。ブラウザのダイアログは使わない
       ── ダイアログは「このページでこれ以上表示しない」やポリシーで止まることがあり、
          止まると「押しても何も起きないボタン」になってしまうため */
    #soonToast{
      position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
      background:rgba(26,32,64,0.92);color:#fff;font-size:13px;font-weight:700;
      padding:10px 18px;border-radius:999px;
      pointer-events:none;              /* 下のボタンのクリックを横取りしない */
      opacity:0;transition:opacity .18s;z-index:9999
    }
    #soonToast.show{opacity:1}
  </style>
  <script data-goatcounter="https://hamaguri12-physics-sim.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</head>
<body>
  <header>
    <a class="back" href="waves.html">← 波動へ</a>
    <h1>音</h1>
  </header>

  <div class="grid">
    <a class="card soon" href="#" onclick="return showSoon(event)">
      <div class="title">音の伝わり方</div>
      <div class="desc">準備中</div>
    </a>
    <a class="card soon" href="#" onclick="return showSoon(event)">
      <div class="title">発音体の振動と共振・共鳴</div>
      <div class="desc">準備中</div>
    </a>
    <a class="card soon" href="#" onclick="return showSoon(event)">
      <div class="title">音のドップラー効果</div>
      <div class="desc">準備中</div>
    </a>
  </div>
  <div id="soonToast">準備中です</div>
  <script>
    // 準備中のボタンを押したときの知らせ（alert のかわり）
    (function () {
      var t = document.getElementById('soonToast'), timer = null;
      window.showSoon = function (e) {
        if (e && e.preventDefault) e.preventDefault();
        t.classList.add('show');
        clearTimeout(timer);
        timer = setTimeout(function () { t.classList.remove('show'); }, 1600);
        return false;
      };
    })();
  </script>
</body>
</html>
